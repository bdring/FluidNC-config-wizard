  // opto-isolated input's internal_pullup_required) currently only ever
  // appear on generic_pins entries (see pinWidgetHtml()'s use of this).
  genericPinProfiles = {};
  (board.generic_pins || []).forEach(p => {
    if (p.input_profile) genericPinProfiles[p.mcu_pin] = p.input_profile;
  });
  hotspotData = null;
  if (hotspotId) {
    const hotspotText = await fetchYamlTextOptional(`hotspots/${hotspotId}.hotspots.yaml`);
    hotspotData = hotspotText ? jsyaml.load(hotspotText) : null;
  }
  computeResourcePins();
  renderResources();
  renderHotspotPane();
  wireHotspotHoverLinks();
  generateDraft();
}

/* Reads a locally-picked board.yaml file (via the "Custom..." picker
 * option, see its wiring near the picker setup below) and loads it exactly
 * like a repo board, minus the hotspots.yaml lookup (no repo id to look
 * one up by) and the boards/index.json manifest (this file was never in
 * it -- that's the point: it lets a contributor try out a board.yaml
 * before it even lives in boards/, without needing an HTTP-served copy of
 * it there). Reading the file directly like this needs no HTTP serving of
 * the file itself (FileReader works from a file:// picker dialog same as
 * anywhere else) -- only the chip-file lookup above still needs this page
 * itself to be served over HTTP, same as everywhere else in the wizard. */
function loadCustomBoardFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let doc;
    try {
      doc = jsyaml.load(reader.result);
    } catch (e) {
      document.getElementById("resourceCol").innerHTML = `<div class="note note-error">` +
        `Couldn't parse ${escapeAttr(file.name)} (${escapeAttr(e.message)}).</div>`;
      return;
    }
    syncUrlToBoard(null); // no repo id to represent a local file with
    await applyBoardDoc(doc, null);
  };
  reader.onerror = () => {
    document.getElementById("resourceCol").innerHTML = `<div class="note note-error">` +
      `Couldn't read ${escapeAttr(file.name)}.</div>`;
  };
  reader.readAsText(file);
}

/* Builds resourcePins (resourceKey -> [pin, ...]) from the board's own
 * facts -- same resourceKey*() helpers and the same section-by-section walk
 * renderResources() uses, so a resource's key here always matches the key
 * its row is rendered/bound under. Purely a physical-pin fact, independent
 * of whatever role (if any) ends up bound to a given resource. */
function computeResourcePins() {
  resourcePins = {};
  resourceLabels = {};
  // resourceKey -> generic_name (see gname()), same universe of keys as
  // resourceLabels/resourcePins -- this is the vocabulary hotspots.yaml
  // itself is now authored in (each hotspot's single "generic_name" is a
  // generic name, not a vendor label -- a hotspots file is meant to be
  // board-agnostic-legible, and vendor silkscreen text varies wildly/
  // verbosely board to board, e.g. Corgi's "Motor Driver Signals -
  // i2so.1,2,0"). Used for BOTH display (the hotspot corner chip shows
  // hotspots.yaml's generic_name verbatim, no lookup needed) and matching
  // (getRowRoleInfo()/jumpToGenericName()/wireHotspotHoverLinks() all key
  // off this, not resourceLabels). genericNameToVendorLabel is the
  // reverse, used only to populate the "generic (vendor)" hover text
  // refreshHotspotStates() builds, same format the left-pane rows' own
  // hover title uses.
  resourceGenericNames = {};
  genericNameToVendorLabel = {};
  function record(key, label, generic) {
    resourceLabels[key] = label;
    resourceGenericNames[key] = generic;
    genericNameToVendorLabel[generic] = label;
  }
  (board.motor_sockets && board.motor_sockets.sockets || []).forEach((s, i) => {
    resourcePins[resourceKeyMotor(i)] = Object.values(s.pins || {});
    record(resourceKeyMotor(i), s.label, gname(s));
  });
  (board.generic_pins || []).forEach((p, i) => {
    resourcePins[resourceKeyPin(i)] = [p.mcu_pin];
    record(resourceKeyPin(i), p.label, gname(p));
  });
  // Module sockets (see MODULE_CATALOG/resolveModuleSocketConnectors()) --
  // the socket itself is recorded (for hotspot hover-linking against the
  // board's own socket hotspot) but has no resourcePins of its own; a
  // module CHOICE isn't itself a FluidNC role, only its resolved
  // connectors (below) are. This depends on `bindings` (which module, if
  // any, is currently assigned) unlike every other section above, so
  // computeResourcePins() must be re-run any time a socket's module
  // choice changes, not just once at board load -- see renderResources()'
  // module-socket picker onchange handler.
  (board.expansion_sockets || []).forEach((s, si) => {
    record(resourceKeyModuleSocket(si), s.label, gname(s));
  });
  allModuleSocketConnectors().forEach(({ si, key, socket: s, connector: c, moduleName }) => {
    const pins = c.kind === "generic_pin" ? [c.mcu_pin]
      : c.kind === "expansion_uart" ? [c.txd_pin, c.rxd_pin]
      : [c.tx_pin, c.rx_pin, c.rts_pin];
    resourcePins[key] = pins.filter(Boolean);
    // Matches the exact label string generateDraft()'s dispatch loops
    // build for this same resource (`${s.label}/${moduleName}/${c.label}`) -- must stay
    // identical so a comment hint scraped from an exported file's
    // "# <label>" line matches this map's value exactly, same convention
    // the old per-pin expansion_sockets resource used before module
    // sockets existed as their own concept.
    record(key, `${s.label}/${moduleName}/${c.label}`, `${gname(s)}/${c.generic_name}`);
  });
  (board.rs485_channels || []).forEach((ch, i) => {
    resourcePins[resourceKeyRs485(i)] = [ch.tx_pin, ch.rx_pin, ch.rts_pin].filter(Boolean);
    record(resourceKeyRs485(i), ch.label, gname(ch));
  });
  (board.expansion_uarts || []).forEach((ex, i) => {
    resourcePins[resourceKeyExpUart(i)] = [ex.txd_pin, ex.rxd_pin].filter(Boolean);
    record(resourceKeyExpUart(i), ex.label, gname(ex));
  });
  (board.i2c_connectors || []).forEach((ic, i) => {
    resourcePins[resourceKeyI2c(i)] = [ic.sda_pin, ic.scl_pin].filter(Boolean);
    record(resourceKeyI2c(i), ic.label, gname(ic));
  });
}

/* GPIO conflict detection: two DIFFERENT resources sometimes share the SAME
 * physical pin on purpose (a board's own documented dual-purpose connector,
 * e.g. Corgi's gpio.4 being both a plain "5V Out (shared w/ MOSFET1)" pin
 * and a "MOSFET1" driver pin) -- only one of them can actually be used in a
 * real config. Whenever a resource gets bound to a role, its pins go into a
 * "used" list; every UNASSIGNED resource that shares a pin with something
 * already used gets its role selector(s) disabled with an "already assigned to"
 * note, so the user can't accidentally double-bind the same wire. Recomputed
 * on every binding change (called from generateDraft(), same pattern as
 * refreshHotspotStates()), so undoing the owning resource's binding
 * immediately re-enables the conflicting one again. */
function refreshGpioConflicts() {
  const usedGpios = {}; // pin -> { key, label }
  Object.keys(resourcePins).forEach(key => {
    const row = document.querySelector(`#resourceCol .row[data-resource-key="${key}"]`);
    if (!row) return;
    // Only the FIRST visible select determines assigned-state, matching
    // getRowRoleInfo()'s existing convention -- a hidden secondary select
    // (e.g. output rows' per-pin picker after switching back to Unused)
    // keeps its last value even while hidden, so checking every select
    // regardless of visibility would wrongly treat that as still assigned.
    const selects = Array.from(row.querySelectorAll("select")).filter(s => s.style.display !== "none" && s.options.length);
    const assigned = selects.length && selects[0].value !== "unused" && selects[0].value !== "";
    if (!assigned) return;
    const label = row.querySelector(".name") ? row.querySelector(".name").textContent : key;
    resourcePins[key].forEach(pin => {
      if (!usedGpios[pin]) usedGpios[pin] = { key, label };
    });
  });

  Object.keys(resourcePins).forEach(key => {
    const row = document.querySelector(`#resourceCol .row[data-resource-key="${key}"]`);
    if (!row) return;
    const allSelects = Array.from(row.querySelectorAll("select"));
    const visibleSelects = allSelects.filter(s => s.style.display !== "none" && s.options.length);
    const assigned = visibleSelects.length && visibleSelects[0].value !== "unused" && visibleSelects[0].value !== "";
    // .row.assigned -- the green box, same "has a role" signal as the
    // hotspot photo's own assigned coloring (see that class's own
    // comment). Toggled here rather than a separate pass since this loop
    // already computes `assigned` per row for the conflict logic below.
    row.classList.toggle("assigned", !!assigned);
    const note = row.querySelector(".conflict-note");
    if (assigned) {
      // Never disable/relabel an already-assigned resource -- conflicts are
      // only surfaced on the side that hasn't committed to anything yet.
      row.classList.remove("gpio-conflict");
      allSelects.forEach(s => { s.disabled = false; });
      if (note) note.style.display = "none";
      return;
    }
    const conflict = resourcePins[key]
      .map(pin => usedGpios[pin])
      .find(owner => owner && owner.key !== key);
    row.classList.toggle("gpio-conflict", !!conflict);
    // Disable ALL selects in the row (not just the first), including a
    // currently-hidden secondary one, so it can't be revealed mid-conflict
    // by switching primary categories.
    allSelects.forEach(s => { s.disabled = !!conflict; });
    if (note) {
      if (conflict) {
        note.textContent = `already assigned to ${conflict.label}`;
        note.title = note.textContent; // full text on hover in case it's ellipsis-truncated
        note.style.display = "flex";
      } else {
        note.style.display = "none";
      }
    }
  });
}

/* Role-uniqueness: the SAME FluidNC role (e.g. "X axis / First Motor",
 * i.e. bindings value "x:motor0") shouldn't be assignable to two different
 * resources -- two physical motor sockets both claiming to drive "X axis
 * First Motor" is never correct, same idea for e.g. two different pins both
 * set to "Digital Output 0" or both set to "Probe". Unlike GPIO conflicts
 * (a hardware fact, independent of role), this is purely about the ROLE
 * value itself being claimed elsewhere, regardless of which physical pin(s)
 * are involved.
 *
 * bindings[key] already stores exactly one canonical, directly-comparable
 * "full role" string for every row type (confirmed by reading each row
 * builder's own onchange handler): makeRow's raw select value, makeOutputRow's
 * "category" or "category:subvalue", makeInputRow's full ":"-joined leaf
 * path -- so a single claimed-values map keyed by that string covers all
 * three uniformly. What differs per row type is WHICH <option> elements
 * represent a "complete" role worth checking:
 *   - makeRow: every option IS a complete role (its own value).
 *   - makeOutputRow: only options that DON'T cascade (no secondary select --
 *     today, only "unused") are complete on the primary select; every real
 *     category (spindle/coolant/user_output/status_output/sdcard/axis/...)
 *     cascades, so its completion happens on the secondary select's options
 *     instead ("<primary.value>:<secondary option value>").
 *   - makeInputRow: only the DEEPEST select's options are complete (their
 *     path segments plus every select's value strictly before them) -- by
 *     construction (see render()'s `while (node.children)` loop) that's
 *     always the LAST <select> rendered in .cascade-controls, whatever the
 *     tree's depth for that particular branch.
 * Called at the end of generateDraft(), same live-refresh pattern as
 * refreshGpioConflicts()/refreshHotspotStates(). */

/* Enumerates every leaf path reachable from `node` (DFS, tree key order),
 * each prefixed with `segs`. Shared by refreshRoleUniqueness() (to check
 * whether an entire BRANCH -- not just a single leaf -- is exhausted, so it
 * can gray the branch option out too, not just leaves) and makeInputRow's
 * own firstLeafPathFrom() (auto-fill). Hoisted to top-level scope since both
 * need it and neither owns the tree data exclusively. */
function enumerateLeafPaths(node, segs) {
  if (!node.children) return [segs];
  let out = [];
  Object.keys(node.children).forEach(k => out = out.concat(enumerateLeafPaths(node.children[k], segs.concat([k]))));
  return out;
}

/* If `fullValue` names a virtual-axis-motor slot, returns its canonical
 * "x:motor0"-shaped identity; otherwise null. Two DIFFERENT full-role
 * strings can name the same slot: a Motor socket's own bare form (e.g.
 * "x:motor0", written directly by makeInputRow against MOTOR_ROLE_TREE) and
 * an output-capable pin's "Axis -- RC Servo"/"Axis -- Solenoid" form (e.g.
 * "axis:rc_servo:x:motor0", written by makeOutputRow/makeInputRow against
 * the axis:/axis.rc_servo|solenoid branches -- see outputCategoryOptions()/
 * buildOutputRoleBranches()). Both ultimately write the same real
 * axes.<letter>.motorN: block in generateDraft(), so isRoleClaimedByOther()
 * below treats them as one claim regardless of which resource type holds
 * it. */
function axisSlotKeyOf(fullValue) {
  if (!fullValue) return null;
  const parts = fullValue.split(":");
  if (parts.length === 2 && AXES.includes(parts[0]) && MOTOR_LABELS[parts[1]]) {
    return fullValue;
  }
  if (parts[0] === "axis" && parts.length === 4 && AXES.includes(parts[2]) && MOTOR_LABELS[parts[3]]) {
    return `${parts[2]}:${parts[3]}`;
  }
  return null;
}

/* True if `fullValue` is currently bound to some resource other than
 * `ownKey` -- either literally, or (for axis-motor roles) via the shared
 * axis+motor-slot identity axisSlotKeyOf() extracts, OR because THIS
 * board's own fixed_peripherals data has already committed that role to a
 * real pin (see computeBoardFixedRoles()) -- board-fixed claims behave
 * exactly like a real resource's binding here, so a role a board has
 * already wired down is greyed out the same way an already-user-assigned
 * one is, with no separate UI code path needed. Single source of truth
 * for "is this role already taken", used both here and by makeInputRow's
 * firstLeafPathFrom()/makeOutputRow's unclaimed-preference and duplicate
 * guard, so all three can never disagree about what counts as claimed. */
function isRoleClaimedByOther(fullValue, ownKey) {
  if (BOARD_FIXED_ROLES.has(fullValue)) return true;
  const slot = axisSlotKeyOf(fullValue);
  return Object.keys(resourcePins).some(k => {
    if (k === ownKey) return false;
    const val = bindings[k];
    if (!val || val === "unused") return false;
    return val === fullValue || (slot !== null && axisSlotKeyOf(val) === slot);
  });
}

function refreshRoleUniqueness() {
  function applyDisable(opt, fullValue, ownKey) {
    if (opt.value === "unused") { opt.disabled = false; return; }
    opt.disabled = isRoleClaimedByOther(fullValue, ownKey);
  }

  Object.keys(resourcePins).forEach(key => {
    const row = document.querySelector(`#resourceCol .row[data-resource-key="${key}"]`);
    if (!row) return;

    const plainSel = row.querySelector(".ctrl-wrap select");
    if (plainSel) {
      Array.from(plainSel.options).forEach(opt => applyDisable(opt, opt.value, key));
      return;
    }

    const outputControls = row.querySelector(".output-controls");
    if (outputControls) {
      const [primary, secondary] = outputControls.querySelectorAll("select");
      // makeOutputRow() only ever renders for a single-pin resource (a
      // generic pin or a resolved module-socket connector) -- resourcePins
      // for one of those is always exactly [basePin], see
      // computeResourcePins(); needed here so cascadeOptionsFor() can drop
      // a "pwm"-tagged sub-option this exact pin can't serve.
      const basePin = (resourcePins[key] || [])[0];
      if (primary) {
        Array.from(primary.options).forEach(opt => {
          if (opt.value === "unused") { opt.disabled = false; return; }
          const copts = cascadeOptionsFor(opt.value, basePin);
          if (copts) {
            // A cascading category (spindle:*, user_output, ...) has no
            // single "complete" value of its own -- gray it out only if
            // EVERY one of its secondary options is already claimed by a
            // DIFFERENT resource (nothing left to pick under it), same
            // "gray the whole exhausted branch" idea as cascade rows below.
            const exhausted = copts.every(([v]) => isRoleClaimedByOther(`${opt.value}:${v}`, key));
            opt.disabled = exhausted;
            return;
          }
          applyDisable(opt, opt.value, key);
        });
      }
      if (secondary && secondary.style.display !== "none") {
        Array.from(secondary.options).forEach(opt => applyDisable(opt, `${primary.value}:${opt.value}`, key));
      }
      return;
    }

    const cascadeControls = row.querySelector(".cascade-controls");
    if (cascadeControls) {
      const selects = Array.from(cascadeControls.querySelectorAll("select"));
      const tree = row._cascadeTree;
      if (!selects.length || !tree) return;
      // Walk level by level (top select's options are the tree's own
      // top-level keys, so start with a synthetic node whose .children IS
      // the tree). At each select, an option whose node is a LEAF (no
      // .children) gets the usual exact-role check; an option whose node is
      // a BRANCH gets grayed out only if EVERY leaf reachable under it is
      // already claimed by a DIFFERENT resource -- so an exhausted axis
      // (e.g. both motor0 and motor1 already taken) is unselectable at the
      // TOP level too, not just its individual leaves. Descend into
      // whichever child the select's CURRENT value points to, to give the
      // next select (if any) the right context.
      let node = { children: tree };
      let pathSoFar = [];
      selects.forEach(sel => {
        Array.from(sel.options).forEach(opt => {
          if (opt.value === "unused") { opt.disabled = false; return; }
          const childNode = node.children[opt.value];
          if (!childNode) { opt.disabled = false; return; }
          if (!childNode.children) {
            const full = pathSoFar.concat([opt.value]).join(":");
            applyDisable(opt, full, key);
          } else {
            const leaves = enumerateLeafPaths(childNode, pathSoFar.concat([opt.value]));
            const exhausted = leaves.length > 0 && leaves.every(path => isRoleClaimedByOther(path.join(":"), key));
            opt.disabled = exhausted;
          }
        });
        if (sel.value !== "unused" && node.children[sel.value]) {
          pathSoFar = pathSoFar.concat([sel.value]);
          node = node.children[sel.value];
        }
      });
    }
  });
}

/* Third pane: an optional board photo with clickable regions, sourced from
 * hotspots/<id>.hotspots.yaml (fetched in loadBoard()) -- entirely a
 * presentation aid layered on top of the real resource-binding rows in
 * #resourceCol, never a second way to actually bind anything. Hidden
 * entirely (main reverts to its normal 2-column layout) for any board
 * without hotspot data. */
// Tightest window (in the RAW photo's own 0-100% space, same unbounded
// space hotspot-editor.html itself now edits/exports in) that contains both
// the photo (0-100) and every hotspot's rect/label_rect extents, plus a
// small fixed buffer on every side -- mirrors hotspot-editor.html's own
// (now-removed) computePaddedBounds(), except here it drives a CSS layout
// reservation instead of a baked/recomposited image. Purely a function of
// hotspotData, independent of the photo's rendered size -- computed once
// per board load, not on every resize.
const HOTSPOT_PAD_BUFFER_PCT = 3;
let hotspotBounds = null; // {minX,maxX,minY,maxY} or null if no hotspotData

function computeHotspotBounds() {
  let minX = 0, maxX = 100, minY = 0, maxY = 100;
  (hotspotData.hotspots || []).forEach(h => {
    [h.rect, h.label_rect].forEach(box => {
      if (!box) return;
      minX = Math.min(minX, box.x); maxX = Math.max(maxX, box.x + box.w);
      minY = Math.min(minY, box.y); maxY = Math.max(maxY, box.y + box.h);
    });
  });
  return {
    minX: minX - HOTSPOT_PAD_BUFFER_PCT, maxX: maxX + HOTSPOT_PAD_BUFFER_PCT,
    minY: minY - HOTSPOT_PAD_BUFFER_PCT, maxY: maxY + HOTSPOT_PAD_BUFFER_PCT,
  };
}

// Reference width that .hotspot-label/.hotspot-role-label's 10px base
// font-size was tuned to look right at (see --hotspot-scale below) -- NOT
// tied to any particular photo's own natural resolution, which varies
// wildly board to board (and is exactly what caused the bug this constant
// fixes: dividing by naturalWidth instead of a fixed reference meant a
// photo with a large native resolution, displayed small in a narrow pane,
// produced a tiny scale factor and near-illegible text, even though the
// photo itself was rendering at a perfectly reasonable size). 1000 is
// roughly the size a normalized/downscaled contributor photo (see
// hotspot-editor.html's own MAX_IMG_DIM) tends to land at.
const HOTSPOT_FONT_REF_WIDTH = 1000;

/* Sizes the photo to fill the pane's available width (scaling up OR down,
 * see #hotspotImgWrap's comment) while reserving exactly enough padding
 * around it -- via #hotspotImgPad -- for every hotspot's extents from
 * hotspotBounds, then repositions every rect/role-label to match (in px,
 * not CSS %, since #hotspotOverlay now spans a bigger box than the photo
 * itself). All closed-form from the wrap's own (padding-independent) width
 * and the photo's natural aspect ratio -- no iterative feedback loop with
 * the padding it's also setting. Called once after the photo loads (its
 * natural size isn't known before then) and again via ResizeObserver on
 * #hotspotImgWrap any time the available column width changes (window
 * resize, the left/right panes changing width, etc.). */
function updateHotspotLayout() {
  const img = document.getElementById("hotspotImg");
  const wrap = document.getElementById("hotspotImgWrap");
  const pad = document.getElementById("hotspotImgPad");
  const overlay = document.getElementById("hotspotOverlay");
  if (!img || !wrap || !hotspotBounds || !img.naturalWidth) return;
  const b = hotspotBounds;
  const spanXFactor = (b.maxX - b.minX) / 100;
  const wrapWidth = wrap.getBoundingClientRect().width;
  const imgW = wrapWidth / spanXFactor;
  const imgH = imgW * (img.naturalHeight / img.naturalWidth);
  const leftPad = (0 - b.minX) / 100 * imgW, rightPad = (b.maxX - 100) / 100 * imgW;
  const topPad = (0 - b.minY) / 100 * imgH, bottomPad = (b.maxY - 100) / 100 * imgH;
  img.style.width = imgW + "px";
  img.style.height = imgH + "px";
  pad.style.padding = `${topPad}px ${rightPad}px ${bottomPad}px ${leftPad}px`;
  // Ratio of the photo's CURRENT rendered width to the fixed reference --
  // this is what makes the scaling "rather modest" for a photo already
  // sized close to 1000px, adjusting mainly for how much wider the overall
  // workspace (photo + hotspot-overflow padding) ended up vs. the photo
  // alone, not for the photo's raw native resolution.
  wrap.style.setProperty("--hotspot-scale", imgW / HOTSPOT_FONT_REF_WIDTH);

  // Reposition every rect/role-label from its stored %-of-raw-photo
  // coordinates into px within the overlay -- same imgOffset()/pctToPx()
  // technique hotspot-editor.html's own renderHotspots() uses, needed here
  // because the overlay is now bigger than the photo (so plain CSS % on
  // each element, resolved against the OVERLAY, would no longer mean
  // %-of-photo the way it used to when overlay == photo size).
  const ir = img.getBoundingClientRect(), or = overlay.getBoundingClientRect();
  const off = { left: ir.left - or.left, top: ir.top - or.top, width: ir.width, height: ir.height };
  document.querySelectorAll("#hotspotOverlay [data-pct]").forEach(el => {
    const box = JSON.parse(el.dataset.pct);
    el.style.left = (off.left + box.x / 100 * off.width) + "px";
    el.style.top = (off.top + box.y / 100 * off.height) + "px";
    el.style.width = (box.w / 100 * off.width) + "px";
    el.style.height = (box.h / 100 * off.height) + "px";
  });
  // Size and place each module-image rotated div — uniform scale so the short edge of the
  // socket constrains the image, pin side anchored to the socket edge, far end overflows.
  document.querySelectorAll("#hotspotOverlay .module-socket-rotated").forEach(rotDiv => {
    const modImg = rotDiv.querySelector("img");
    // Fall back to physical 42:32 ratio until the image is loaded.
    const imgAR = (modImg && modImg.naturalWidth && modImg.naturalHeight)
      ? modImg.naturalWidth / modImg.naturalHeight : 42 / 32;
    const sockBox = JSON.parse(rotDiv.dataset.sockPct);
    const sockW = sockBox.w / 100 * off.width;
    const sockH = sockBox.h / 100 * off.height;
    const orient = parseInt(rotDiv.dataset.orient);
    let divW, divH, divLeft, divTop;
    if (orient === 0) {
      // Pins left, no rotation: anchor left, overflow right
      divH = sockH; divW = sockH * imgAR;
      divLeft = 0; divTop = 0;
    } else if (orient === 2) {
      // Pins right, 180°: anchor right, overflow left
      divH = sockH; divW = sockH * imgAR;
      divLeft = sockW - divW; divTop = 0;
    } else if (orient === 1) {
      // Pins top, 90° CW: anchor top edge of post-rotation image at y=0, overflow bottom
      divH = sockW; divW = sockW * imgAR;
      divLeft = (sockW - divW) / 2;
      divTop  = (divW - divH) / 2;
    } else {
      // Pins bottom, 270° CW: anchor bottom edge at y=sockH, overflow top
      divH = sockW; divW = sockW * imgAR;
      divLeft = (sockW - divW) / 2;
      divTop  = sockH - (divW + divH) / 2;
    }
    Object.assign(rotDiv.style, {
      position: "absolute", transformOrigin: "50% 50%",
      width: divW + "px", height: divH + "px",
      left: divLeft + "px", top: divTop + "px",
      transform: `rotate(${orient * 90}deg)`,
    });
  });
}

// rect and label_rect each have their own INDEPENDENT orientation: if
// rect_orientation/label_orientation is present in hotspots.yaml, it
// overrides; if absent, the orientation is inferred from that specific
// box's own aspect ratio. Mirrors hotspot-editor.html's own
// effectiveOrientation() -- no coupling between the two boxes at all.
function boxOrientation(box, override) {
  if (override === "vertical" || override === "horizontal") return override;
  return box && box.h > box.w ? "vertical" : "horizontal";
}

function renderHotspotPane() {
  const mainEl = document.querySelector("main");
  const col = document.getElementById("hotspotCol");
  if (!hotspotData) {
    col.style.display = "none";
    mainEl.style.gridTemplateColumns = "1fr max-content";
    col.innerHTML = "";
    hotspotBounds = null;
    return;
  }
  // 420px, not the narrower 320px this used to be -- .row.output-row/
  // .cascade-row reserve at least 240px + 10px gap for their controls (see
  // .row's own comment -- a floor, not a fixed width, but still a floor
  // this narrow fixed-width hotspot column has to respect), and .col's own
  // padding (18px 24px) eats another 48px, so at 320px total there was
  // only ~2px left over for the label column itself. That was narrow
  // enough to force-wrap any label containing a space (e.g. btt rodent's
  // "LED R"/"LED G"/"LED B") while single-word labels of similar length
  // just silently overflowed instead -- not obviously "too narrow" unless
  // a resource happened to have a space in its name. 420px leaves a
  // comfortable ~120px for the label column on output/cascade rows.
  // minmax(10vw, 1fr), not plain 1fr, on the hotspot photo column -- same
  // reasoning and floor as hotspot-editor.html's own .layout: with a fixed
  // 420px left column plus a max-content right column, a plain 1fr middle
  // column shrinks to 0 and vanishes entirely on a narrow window, which is
  // exactly how people missed the photo pane exists at all.
  mainEl.style.gridTemplateColumns = "420px minmax(10vw, 1fr) max-content";
  col.style.display = "";
  col.innerHTML = `<div class="note note-instruct">Click a highlighted region to select its row on the left.</div>
    <div id="hotspotImgWrap">
      <div id="hotspotImgPad">
        <img id="hotspotImg" src="${escapeAttr(hotspotData.image)}" alt="board photo">
      </div>
      <div id="hotspotOverlay"></div>
    </div>`;
  const overlay = document.getElementById("hotspotOverlay");
  hotspotBounds = computeHotspotBounds();
  const img = document.getElementById("hotspotImg");
  const wrap = document.getElementById("hotspotImgWrap");
  img.addEventListener("load", updateHotspotLayout);
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(updateHotspotLayout).observe(wrap);
  (hotspotData.hotspots || []).forEach(h => {
    const el = document.createElement("div");
    el.className = "hotspot-rect";
    el.dataset.pct = JSON.stringify(h.rect); // read back by updateHotspotLayout()
    el.dataset.genericName = h.generic_name;
    el.onclick = () => jumpToGenericName(h.generic_name, el);
    // Connector's own name always shows in the connector box's corner --
    // unconditional, regardless of whether a label_rect exists. hotspots.yaml
    // records this as a single "generic_name" (see computeResourcePins()'
    // resourceGenericNames comment) -- shown verbatim, no lookup needed.
    // One hotspot, one name -- even a pin shared by two logical roles gets
    // two SEPARATE hotspots on the photo, not one box naming both (see
    // PROGRESS.md). The board's own vendor label is available on hover for
    // anyone who wants to cross-reference the silkscreen/vendor
    // documentation term. el.title (the hover tooltip, "generic (vendor)",
    // plus any assigned role) is set/kept live by refreshHotspotStates()
    // below, not here -- same single source of truth the assigned/
    // unassigned coloring already uses, so it never needs a separate
    // initial value.
    const labelSpan = document.createElement("span");
    // rect's OWN orientation -- rect_orientation if present, else inferred
    // from rect's own aspect ratio (see boxOrientation()). Independent of
    // label_rect's orientation below; see this class's own CSS comment.
    labelSpan.className = "hotspot-label" + (boxOrientation(h.rect, h.rect_orientation) === "vertical" ? " vertical" : "");
    const labelText = document.createElement("span"); // see .hotspot-label-text's comment -- carries just the background/padding, hugging the text
    labelText.className = "hotspot-label-text";
    labelText.textContent = h.generic_name;
    labelSpan.appendChild(labelText);
    el.appendChild(labelSpan);
    // Module image + sub-hotspot chips when a module with hotspot data is assigned
    if (h.socket_orientation != null) {
      const si = (board.expansion_sockets || []).findIndex(s => gname(s) === h.generic_name);
      if (si >= 0) {
        const moduleId = bindings[resourceKeyModuleSocket(si)];
        const modHotspot = moduleId && MODULE_HOTSPOT_CATALOG[moduleId];
        if (modHotspot) {
          el.classList.add("has-module-overlay");
          const modWrap = document.createElement("div");
          modWrap.className = "module-socket-overlay";
          const rotDiv = document.createElement("div");
          rotDiv.className = "module-socket-rotated";
          rotDiv.dataset.orient = h.socket_orientation;
          rotDiv.dataset.sockPct = el.dataset.pct; // used by updateHotspotLayout to size this div
          const modImg = document.createElement("img");
          modImg.src = modHotspot.image;
          modImg.alt = "";
          modImg.onload = updateHotspotLayout;
          rotDiv.appendChild(modImg);
          (modHotspot.hotspots || []).forEach(mh => {
            const chip = document.createElement("div");
            chip.className = "hotspot-rect module-hotspot-chip";
            chip.dataset.genericName = `${h.generic_name}/${mh.generic_name}`;
            chip.style.cssText = `left:${mh.rect.x}%;top:${mh.rect.y}%;width:${mh.rect.w}%;height:${mh.rect.h}%;`;
            chip.onclick = (e) => { e.stopPropagation(); jumpToGenericName(`${h.generic_name}/${mh.generic_name}`, chip); };
            const chipLabel = document.createElement("span");
            chipLabel.className = "hotspot-label" + (boxOrientation(mh.rect, null) === "vertical" ? " vertical" : "");
            const chipLabelText = document.createElement("span");
            chipLabelText.className = "hotspot-label-text";
            chipLabelText.textContent = mh.generic_name;
            chipLabel.appendChild(chipLabelText);
            chip.appendChild(chipLabel);
            rotDiv.appendChild(chip);
            const roleBox2 = mh.label_rect || mh.rect;
            const roleSpan2 = document.createElement("span");
            roleSpan2.className = "hotspot-role-label" + (boxOrientation(roleBox2, mh.label_orientation) === "vertical" ? " vertical" : "");
            roleSpan2.dataset.genericName = `${h.generic_name}/${mh.generic_name}`;
            roleSpan2.style.cssText = `left:${roleBox2.x}%;top:${roleBox2.y}%;width:${roleBox2.w}%;height:${roleBox2.h}%;`;
            rotDiv.appendChild(roleSpan2);
          });
          modWrap.appendChild(rotDiv);
          el.appendChild(modWrap);
        }
      }
    }
    overlay.appendChild(el);
    // Separate box for the ASSIGNED ROLE (once one exists) -- when the
    // hotspot has its own editor-authored label_rect, positioned there (in
    // the same % coordinate space as the connector rect, i.e. relative to
    // the RAW photo, not nested inside the connector box), so it can sit
    // anywhere on the photo -- typically just outside a small/crowded
    // connector where there's no room for both its own name and a role.
    // WITHOUT a label_rect, this now falls back to rect's own coordinates
    // instead of not existing at all -- same box, same size, appended AFTER
    // (so it paints on top, same z-index): once a role is assigned, the
    // role text overlays/replaces the connector-name chip that was showing
    // there, rather than the role never appearing on the photo at all.
    // Text is populated/hidden live by refreshHotspotStates() below (empty
    // -> CSS :empty hides the element entirely -- see that rule's comment),
    // since the assigned role can change on every binding edit.
    const roleBox = h.label_rect || h.rect;
    const roleSpan = document.createElement("span");
    // roleBox's OWN orientation -- label_orientation if present, else
    // inferred from roleBox's own aspect ratio (rect's, in the fallback
    // case). Independent of rect_orientation above.
    roleSpan.className = "hotspot-role-label" + (boxOrientation(roleBox, h.label_orientation) === "vertical" ? " vertical" : "");
    roleSpan.dataset.genericName = h.generic_name;
    roleSpan.dataset.pct = JSON.stringify(roleBox);
    // Module image fills the rect when has-module-overlay; skip the overlapping role chip.
    if (!el.classList.contains("has-module-overlay")) overlay.appendChild(roleSpan);
  });
  updateHotspotLayout(); // no-ops until the img's `load` fires if it hasn't already (e.g. cached image)
  refreshHotspotStates();
}

/* Reads whichever left-pane row(s) a label maps to and reports its CURRENT
 * binding state directly from that row's own <select>(s) -- rather than
 * re-deriving it from `bindings[key]` (whose value format/shape varies a
 * lot across resource types: "x:motor0", "limit:x:motor0:neg", "spindle:pwm",
 * "vfd:Huanyang", etc.), this just reads back whatever the select is
 * already showing the user, which is inherently already the right
 * human-readable text and trivially correct regardless of format. A row's
 * first <select> follows this file's universal convention of "unused" as
 * the not-yet-assigned value (see makeRow/makeOutputRow/makeInputRow) --
 * any select that's hidden (style.display "none", e.g. an output row's
 * unused secondary picker) or has no options yet is skipped. */
function getRowRoleInfo(genericName) {
  // Matched via resourceGenericNames -- hotspots.yaml's own single
  // "generic_name" per hotspot is written in this same vocabulary (see
  // computeResourcePins()' resourceGenericNames comment), same as what a
  // row's displayed ".name" text now shows, so this now lines up directly
  // rather than needing resourceLabels (the vendor label) as an
  // intermediary.
  const key = Object.keys(resourceGenericNames).find(k => resourceGenericNames[k] === genericName);
  const row = key ? Array.from(document.querySelectorAll("#resourceCol .row")).find(r => r.dataset.resourceKey === key) : null;
  if (!row) return { row: null, assigned: false, roleText: "" };
  const selects = Array.from(row.querySelectorAll("select")).filter(s => s.style.display !== "none" && s.options.length);
  if (!selects.length) return { row, assigned: false, roleText: "" };
  const assigned = selects[0].value !== "unused" && selects[0].value !== "";
  const roleText = assigned
    ? selects.map(s => (s.options[s.selectedIndex] || {}).textContent || "").filter(Boolean).join(" / ")
    : "";
  return { row, assigned, roleText };
}

/* Refreshes every hotspot's assigned/unassigned color and hover tooltip
 * from the left pane's CURRENT state -- called once at board load and
 * again after every generateDraft() (i.e. every binding change), so the
 * photo always reflects reality live, not just a snapshot from when the
 * pane was first built. */
function refreshHotspotStates() {
  if (!hotspotData) return;
  document.querySelectorAll("#hotspotOverlay .hotspot-rect").forEach(el => {
    const generic = el.dataset.genericName;
    const info = getRowRoleInfo(generic);
    el.classList.toggle("assigned", info.assigned);
    // vendor label in parens when it differs -- same "generic (vendor)"
    // format used by the left-pane rows' own hover title, see makeRow()/etc.
    const vendor = genericNameToVendorLabel[generic];
    const base = (!vendor || vendor === generic) ? generic : `${generic} (${vendor})`;
    el.title = info.assigned ? `${base}: ${info.roleText}` : base;
  });
  // Populate/hide each hotspot's separate role label (only exists for
  // hotspots with an editor-authored label_rect -- see renderHotspotPane()).
  // Empty when nothing's assigned yet: :empty { display:none } in CSS hides
  // the box entirely rather than showing a blank chip over the photo.
  document.querySelectorAll("#hotspotOverlay .hotspot-role-label").forEach(el => {
    const info = getRowRoleInfo(el.dataset.genericName);
    el.textContent = info.assigned ? info.roleText : "";
  });
}

/* Clicking a hotspot highlights + scrolls to its one matching left-pane row
 * (one hotspot, one generic name, one row -- a pin shared by two logical
 * roles gets two separate hotspots on the photo, each naming its own role,
 * not one hotspot naming both; see PROGRESS.md). Purely a navigation aid --
 * clicking never changes any binding itself. Magenta (.active /
 * .hotspot-target) is reserved for this selection state alone, distinct
 * from the yellow/green assigned-state colors set by refreshHotspotStates(),
 * so "the one I just clicked" always reads unambiguously regardless of
 * whether it's also bound to something yet. */
function clearHotspotSelection() {
  document.querySelectorAll(".hotspot-rect.active").forEach(e => e.classList.remove("active"));
  document.querySelectorAll("#resourceCol .row.hotspot-target").forEach(e => e.classList.remove("hotspot-target"));
}

function jumpToGenericName(genericName, hotspotEl) {
  clearHotspotSelection();
  if (hotspotEl) hotspotEl.classList.add("active");
  // See getRowRoleInfo()'s comment -- genericName is hotspots.yaml's own
  // vocabulary, matched via resourceGenericNames.
  const key = Object.keys(resourceGenericNames).find(k => resourceGenericNames[k] === genericName);
  const row = key ? Array.from(document.querySelectorAll("#resourceCol .row")).find(r => r.dataset.resourceKey === key) : null;
  if (!row) return;
  row.classList.add("hotspot-target");
  if (row.scrollIntoView) row.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* Same selection, the other direction: clicking a left-pane resource row
 * activates + scrolls to its matching hotspot(s) on the photo, same
 * magenta .active/.hotspot-target state jumpToGenericName() sets, just
 * started from the opposite end. Wired alongside the hover link below
 * (same matches array), since both need the identical row<->rect
 * correspondence. */
function selectFromRow(row, matches) {
  clearHotspotSelection();
  matches.forEach(el => el.classList.add("active"));
  row.classList.add("hotspot-target");
  if (matches[0] && matches[0].scrollIntoView) matches[0].scrollIntoView({ behavior: "smooth", block: "center" });
}

/* Bidirectional link, the other direction: hovering a left-pane resource
 * row highlights its matching hotspot(s) on the photo (if any exist for
 * this board/generic name) -- reinforces "this row is that physical
 * connector" without requiring a click. Wired once per board load, right
 * after both #resourceCol and the hotspot pane are built. */
function wireHotspotHoverLinks() {
  if (!hotspotData) return;
  const rects = Array.from(document.querySelectorAll("#hotspotOverlay .hotspot-rect"));
  document.querySelectorAll("#resourceCol .row").forEach(row => {
    // See getRowRoleInfo()'s comment -- generic name via
    // resourceGenericNames, matching hotspots.yaml's own vocabulary (and,
    // incidentally, the row's own displayed text).
    const generic = resourceGenericNames[row.dataset.resourceKey];
    if (!generic) return;
    const matches = rects.filter(el => el.dataset.genericName === generic);
    if (!matches.length) return;
    row.addEventListener("mouseenter", () => matches.forEach(el => el.classList.add("hover")));
    row.addEventListener("mouseleave", () => matches.forEach(el => el.classList.remove("hover")));
    // Clicking the row itself (not just hovering) selects it the same way
    // clicking its hotspot would -- doesn't interfere with the row's own
    // <select>(s), which keep their normal click-to-open behavior; this
    // just adds the same magenta selection state on top.
    row.addEventListener("click", () => selectFromRow(row, matches));
  });
}

// Normalized, vendor-independent display name for a board resource (see
// board.schema.json's generic_name field / board.yaml authoring rules) --
// falls back to the board's own vendor label when generic_name hasn't been
// pinned down yet for that connector. Used only for what the wizard SHOWS
// the user (row text, hotspot corner chips); resourceLabels (the vendor
// label) is untouched and still drives the "# <label>" annotation comments
// written into the generated config.yaml and the config.yaml importer's
// comment-hint matching -- those need the board's own documented term, not
// the normalized one.
function gname(entry) {
  return (entry && entry.generic_name) || (entry && entry.label) || "";
}

function renderResources() {
  const col = document.getElementById("resourceCol");
  col.innerHTML = "";

  const note = document.createElement("div");
  note.className = "note note-instruct";
  note.textContent = `For each physical board resource below, choose its FluidNC role (or leave Unused).`;
  col.appendChild(note);

  const title = document.createElement("div");
  title.className = "board-title";
  title.textContent = board.board.name;
  col.appendChild(title);

  // Kinematics has NO left-pane row -- the left pane is pure board-resource
  // assignment, and a kinematic system choice isn't tied to any board
  // resource at all (any board can in principle host any kinematic
  // system). The selector itself now lives INSIDE the generated draft (see
  // kinWidgetHtml()/the KINSELECT sentinel in generateDraft()), right where
  // the kinematics: block's system-name key sits, defaulting to Cartesian
  // per FluidNC's own real default (Kinematics::afterParse()). Choosing a
  // system with subordinate geometry items (Parallel Delta, Wall Plotter)
  // auto-populates them as ordinary TBD fields alongside it.

  // Start: has NO left-pane row either -- same reasoning as Kinematics.
  // It's always emitted directly into the draft below with its fields
  // already inline-editable there (see generateDraft()'s Start block): all
  // 3 fields are pre-populated with FluidNC's own compiled-in defaults
  // (config_items.yaml @tuning typical, see configDocSpecFor()) --
  // rarely-changed settings the user need not think about, but can still
  // edit inline if they want to.

  // Motor sockets
  if (board.motor_sockets && board.motor_sockets.sockets) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>Motor sockets</h2>`;
    board.motor_sockets.sockets.forEach((s, i) => {
      const key = resourceKeyMotor(i);
      sec.appendChild(makeInputRow(
        key, gname(s),
        `${s.driver_class}${s.fixed_motor_type ? " — " + s.fixed_motor_type : ""}`,
        MOTOR_ROLE_TREE, s.label
      ));
    });
    col.appendChild(sec);
  }

  // Generic pins
  if (board.generic_pins) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>Generic pins</h2>`;
    board.generic_pins.forEach((p, i) => {
      const key = resourceKeyPin(i);
      const sub = `${p.mcu_pin} — ${p.direction}`;
      const name = gname(p);
      // "either" gets the combined input+output tree (see EITHER_ROLE_TREE);
      // plain "input" (and any other non-"output" direction) keeps the
      // input-only tree, unchanged.
      sec.appendChild(p.direction === "output"
        ? makeOutputRow(key, name, sub, p.label, p.mcu_pin)
        : makeInputRow(key, name, sub, p.direction === "either" ? EITHER_ROLE_TREE : INPUT_ROLE_TREE, p.label));
    });
    col.appendChild(sec);
  }

  // Module sockets (CNC I/O Module -- see http://wiki.fluidnc.com/en/hardware/cnc_io_modules
  // and MODULE_CATALOG/resolveModuleSocketConnectors() above): one row per
  // socket picking WHICH module is plugged in (filtered to modules
  // moduleFitsSocket() this socket, via moduleFitsSocket()), then -- once
  // chosen -- one further row per that module's own resolved connector,
  // rendered with the exact same row-builders (makeInputRow/makeOutputRow/
  // makeRow) a board's own directly-wired equivalents use, just fed
  // resolved mcu_pin values instead of reading board.generic_pins/etc.
  // directly. Changing the module choice changes the whole set of rows
  // below it, which none of the existing per-row onchange handlers are set
  // up to do (they only ever update their OWN row) -- so this one row's
  // onchange rebuilds the entire resource pane via renderResources()
  // itself, then re-syncs everything renderResources() doesn't handle
  // (module-connector resourcePins depend on the CURRENT module choice, so
  // computeResourcePins() must be re-run too; hotspot hover-links are
  // wired against specific DOM nodes that just got torn down and rebuilt).
  if (board.expansion_sockets) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>Module sockets</h2>`;
    board.expansion_sockets.forEach((s, si) => {
      const key = resourceKeyModuleSocket(si);
      const pinList = (s.pins || []).map(p => p.module_pin).join(",");
      const sub = `${(s.pins || []).length} pins (${pinList})`;
      const options = [{ value: "unused", label: "— Empty —" }];
      Object.keys(MODULE_CATALOG).sort((a, b) => MODULE_CATALOG[a].module.name.localeCompare(MODULE_CATALOG[b].module.name)).forEach(id => {
        if (moduleFitsSocket(MODULE_CATALOG[id], s)) options.push({ value: id, label: MODULE_CATALOG[id].module.name });
      });
      const row = makeRow(key, gname(s), sub, options, s.label);
      row.classList.add("module-socket-row");
      const sel = row.querySelector("select");
      sel.onchange = () => {
        const previousModuleId = bindings[key];
        if (previousModuleId && previousModuleId !== "unused") {
          const oldConnectors = resolveModuleSocketConnectors(s, previousModuleId) || [];
          oldConnectors.forEach((c, ci) => {
            const oldKey = resourceKeyModConn(si, ci);
            delete bindings[oldKey];
            delete pinAttrs[`${oldKey}.txd_pin`];
            delete pinAttrs[`${oldKey}.rxd_pin`];
            delete pinAttrs[`${oldKey}.rts_pin`];
            delete pinAttrs[`${oldKey}.cts_pin`];
          });
        }
        bindings[key] = sel.value;
        computeResourcePins();
        renderResources();
        if (hotspotData) renderHotspotPane();
        wireHotspotHoverLinks();
        generateDraft();
      };
      sec.appendChild(row);

      const connectors = resolveModuleSocketConnectors(s, bindings[key]);
      if (connectors && connectors.length) {
        const sub2 = document.createElement("div");
        sub2.className = "module-connectors";
        connectors.forEach((c, ci) => {
          const ckey = resourceKeyModConn(si, ci);
          if (c.kind === "generic_pin") {
            const csub = `${c.mcu_pin} — ${c.direction}`;
            sub2.appendChild(c.direction === "output"
              ? makeOutputRow(ckey, c.generic_name, csub, c.label, c.mcu_pin)
              : makeInputRow(ckey, c.generic_name, csub, c.direction === "either" ? EITHER_ROLE_TREE : INPUT_ROLE_TREE, c.label));
          } else if (c.kind === "expansion_uart") {
            const pins = `txd=${c.txd_pin} rxd=${c.rxd_pin}${c.connector_type ? " (" + c.connector_type + ")" : ""}`;
            sub2.appendChild(makeRow(ckey, c.generic_name, pins, [
              { value: "unused", label: "— Unused —" },
              { value: "uart_channel", label: `I/O Expansion (uart_channel, uartN)` },
            ], c.label));
          } else if (c.kind === "rs485_channel") {
            const pins = `tx=${c.tx_pin} rx=${c.rx_pin}` + (c.rts_pin ? ` rts=${c.rts_pin}` : "");
            sub2.appendChild(makeRow(ckey, c.generic_name, pins, rs485RoleOptions(), c.label));
          }
        });
        sec.appendChild(sub2);
      }
    });
    col.appendChild(sec);
  }

  // RS485 channels -- one coupled resource (tx/rx/optional rts), one dropdown.
  if (board.rs485_channels) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>RS485 channels</h2>`;
    board.rs485_channels.forEach((ch, i) => {
      const key = resourceKeyRs485(i);
      const pins = `tx=${ch.tx_pin} rx=${ch.rx_pin}` + (ch.rts_pin ? ` rts=${ch.rts_pin}` : "");
      sec.appendChild(makeRow(key, gname(ch), pins, rs485RoleOptions(), ch.label));
    });
    col.appendChild(sec);
  }

  // Expansion UART connectors (e.g. Corgi's RJ12) -- fixed pins, the only
  // real choice is whether to use it at all (role: "uart_channel").
  if (board.expansion_uarts) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>Expansion UART connectors</h2>`;
    board.expansion_uarts.forEach((ex, i) => {
      const key = resourceKeyExpUart(i);
      const pins = `txd=${ex.txd_pin} rxd=${ex.rxd_pin}${ex.connector_type ? " (" + ex.connector_type + ")" : ""}`;
      sec.appendChild(makeRow(key, gname(ex), pins, [
        { value: "unused", label: "— Unused —" },
        { value: "uart_channel", label: `I/O Expansion (uart_channel, uartN)` },
      ], ex.label));
    });
    if (boardHasUartTmc(board) && board.rs485_channels && board.rs485_channels.length) {
      const warn = document.createElement("div");
      warn.className = "note note-warn";
      warn.innerHTML = `<b>Note:</b> this board's onboard TMC drivers already use uart1, so both RS485 ` +
        `and this expansion connector default to uart2 -- per real FluidNC board docs, only one of them ` +
        `can actually be used in a given config file.`;
      sec.appendChild(warn);
    }
    col.appendChild(sec);
  }

  // I2C connectors -- unlike spi:/i2so:, FluidNC rarely has any onboard
  // I2C device (its only I2C-consuming feature, an OLED display, is
  // deprecated), so a board's I2C pins are almost always just brought out
  // to an external connector, not auto-consumed. I2C pins are also often
  // bare GPIOs, so the same connector is frequently repurposed as a plain
  // expansion UART instead (scl_pin -> tx, sda_pin -> rx) -- same idea as
  // an expansion_uart connector. This is therefore bindable, not a fixed
  // peripheral: unused / a real i2c0: bus / a generic expansion UART.
  if (board.i2c_connectors) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>I2C connectors</h2>`;
    board.i2c_connectors.forEach((ic, i) => {
      const key = resourceKeyI2c(i);
      const pins = `sda=${ic.sda_pin} scl=${ic.scl_pin}`;
      sec.appendChild(makeRow(key, gname(ic), pins, [
        { value: "unused", label: "— Unused —" },
        { value: "i2c_bus", label: "I2C Bus (i2c0: — e.g. OLED display)" },
        { value: "expansion_uart", label: `Expansion UART (scl=tx, sda=rx, uart)` },
      ], ic.label));
    });
    col.appendChild(sec);
  }

  // Fixed peripherals — informational only, not assignable. Placed last
  // (moved here per explicit request) so it's out of the way below the
  // actually-actionable resource sections above.
  if (board.fixed_peripherals) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>Fixed peripherals (not assignable)</h2>`;
    const list = document.createElement("div");
    list.className = "fixed-list";
    const fp = board.fixed_peripherals;
    const lines = [];
    if (fp.spi) lines.push(`SPI bus: <code>${JSON.stringify(fp.spi)}</code>`);
    if (fp.sdcard) lines.push(`SD card: <code>${JSON.stringify(fp.sdcard)}</code>`);
    if (fp.i2so) lines.push(`I2SO shift register: <code>${JSON.stringify(fp.i2so)}</code>`);
    if (fp.dedicated_uarts) fp.dedicated_uarts.forEach(u => lines.push(`Dedicated UART (${u.label}): <code>${JSON.stringify(u)}</code>`));
    list.innerHTML = lines.join("<br>");
    sec.appendChild(list);
    col.appendChild(sec);
  }
}

function makeRow(key, name, sub, options, vendorLabel) {
  const row = document.createElement("div");
  row.className = "row";
  row.dataset.resourceKey = key;
  const lbl = document.createElement("div");
  lbl.className = "lbl";
  lbl.innerHTML = `<span class="name">${name}</span><span class="sub">${sub}</span>`;
  if (vendorLabel && vendorLabel !== name) lbl.title = `${name} (${vendorLabel})`;
  const sel = document.createElement("select");
  sel.dataset.key = key;
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o.value; opt.textContent = o.label;
    sel.appendChild(opt);
  });
  sel.value = bindings[key] || "unused";
  sel.onchange = () => { bindings[key] = sel.value; generateDraft(); };
  const wrap = document.createElement("div");
  wrap.className = "ctrl-wrap";
  const conflictNote = document.createElement("span");
  conflictNote.className = "conflict-note";
  wrap.appendChild(sel); wrap.appendChild(conflictNote);
  row.appendChild(lbl); row.appendChild(wrap);
  return row;
}

/* Two-step row for output-capable pins: step 1 picks the category
 * (a spindle type, or coolant/digital-output as before); step 2, only
 * shown when step 1 is a spindle type, picks which pin within that type.
 * This is what keeps the per-pin option list from growing every time a
 * new spindle type (Relay, HBridge, Dac, ...) gets added to SPINDLE_TYPES
 * -- only the (hidden-until-needed) step 2 list grows. */
function makeOutputRow(key, name, sub, vendorLabel, mcuPin) {
  const row = document.createElement("div");
  row.className = "row output-row";
  row.dataset.resourceKey = key;
  const lbl = document.createElement("div");
  lbl.className = "lbl";
  lbl.innerHTML = `<span class="name">${name}</span><span class="sub">${sub}</span>`;
  if (vendorLabel && vendorLabel !== name) lbl.title = `${name} (${vendorLabel})`;
  row.appendChild(lbl);

  const controls = document.createElement("div");
  controls.className = "output-controls";

  const primary = document.createElement("select");
  outputCategoryOptions(mcuPin).forEach(o => {
    const opt = document.createElement("option");
    opt.value = o.value; opt.textContent = o.label;
    primary.appendChild(opt);
  });

  const secondary = document.createElement("select");
  secondary.style.display = "none";

  function refreshSecondary() {
    const cat = primary.value;
    const opts = cascadeOptionsFor(cat, mcuPin);
    if (opts && opts.length) {
      const curSub = roleSubValue(bindings[key] || "");
      secondary.innerHTML = "";
      opts.forEach(([val, label]) => {
        const opt = document.createElement("option");
        opt.value = val; opt.textContent = label;
        secondary.appendChild(opt);
      });
      // Same "prefer an unclaimed option" policy as makeInputRow's
      // firstLeafPathFrom() -- otherwise switching two different resources
      // to the same cascading category (e.g. both to "Digital Output")
      // would silently default BOTH to "Output 0" before the graying logic
      // ever ran. Falls back to the first option if every one is claimed.
      const unclaimedVal = opts.find(([v]) => !isRoleClaimedByOther(`${cat}:${v}`, key));
      secondary.value = opts.some(p => p[0] === curSub) ? curSub : (unclaimedVal ? unclaimedVal[0] : opts[0][0]);
      secondary.style.display = "";
    } else {
      secondary.style.display = "none";
    }
  }

  primary.value = roleCategory(bindings[key] || "unused");
  refreshSecondary();

  primary.onchange = () => {
    const cat = primary.value;
    const catOpts = cascadeOptionsFor(cat, mcuPin);
    if (catOpts && catOpts.length) {
      refreshSecondary();
      const full = `${cat}:${secondary.value}`;
      // A category with every secondary option already claimed elsewhere is
      // now grayed out at the primary level by refreshRoleUniqueness() (so
      // this branch shouldn't normally be reachable via the UI at all) --
      // this is just a silent, no-popup safety net in case bindings ever
      // gets into that state some other way (refreshSecondary() already
      // prefers an unclaimed option, so this only fires if literally none
      // exist).
      const stillDuplicate = isRoleClaimedByOther(full, key);
      if (stillDuplicate) {
        bindings[key] = "unused";
        primary.value = "unused";
        secondary.style.display = "none";
      } else {
        bindings[key] = full;
      }
    } else {
      secondary.style.display = "none";
      bindings[key] = cat;
    }
    generateDraft();
  };
  secondary.onchange = () => {
    bindings[key] = `${primary.value}:${secondary.value}`;
    generateDraft();
  };

  controls.appendChild(primary);
  controls.appendChild(secondary);
  const conflictNote = document.createElement("span");
  conflictNote.className = "conflict-note";
  controls.appendChild(conflictNote);
  row.appendChild(controls);
  return row;
}

/* Generic N-level cascading row for input-capable pins, driven by a role
 * tree (see INPUT_ROLE_TREE). Unlike makeOutputRow's fixed 2 selects, this
 * renders however many <select> elements the chosen branch actually needs
 * -- 1 for Probe, 2 for Control/Macro, 3 for Limit -- and re-renders from
 * scratch on every change. Whenever a choice is made at some level, any
 * deeper level is auto-filled with its first child so bindings[key] always
 * names a complete, valid leaf value (same policy makeOutputRow uses). */
function makeInputRow(key, name, sub, tree, vendorLabel) {
  const row = document.createElement("div");
  row.className = "row cascade-row";
  row.dataset.resourceKey = key;
  const lbl = document.createElement("div");
  lbl.className = "lbl";
  lbl.innerHTML = `<span class="name">${name}</span><span class="sub">${sub}</span>`;
  if (vendorLabel && vendorLabel !== name) lbl.title = `${name} (${vendorLabel})`;
  row.appendChild(lbl);

  const controls = document.createElement("div");
  controls.className = "cascade-controls";
  row.appendChild(controls);
  const conflictNote = document.createElement("span");
  conflictNote.className = "conflict-note";
  // Appended inside controls at the end of every render() call below (not
  // just once here) -- render() does `controls.innerHTML = ""` on every
  // rebuild (each level change), which would otherwise wipe this out.
  row._cascadeTree = tree; // read by refreshRoleUniqueness() to gray out exhausted branches, not just exhausted leaves

  // Auto-fills the remaining levels below a newly-chosen branch down to a
  // leaf (same "always land on a complete, valid role value" policy
  // makeOutputRow uses) -- but prefers the first leaf NOT already claimed by
  // a DIFFERENT resource (see refreshRoleUniqueness()), rather than always
  // the tree's literal first child. Without this, picking the same branch
  // on two different resources (e.g. two motor sockets both set to "X
  // axis") would silently auto-assign BOTH of them the exact same leaf
  // ("First Motor") before the graying logic ever got a chance to steer the
  // user away from it. Returns null (NOT a duplicate) if every leaf under
  // this branch is already claimed elsewhere -- the caller must refuse the
  // pick rather than silently commit a second resource to an already-taken
  // role (a real bug in an earlier version of this fix: with only 2 real
  // leaves per axis, motor:0 and motor:1 could each grab one, but motor:2
  // switching to that SAME axis would still fall through to duplicating
  // motor:0's exact role since "every candidate is claimed" was treated as
  // "give up and pick the first one anyway" instead of "this pick is not
  // actually possible").
  function firstLeafPathFrom(node, segs) {
    const candidates = enumerateLeafPaths(node, segs);
    return candidates.find(path => !isRoleClaimedByOther(path.join(":"), key)) || null;
  }

  function render() {
    controls.innerHTML = "";
    const curPath = (bindings[key] || "unused").split(":");

    const top = document.createElement("select");
    const unusedOpt = document.createElement("option");
    unusedOpt.value = "unused"; unusedOpt.textContent = "— Unused —";
    top.appendChild(unusedOpt);
    Object.keys(tree).forEach(k => {
      const opt = document.createElement("option");
      opt.value = k; opt.textContent = tree[k].label;
      top.appendChild(opt);
    });
    const topVal = tree[curPath[0]] ? curPath[0] : "unused";
    top.value = topVal;
    top.onchange = () => {
      if (top.value === "unused") {
        bindings[key] = "unused";
      } else {
        const leaf = firstLeafPathFrom(tree[top.value], [top.value]);
        if (!leaf) {
          // A branch with every leaf already claimed elsewhere is grayed
          // out by refreshRoleUniqueness() at this very select, so this
          // shouldn't normally be reachable via the UI -- silent, no-popup
          // safety net only.
          bindings[key] = "unused";
        } else {
          bindings[key] = leaf.join(":");
        }
      }
      // render() first, THEN generateDraft() -- refreshGpioConflicts()/
      // refreshRoleUniqueness() (called at the end of generateDraft()) need
      // to run against the FRESH selects render() is about to build, not
      // the stale ones about to be torn down, or this row's own new options
      // would show no disabled state until some unrelated later change.
      render();
      generateDraft();
    };
    controls.appendChild(top);
    controls.appendChild(conflictNote);
    if (topVal === "unused") return;

    let node = tree[topVal];
    let pathSoFar = [topVal];
    let level = 1;
    while (node.children) {
      const sel = document.createElement("select");
      Object.keys(node.children).forEach(ck => {
        const opt = document.createElement("option");
        opt.value = ck; opt.textContent = node.children[ck].label;
        sel.appendChild(opt);
      });
      const chosen = node.children[curPath[level]] ? curPath[level] : Object.keys(node.children)[0];
      sel.value = chosen;

      const parentNode = node, segsBefore = pathSoFar.slice();
      sel.onchange = () => {
        const chosenNode = parentNode.children[sel.value];
        const leaf = firstLeafPathFrom(chosenNode, segsBefore.concat([sel.value]));
        if (!leaf) {
          // Same silent safety net as the top-level handler above -- an
          // exhausted branch is grayed out here too, so this option
          // shouldn't normally be selectable via the UI at all.
          bindings[key] = "unused";
        } else {
          bindings[key] = leaf.join(":");
        }
        render(); // see the top-level onchange's comment on this ordering
        generateDraft();
      };

      controls.appendChild(sel);
      pathSoFar.push(chosen);
      node = node.children[chosen];
      level++;
    }
  }

  render();
  return row;
}

function countResources() {
  let n = 0;
  if (board.motor_sockets) n += (board.motor_sockets.sockets||[]).length;
  n += (board.generic_pins||[]).length;
  (board.expansion_sockets||[]).forEach(s => n += (s.pins||[]).length);
  n += (board.rs485_channels||[]).length;
  n += (board.expansion_uarts||[]).length;
  n += (board.i2c_connectors||[]).length;
  return n;
}

/* Shared body-builder for the two virtual-axis motor types that are just a
 * single PWM-capable pin -- no STEP/DIR/UART/SPI at all (see Motors/
 * RcServo.h, Motors/Solenoid.h). Used both when a board's own onboard_fixed
 * motor socket is hardwired for one of these (motorBlockFor() below) and
 * when an ordinary output-capable Generic pin gets assigned an "Axis --
 * RC Servo"/"Axis -- Solenoid" role (see generateDraft()'s allPins loop) --
 * same real config.yaml block either way, just a different source for
 * output_pin, so both paths go through this one function rather than
 * risking the two bodies drifting apart.
 *
 * Field lists/defaults confirmed directly against RcServo.h/Solenoid.h
 * (schema/config_items.yaml's axes.<letter>.motorN.rc_servo:/.solenoid:
 * sections mirror this exactly) -- the driver's actual pwm_hz/
 * min_pulse_us/max_pulse_us/timer_ms.
 *
 * No explicit `overrides` here -- every field below is @tuning-tagged in
 * source, so configDocSpecFor()'s section-scoped config_items.yaml lookup
 * (see collectAndInjectSlots()) already resolves each one correctly on its
 * own, including telling RcServo's min_pulse_us/max_pulse_us (real
 * per-servo travel-range facts, left open) apart from BESC's identically-
 * named fields (see TUNING_CLASSIFICATION_REVIEW.md). A hand-written
 * override here would just be a second, driftable copy of what source
 * already says. */
function axisMotorBlockFor(type, outputPin) {
  if (type === "solenoid") {
    return {
      key: "solenoid",
      body: {
        output_pin: outputPin,
        pwm_hz: TBD, off_percent: TBD, pull_percent: TBD,
        hold_percent: TBD, pull_ms: TBD, direction_invert: TBD, timer_ms: TBD,
      },
    };
  }
  return {
    key: "rc_servo",
    body: { output_pin: outputPin, pwm_hz: TBD, min_pulse_us: TBD, max_pulse_us: TBD, timer_ms: TBD },
  };
}

/* ---------------------------------------------------------------------
 * Phase B: build the draft config.yaml from current bindings.
 * TBD stubs are inserted only for parameters of roles that got bound —
 * never for the universe of possible FluidNC roles.
 * ------------------------------------------------------------------- */
function motorBlockFor(socket) {
  const dc = socket.driver_class;
  if (dc === "onboard_fixed") {
    const t = socket.fixed_motor_type;
    if (t === "rc_servo") {
      return axisMotorBlockFor("rc_servo", socket.pins.output_pin);
    }
    if (t === "solenoid") {
      return axisMotorBlockFor("solenoid", socket.pins.output_pin);
    }
    if (t === "unipolar") {
      // ULN2003-driven 28BYJ-48 motor (bdring/FluidNC#1797,
      // Motors/UnipolarMotor.h) -- no step_pin/direction_pin at all, just
      // four independent phase-drive outputs, already grouped as one
      // socket's pins by board.schema.json (see its fixed_motor_type
      // dispatch), unlike rc_servo/solenoid's single output_pin. half_step
      // has a real firmware default (true) but is still left an open TBD
      // like every other per-machine tuning field this wizard doesn't
      // silently guess.
      return { key: "unipolar", body: {
        phase0_pin: socket.pins.phase0_pin,
        phase1_pin: socket.pins.phase1_pin,
        phase2_pin: socket.pins.phase2_pin,
        phase3_pin: socket.pins.phase3_pin,
        half_step: TBD,
      }};
    }
    if (t === "tmc_2209") {
      return { key: "tmc_2209", body: {
        step_pin: socket.pins.step_pin,
        direction_pin: socket.pins.direction_pin,
        disable_pin: socket.pins.disable_pin,
        uart_num: 1,
        addr: socket.extra ? socket.extra.addr : TBD,
        r_sense_ohms: TBD, run_amps: TBD, hold_amps: TBD, microsteps: TBD
      }};
    }
    if (t === "tmc_2130") {
      return { key: "tmc_2130", body: {
        step_pin: socket.pins.step_pin,
        direction_pin: socket.pins.direction_pin,
        cs_pin: socket.pins.cs_pin,
        r_sense_ohms: TBD, run_amps: TBD, hold_amps: TBD, microsteps: TBD
      }};
    }
    if (t === "tmc_5160") {
      // FluidNC doesn't support TMC2160 by its own name -- it's functionally
      // identical to TMC5160 as far as FluidNC's driver code is concerned
      // (TMC5160 adds an onboard motion controller FluidNC doesn't use), so
      // a board with real TMC2160 chips (e.g. BTT Rodent) still uses
      // fixed_motor_type: tmc_5160. spi_index is a real, fixed board fact
      // (this chip's fixed position in the SPI daisy chain) -- not a
      // per-machine tuning choice -- so it comes straight from socket.extra,
      // same pattern as tmc_2209's addr.
      return { key: "tmc_5160", body: {
        step_pin: socket.pins.step_pin,
        direction_pin: socket.pins.direction_pin,
        disable_pin: socket.pins.disable_pin || "NO_PIN",
        cs_pin: socket.pins.cs_pin || "NO_PIN",
        spi_index: socket.extra ? socket.extra.spi_index : TBD,
        r_sense_ohms: TBD, run_amps: TBD, hold_amps: TBD, microsteps: TBD
      }};
    }
    return { key: t || "onboard_fixed", body: Object.assign({}, socket.pins, { run_amps: TBD }) };
  }
  if (dc === "stepstick_socket") {
    // Current is set by the module's trimpot, and many boards select some
    // microstep bits with physical jumpers. A board may nevertheless wire
    // one or more MSx pins (or RESET) to controllable GPIO/I2SO outputs.
    // Preserve every such optional board fact in the generated stepstick
    // block; pinWidgetHtml() then lets the config author choose :high/:low.
    // External-driver resources do not carry these pins, so their
    // standard_stepper block remains unaffected.
    const body = {
      step_pin: socket.pins.step_pin,
      direction_pin: socket.pins.direction_pin,
      disable_pin: socket.pins.disable_pin || "NO_PIN"
    };
    ["ms1_pin", "ms2_pin", "ms3_pin", "reset_pin"].forEach(field => {
      if (socket.pins[field]) body[field] = socket.pins[field];
    });
    return { key: "stepstick", body };
  }
  // external_connector
  return { key: "standard_stepper", body: {
    step_pin: socket.pins.step_pin,
    direction_pin: socket.pins.direction_pin,
    disable_pin: socket.pins.disable_pin || "NO_PIN"
  }};
}

// Same idea as KINSELECT/KINEMATICS_TYPES: this axis's homing entry is
// keyed by homingSentinel(letter) in `cfg` itself, whether homing is
// enabled or not, so the selector (homingWidgetHtml()) always sits exactly
// where the real "homing:" key belongs -- a non-existent homing: section
// really is different from an empty one, so the wizard shouldn't ever
// carry a real "homing" key around internally for a disabled axis, only
// this sentinel key. The final resolved/copy-download step (see
// generateDraft()) renames this key to the real "homing" when enabled, or
// deletes it outright when disabled -- so config.yaml genuinely omits the
// section rather than ever emitting an empty or placeholder one.
function homingSentinel(letter) { return `HOMINGSELECT_${letter}`; }

function ensureAxis(cfg, letter) {
  if (!cfg.axes[letter]) {
    cfg.axes[letter] = {
      steps_per_mm: TBD,
      max_rate_mm_per_min: TBD,
      acceleration_mm_per_sec2: TBD,
      max_travel_mm: TBD,
      soft_limits: TBD,
      [homingSentinel(letter)]: homingEnabled[letter] ? {
        cycle: TBD,
        positive_direction: TBD,
        mpos_mm: TBD,
        feed_mm_per_min: TBD,
        seek_mm_per_min: TBD,
        settle_ms: TBD,
        seek_scaler: TBD,
        feed_scaler: TBD
      } : null
    };
  }
  return cfg.axes[letter];
}

function generateDraft() {
  const cfg = {};
  cfg.name = TBD;
  cfg.board = board.board.name;

  // Board-specific/pre-populated default overrides for open TBD fields --
  // see collectAndInjectSlots' defaultOverrides param. Declared up front
  // (rather than local to the motor-sockets loop below) since the Start:
  // block also contributes entries to this same map.
  const paramDefaultOverrides = {};

  // Terse "# <label>" comments are produced by inserting a marker KEY
  // (annotate(obj, targetKey, label) below), named after the exact real
  // key it captions, into the SAME object that key belongs to -- inserted
  // immediately before that key's first assignment, so plain JS object
  // insertion-order (already relied on elsewhere here, e.g. uart-before-
  // ModbusVFD ordering) places it directly above, as a SIBLING at the same
  // indentation, never nested inside the thing it's captioning (nesting it
  // one level deeper, e.g. right above a block's own first field, could be
  // misread as captioning only that first field rather than the whole
  // block). js-yaml dumps the marker as an ordinary-looking
  // "__ANNOTATE_FOR_<key>__: <label>" line; annotateYaml() below does a
  // dumb text pass converting every such line into "# <label>" afterward.
  // Naming the marker after its target key (rather than a plain running
  // counter) makes a second annotate() call for the same key idempotently
  // UPDATE that one marker in place rather than stack a second, stale
  // comment above it -- needed because some keys (e.g. a colliding uartN:
  // block shared by RS485 and an expansion UART) get legitimately
  // reassigned wholesale later in this function; the comment should track
  // whichever binding actually won, not accumulate every past one.
  function annotate(obj, targetKey, label) { obj[`__ANNOTATE_FOR_${targetKey}__`] = label; }

  // Kinematics -- always present, defaulting to a bare Cartesian
  // subsection (FluidNC's own real default when unspecified). No left-pane
  // row (see renderResources()'s comment) -- the system-name key itself is
  // a live selector INSIDE the draft, via the KINSELECT sentinel (see
  // kinWidgetHtml()/buildInteractiveYaml()); switching systems here
  // populates any subordinate geometry items as ordinary TBD fields. No
  // "# <label>" annotate() comment either, same reasoning as Start: not
  // tied to any particular board resource, so there's no "which board fact
  // triggered this" story worth captioning.
  const kt = KINEMATICS_TYPES[kinematicsType] || KINEMATICS_TYPES.Cartesian;
  cfg.kinematics = { KINSELECT: kt.stub() };

  // Start -- always present, no left-pane row (see comment on the section's
  // declaration above). All 3 fields are @tuning typical in source, so
  // configDocSpecFor() (see collectAndInjectSlots()) pre-populates them from
  // config_items.yaml automatically -- no explicit defaultOverrides entry
  // needed here anymore, unlike a board-specific hint such as r_sense_ohms
  // (a real per-instance fact config_items.yaml has no way to know). No
  // "# <label>" annotate() comment here -- unlike every other annotated
  // section/pin, Start isn't associated with any particular board resource,
  // so there's no "which board fact triggered this" fact worth captioning.
  cfg.start = { must_home: TBD, deactivate_parking: TBD, check_limits: TBD };

  const engineMap = { i2s: "I2S_STREAM", rmt: "RMT", timed: "Timed", pio: "PIO" };
  cfg.stepping = {
    engine: engineMap[(board.stepping.engines||["rmt"])[0]] || "RMT",
    idle_ms: TBD, pulse_us: TBD, dir_delay_us: TBD, disable_delay_us: TBD
  };

  // Fixed peripherals: fully known facts, copied straight through, no TBD.
  // Picked field-by-field (not a raw copy of the board.yaml object) since
  // board.schema.json's fixed_peripherals $defs allow board-authoring-only
  // fields FluidNC's own config schema has no such key for at all -- e.g.
  // notes: (a human-readable annotation for whoever's reading the board.yaml
  // source, not a real config.yaml key) -- a bare Object.assign/direct
  // reference would silently carry that straight into the generated config.
  const fp = board.fixed_peripherals || {};
  if (fp.spi) cfg.spi = { miso_pin: fp.spi.miso_pin, mosi_pin: fp.spi.mosi_pin, sck_pin: fp.spi.sck_pin };
  if (fp.sdcard) {
    cfg.sdcard = { cs_pin: fp.sdcard.cs_pin };
    // card_detect_pin is only written here when THIS board's own data
    // already fixes it to a real pin -- an explicit "NO_PIN" (now
    // mandatory in every board file, see board.schema.json's own
    // description) means this board's SD socket component genuinely has
    // no card-detect switch at all, so the field is simply omitted here,
    // same as FluidNC's own default when the key is absent. NOT filled
    // in by a "sdcard:card_detect" Generic Pin role -- computeBoardFixedRoles()
    // permanently blacklists it (see that function's own comment for
    // why this isn't a spare-GPIO situation).
    if (fp.sdcard.card_detect_pin && fp.sdcard.card_detect_pin !== "NO_PIN") {
      cfg.sdcard.card_detect_pin = fp.sdcard.card_detect_pin;
    }
    // frequency_hz -- SPI clock speed, the one genuinely user-adjustable
    // sdcard: field whenever card_detect_pin isn't ALSO user-assignable --
    // @tuning typical in source, pre-filled from config_items.yaml via
    // configDocSpecFor().
    cfg.sdcard.frequency_hz = TBD;
  }
  if (fp.i2so) {
    cfg.i2so = { bck_pin: fp.i2so.bck_pin, data_pin: fp.i2so.data_pin, ws_pin: fp.i2so.ws_pin };
    // min_pulse_us -- @tuning typical in source, pre-filled from
    // config_items.yaml via configDocSpecFor() once stubbed here, same
    // as sdcard.frequency_hz above. Stubbed unconditionally since it's
    // relevant whenever I2SO stepping is used at all, regardless of
    // oe_pin (never Generic-Pin-assignable -- see computeBoardFixedRoles()).
    cfg.i2so.min_pulse_us = TBD;
  }
  if (fp.ethernet) {
    // No current board actually has an onboard Ethernet PHY (unlike
    // spi:/sdcard:/i2so:, every board file's fixed_peripherals.ethernet
    // is absent today), but the shape mirrors sdcard: cs_pin/phy_type/
    // phy_addr are this (hypothetical, future) board's own fixed facts,
    // written straight through; int_pin/rst_pin are only written here
    // when already fixed to a real pin -- an explicit NO_PIN means this
    // (hypothetical) board's PHY chip genuinely has that pin unconnected,
    // so it's simply omitted, same reasoning and same permanent
    // computeBoardFixedRoles() blacklist as sdcard.card_detect_pin, not a
    // spare GPIO a role could fill in later.
    cfg.ethernet = { cs_pin: fp.ethernet.cs_pin, phy_type: fp.ethernet.phy_type, phy_addr: fp.ethernet.phy_addr };
    if (fp.ethernet.int_pin && fp.ethernet.int_pin !== "NO_PIN") cfg.ethernet.int_pin = fp.ethernet.int_pin;
    if (fp.ethernet.rst_pin && fp.ethernet.rst_pin !== "NO_PIN") cfg.ethernet.rst_pin = fp.ethernet.rst_pin;
