 * board.board.name`, so this is the common case for files this tool
 * produced. Both passes are case-insensitive, exact-match only (no fuzzy
 * matching -- a near-miss should fall through to "couldn't auto-detect"
 * rather than silently guess a different board). */
async function detectBoardId(doc) {
  const raw = doc && doc.board;
  if (!raw || typeof raw !== "string") return null;
  const target = raw.trim().toLowerCase();
  const idHit = BOARD_IDS.find(id => id.toLowerCase() === target);
  if (idHit) return idHit;
  const entries = await Promise.all(BOARD_IDS.map(async id => {
    const text = await fetchYamlTextOptional(`boards/${id}.board.yaml`);
    if (!text) return null;
    try {
      const parsed = jsyaml.load(text);
      return { id, name: parsed.board && parsed.board.name };
    } catch (e) {
      return null;
    }
  }));
  const nameHit = entries.find(e => e && typeof e.name === "string" && e.name.trim().toLowerCase() === target);
  return nameHit ? nameHit.id : null;
}

/* Shared by both real ways a config.yaml's text can enter this tool:
 * the "Load config.yaml..." file picker below, and a companion tool (e.g.
 * WebInstaller's "Open in Wizard", see notifyCompanionReady()) handing
 * over its currently-open file's contents via postMessage instead of a
 * local file dialog. Both end up needing the exact same parse/detect-
 * board/import/re-render sequence, just with a different source for the
 * raw text and a different human-readable label for the report ("a
 * filename" for the picker, "the label WebInstaller sent" for the
 * companion path -- see isFluidNCConfigMessage's own filename field). */
async function handleIncomingConfigText(rawText, sourceLabel) {
  let doc;
  try {
    doc = jsyaml.load(rawText);
  } catch (err) {
    document.getElementById("importReport").className = "note note-error";
    document.getElementById("importReport").style.display = "block";
    document.getElementById("importReport").innerHTML =
      `<b>Couldn't parse ${escapeHtml(sourceLabel)}:</b> ${escapeHtml(err.message)}`;
    return;
  }
  if (!doc || typeof doc !== "object") {
    document.getElementById("importReport").className = "note note-error";
    document.getElementById("importReport").style.display = "block";
    document.getElementById("importReport").innerHTML = `<b>${escapeHtml(sourceLabel)} doesn't look like a config.yaml (empty or not a mapping).</b>`;
    return;
  }

  const priorBoardId = board && board.board && board.board.id;
  const detectedId = await detectBoardId(doc);
  let boardNote = null;
  if (detectedId && detectedId !== priorBoardId) {
    await loadBoard(detectedId);
    document.getElementById("boardPicker").value = detectedId;
    syncUrlToBoard(detectedId);
    boardNote = `Auto-detected board from config's "board: ${doc.board}" -- switched to ${detectedId}.`;
  } else if (detectedId) {
    boardNote = `Config's "board: ${doc.board}" matches the currently selected board (${detectedId}).`;
  } else if (!priorBoardId) {
    // No board loaded yet (nothing is preselected at boot -- see boot())
    // and the config's own "board:" field, if any, didn't match a known
    // board either -- there's nothing to bind pins against yet.
    document.getElementById("importReport").className = "note note-error";
    document.getElementById("importReport").style.display = "block";
    document.getElementById("importReport").innerHTML = doc.board
      ? `<b>Config's "board: ${escapeHtml(doc.board)}" didn't match any known board.</b> Pick a board above first, then re-load this file.`
      : `<b>This config.yaml has no "board:" field to auto-detect from.</b> Pick a board above first, then re-load this file.`;
    return;
  } else if (doc.board) {
    boardNote = `Config's "board: ${doc.board}" didn't match any known board -- using the currently selected board (${priorBoardId}); verify pin bindings look right.`;
  }

  const report = importConfig(doc, rawText);
  renderResources();
  renderHotspotPane();
  wireHotspotHoverLinks();
  generateDraft();
  renderImportReport(report, sourceLabel, boardNote);
}

document.getElementById("configFileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => handleIncomingConfigText(reader.result, file.name);
  reader.onerror = () => {
    document.getElementById("importReport").className = "note note-error";
    document.getElementById("importReport").style.display = "block";
    document.getElementById("importReport").innerHTML = `<b>Couldn't read ${escapeHtml(file.name)}.</b>`;
  };
  reader.readAsText(file);
  e.target.value = ""; // allow re-selecting the same file later
});

/* js-yaml (correctly, per the YAML 1.1 spec it follows) quotes a bare
 * mapping key equal to a "y"/"n"/"on"/"off"/etc. bool-like word, to avoid
 * ambiguity with an actual boolean -- which is why the Y axis alone comes
 * out as 'y': while every other axis letter doesn't. FluidNC's own config
 * files/docs never quote axis names this way, so this strips the quotes
 * js-yaml adds specifically around AXES letters used as mapping keys
 * (leaving any other, unrelated quoting js-yaml does untouched). */
function dequoteAxisKeys(text) {
  return AXES.reduce((t, ax) => t.replace(new RegExp(`^(\\s*)(['"])${ax}\\2:`, "gm"), `$1${ax}:`), text);
}

/* Converts every "__ANNOTATE_FOR_<key>__: <label>" line js-yaml dumped
 * (see annotate() above) into a "# <label>" comment on the same line,
 * preserving whatever indentation js-yaml gave it -- since each marker was
 * inserted as an ordinary SIBLING key immediately before the one real key
 * it's meant to caption (never nested inside it), this lands the comment
 * directly above that key at the same nesting level, whether that's a
 * whole aggregate block (a motor socket's motor0:/motor1:, an RS485/
 * expansion UART's uartN:/uart_channelN:/ModbusVFD:) or a single pin field
 * (a limit/probe/control/user_input/spindle/coolant/digital-output pin) --
 * each marker is tied to exactly one resource, so there's never a multi-
 * label line to join. Strips a layer of quotes if js-yaml quoted the
 * label. */
function annotateYaml(text) {
  return text.split("\n").map(line => {
    const m = /^(\s*)__ANNOTATE_FOR_[A-Za-z0-9_]+__:\s*(.*)$/.exec(line);
    if (!m) return line;
    let label = m[2].trim();
    if ((label.startsWith("'") && label.endsWith("'")) || (label.startsWith('"') && label.endsWith('"'))) {
      label = label.slice(1, -1);
    }
    return `${m[1]}# ${label}`;
  }).join("\n");
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function formatFailedImports(entries) {
  return entries.map(entry => {
    const label = `Failed to import ${escapeHtml(entry.path)}:`;
    const dumped = jsyaml.dump(entry.value, { lineWidth: -1, noRefs: true });
    const escaped = escapeHtml(dumped);
    return `<div class="failed-import-entry"><div class="failed-import-label">${label}</div><pre>${escaped}</pre></div>`;
  }).join("");
}
function copyDraft() {
  const btn = event && event.target ? event.target : document.querySelector('button[onclick="copyDraft()"]');
  const flash = (ok) => {
    if (!btn) return;
    const original = btn.dataset.origLabel || btn.textContent;
    btn.dataset.origLabel = original;
    btn.textContent = ok ? "Copied!" : "Copy failed";
    setTimeout(() => { btn.textContent = original; }, 1500);
  };
  // Fallback used both when navigator.clipboard is unavailable (e.g. non-secure
  // origin -- clipboard-write requires https or localhost) and when it exists
  // but silently rejects (seen on Chrome/Windows: permissions-policy or an
  // enterprise clipboard restriction can reject writeText() with no visible
  // error). document.execCommand("copy") is deprecated but still broadly
  // supported and works from a plain user-gesture click handler.
  const fallbackCopy = () => {
    const ta = document.createElement("textarea");
    ta.value = lastPlainYaml;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    flash(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(lastPlainYaml).then(
      () => flash(true),
      () => fallbackCopy()
    );
  } else {
    fallbackCopy();
  }
}

function downloadDraft() {
  const blob = new Blob([lastPlainYaml], { type: "text/yaml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${board.board.id}.config.yaml`;
  a.click();
}

/* ---------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------- */
/* "Open Hotspot Editor" header button. Carries the currently-loaded
 * board's id as a ?board= param, mirroring index.html's own ?board=<id>
 * link-in support (see boot() below) -- hotspot-editor.html reads the same
 * param at its own boot to auto-select that board, so a fresh trip over
 * there doesn't land on a blank "pick a board" state. Only when a real
 * repo board (not a locally-picked custom file, which has no
 * boards/<id>.board.yaml for the hotspot editor to fetch) is currently
 * loaded -- board.board.id still exists for a custom file, but passing it
 * would just make the hotspot editor's own fetch 404 pointlessly.
 * Named window.open() target (not "_blank") so repeated clicks reuse the
 * same companion tab rather than piling up a new one each time -- there's
 * deliberately no equivalent "Back to Wizard" button on that side doing
 * the same for the return trip: navigating a reused tab is a real reload,
 * which would silently discard whatever hotspot-placement work was
 * already in progress there. Switching back manually (click the tab,
 * Cmd/Ctrl+Tab) costs nothing and loses nothing.
 *
 * Disabling the button while that tab is known open guards against the
 * exact same reload-discards-work risk from THIS side: window.open()
 * hands back a live reference to whatever tab it opened/reused
 * (hotspotEditorWin), and .closed is one of the few properties readable on
 * a cross-tab WindowProxy without restriction -- no "browser safety" wall
 * here, just no API for "does a tab named X exist" independent of having
 * opened it yourself. That's this mechanism's real limit: it only tracks a
 * tab THIS wizard tab instance opened and has held an unbroken reference
 * to. A reload of the wizard tab itself (manual refresh, or a fresh
 * ?board= link-in) forgets any such handle, so the button would light
 * back up even if that hotspot-editor tab is still genuinely open
 * elsewhere -- accepted as a real but narrow gap, not fixable without an
 * API browsers don't provide. */
let hotspotEditorWin = null;

function updateHotspotEditorBtn() {
  const stillOpen = !!(hotspotEditorWin && !hotspotEditorWin.closed);
  // Swapped for an actual instruction, not just grayed out -- a disabled
  // button alone gives no clue WHY, or what to do instead, and is easy to
  // read as "broken" rather than "already handled elsewhere." btn.disabled
  // is still set too, purely as defense in depth (e.g. a stale rendered
  // button somehow left visible) -- gotoHotspotEditor()'s own guard is the
  // real backstop against firing while stillOpen.
  document.getElementById("gotoHotspotEditorBtn").disabled = stillOpen;
  document.getElementById("gotoHotspotEditorBtn").style.display = stillOpen ? "none" : "";
  document.getElementById("hotspotEditorOpenNote").style.display = stillOpen ? "" : "none";
}

// No "this window closed" event exists to react to, so this polls .closed
// on a plain interval -- cheap (one property read) and only running at all
// while a handle is actually being tracked, stopping itself the moment
// that tab closes rather than polling forever.
function pollHotspotEditorWin() {
  if (!hotspotEditorWin) return;
  if (hotspotEditorWin.closed) {
    hotspotEditorWin = null;
    updateHotspotEditorBtn();
    return;
  }
  setTimeout(pollHotspotEditorWin, 1000);
}

function gotoHotspotEditor() {
  // Shouldn't normally be reachable (the button is disabled in this
  // state), but kept as a non-throwing safety net rather than trusting the
  // disabled attribute alone against every possible way this could fire.
  if (hotspotEditorWin && !hotspotEditorWin.closed) return;
  const id = board && board.board && BOARD_IDS.includes(board.board.id) ? board.board.id : null;
  const url = id ? `hotspot-editor.html?board=${encodeURIComponent(id)}` : "hotspot-editor.html";
  hotspotEditorWin = window.open(url, "fluidnc_hotspot_editor");
  updateHotspotEditorBtn();
  pollHotspotEditorWin();
}

const picker = document.getElementById("boardPicker");
// Placeholder option -- nothing is preselected/auto-loaded at boot (see
// boot() below), so there needs to be a real "no board chosen yet" option
// for the picker to actually show, rather than silently defaulting to
// whichever real board happens to be first in BOARD_IDS.
const placeholderOpt = document.createElement("option");
placeholderOpt.value = "";
placeholderOpt.textContent = "— Select a board —";
picker.appendChild(placeholderOpt);

// "Custom..." is a fixed option (not part of BOARD_IDS/the manifest) that
// picks a board.yaml straight off the local filesystem via a file input --
// see loadCustomBoardFile() above and its handler wiring below. Its <option>
// is created here but deliberately appended to the picker at the END of
// loadBoardManifest() below (after the real boards), and indented with a
// couple of leading NBSPs (plain CSS padding on <option> is ignored by
// some browsers, e.g. Safari) so it visually reads as the odd one out
// tucked below the real board list, not just one more board among them.
const CUSTOM_OPT_VALUE = "__custom__";
const customOpt = document.createElement("option");
customOpt.value = CUSTOM_OPT_VALUE;
customOpt.style.paddingLeft = "1.5em";
customOpt.textContent = "  Custom (choose a local file)...";

const customBoardFileInput = document.getElementById("customBoardFileInput");
picker.onchange = () => {
  if (picker.value === CUSTOM_OPT_VALUE) {
    customBoardFileInput.click();
    return;
  }
  if (picker.value) { loadBoard(picker.value); syncUrlToBoard(picker.value); }
};
customBoardFileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  customBoardFileInput.value = ""; // allow re-picking the same file later
  if (!file) {
    // User cancelled the file dialog -- picker is still showing "Custom...",
    // which has nothing loaded behind it, so fall back to whatever real
    // board (if any) is currently loaded, or the placeholder if none is.
    picker.value = (board && board.board && BOARD_IDS.includes(board.board.id)) ? board.board.id : "";
    return;
  }
  loadCustomBoardFile(file);
});

/* Fetches boards/index.json (see tools/gen_board_index.py) and populates
 * BOARD_IDS + the dropdown from it. A missing/unreadable manifest degrades
 * to an empty dropdown rather than breaking boot -- direct-URL loading via
 * ?board=<id> still works either way (see boot() below), and the picker
 * itself just won't have anything to search until the manifest is fixed. */
async function loadBoardManifest() {
  try {
    // no-store -- python3 -m http.server (this repo's own documented way to
    // serve it locally) sends no Cache-Control header at all, just
    // Last-Modified, which is exactly the condition browsers use heuristic
    // caching under: a plain reload after adding a new board.yaml can
    // silently keep serving the OLD index.json from cache, showing a board
    // list that's missing the just-added board with no error of any kind
    // (confirmed as the actual cause of bdring/FluidNC-config-wizard#14's
    // "greyhound not showing up" report -- the board file itself was fine).
    const res = await fetch("boards/index.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    BOARD_IDS = await res.json();
  } catch (e) {
    console.warn(`Couldn't load boards/index.json (${e.message}); board dropdown will be empty. Run tools/gen_board_index.py.`);
    BOARD_IDS = [];
  }
  BOARD_IDS.forEach(id => {
    const o = document.createElement("option");
    o.value = id; o.textContent = id;
    picker.appendChild(o);
  });
  // Appended last, after the real (manifest-driven) boards -- see the
  // comment by customOpt's creation above.
  picker.appendChild(customOpt);
}

/* ---------------------------------------------------------------------
 * URL-based board selection: index.html?board=<id> preselects and loads
 * that board at boot, so a board's own wiki/vendor page can link straight
 * into the wizard already showing the right resource list -- e.g.
 * "index.html?board=corgi" -- rather than requiring every
 * visitor to find and click through the dropdown themselves. Two halves:
 * getBoardIdFromUrl() (read on boot) and syncUrlToBoard() (called
 * whenever the selected board changes some other way -- the picker
 * itself, or config.yaml auto-detection on import -- so the address bar
 * stays a valid, shareable/bookmarkable link to whatever's currently
 * loaded, without adding a new history entry per change).
 * ------------------------------------------------------------------- */
function getBoardIdFromUrl() {
  return new URLSearchParams(window.location.search).get("board");
}
function syncUrlToBoard(id) {
  const url = new URL(window.location.href);
  if (id) url.searchParams.set("board", id);
  else url.searchParams.delete("board");
  history.replaceState(null, "", url);
}

/* ---------------------------------------------------------------------
 * Companion-tool handoff: index.html?companion=<key>, opened via
 * window.open() (NOT a plain link/target=_blank with rel="noopener", which
 * would sever window.opener and silently break this) from another
 * FluidNC web tool -- e.g. WebInstaller's own "Configure" button. Shows
 * one extra toolbar button ("Send to <Tool>") that posts the current
 * draft straight back to the opener tab via postMessage, so the user
 * never has to manually download-then-reupload the file.
 *
 * Deliberately gated on a known ?companion= key (not just "window.opener
 * is truthy") -- some other page could open this tab with target=_blank
 * and happen not to strip opener, and showing a "Send to WebInstaller"
 * button in that case would be actively misleading. Only a companion this
 * file explicitly knows about, by name, gets the button and the postMessage
 * targetOrigin lock (never "*" -- this carries a real machine config).
 *
 * This is additive, not a replacement for Copy/Download/Load -- if the key
 * is unrecognized, opener is missing/closed, or postMessage isn't
 * available for any reason, those three keep working exactly as before.
 *
 * The postMessage targetOrigin: COMPANION_TOOLS[key].origin below is only
 * ever a FALLBACK default, not the value actually used whenever the opener
 * tells us its real origin. postMessage's delivery check is exact-string
 * -- the browser silently drops the message (no error, no exception) if
 * targetOrigin doesn't byte-for-byte match the opener window's actual
 * origin -- so hardcoding only the production URL here would silently
 * break every non-production opener (a WebInstaller dev build running on
 * localhost, a PR preview deploy, etc.), exactly the failure a user hit
 * testing WebInstaller at localhost:1234 against this tool's real
 * deployed URL: the button appeared to work (this tab correctly detected
 * a live, known companion and showed "Send to WebInstaller"), the message
 * was sent, but it was silently addressed to
 * "https://installer.fluidnc.com" while the real opener was
 * "http://localhost:1234", so the browser dropped it with zero
 * indication anything had gone wrong. Fix: the opener now appends its own
 * REAL origin as a `&origin=` param when it opens this tab (see
 * fluid-installer-breiler's openWizard()), and initCompanionHandoff()
 * uses that verbatim as activeCompanion.origin whenever present and
 * well-formed, falling back to COMPANION_TOOLS[key].origin only for older
 * links that don't pass it. This is safe to trust from the URL (not a
 * spoofing vector) precisely because of that same exact-match delivery
 * check: passing a WRONG origin here can only ever cause the message to
 * be (silently) dropped, never redirected somewhere else -- window.opener
 * is a live reference to the real opener, whatever origin string this
 * code is told to address it as.
 * ------------------------------------------------------------------- */
const COMPANION_TOOLS = {
  webinstaller: { label: "WebInstaller", origin: "https://installer.fluidnc.com" },
};
let activeCompanion = null; // { key, label, origin } of the tool that opened this tab, once confirmed live -- see initCompanionHandoff()/sendToCompanion()
// Our own private handle on the opener, captured once in
// initCompanionHandoff() -- see its own comment for why this exists
// instead of just reading window.opener wherever it's needed (notably
// sendToCompanion(), which needs it at an arbitrary later time, whenever
// the user finishes a draft and clicks "Send to <tool>").
let openerWindow = null;

// Very permissive on purpose -- just enough to reject obvious garbage
// (missing scheme, stray path/query, whitespace) before handing the value
// to postMessage as a targetOrigin; anything that looks vaguely like
// "scheme://host[:port]" is accepted, since localhost/127.0.0.1/private-IP
// dev origins all need to keep working here, not just production domains.
function isPlausibleOrigin(s) {
  return typeof s === "string" && /^https?:\/\/[^\/\s]+$/i.test(s);
}

function initCompanionHandoff() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get("companion");
  const companion = key && COMPANION_TOOLS[key];
  if (!companion || !window.opener || window.opener.closed) return;
  // Keep our OWN private reference for later (notifyCompanionReady()/
  // sendToCompanion() both need it, possibly much after this function
  // returns -- sendToCompanion() in particular fires whenever the user
  // eventually clicks "Send to <tool>", which could be minutes into a
  // design session), then immediately null out the GLOBAL window.opener
  // property. Partial defense-in-depth against reverse tabnabbing (a
  // compromised popup can use window.opener.location to silently redirect
  // the tab that opened it): this does NOT protect against a compromise
  // of THIS file's own first-party code (an attacker controlling
  // index.html itself would simply omit this line, or navigate before it
  // runs) -- only against some OTHER, later-injected script on this same
  // page reaching the opener through the global property. The full fix
  // (a noopener popup + MessageChannel, or an iframe-sandboxed embed
  // instead of a popup) isn't a drop-in replacement here: MessageChannel
  // still needs an initial live window reference to transfer a port
  // through, which is exactly what noopener prevents from ever existing,
  // so it can't bootstrap a channel with a tab it was never given a
  // handle to. See PROGRESS.md for the fuller writeup (from a GitHub
  // Copilot PR review comment on the WebInstaller side of this feature).
  openerWindow = window.opener;
  try { window.opener = null; } catch (e) { /* some older browsers make window.opener read-only; best-effort, non-fatal */ }
  const declaredOrigin = params.get("origin");
  const origin = isPlausibleOrigin(declaredOrigin) ? declaredOrigin : companion.origin;
  activeCompanion = Object.assign({ key }, companion, { origin });
  const btn = document.getElementById("sendToCompanionBtn");
  btn.textContent = `Send to ${companion.label}`;
  btn.style.display = "";

  // Receiving direction: the opener (e.g. WebInstaller's "Open in Wizard")
  // may have its own config.yaml already open and want to hand IT to us,
  // so the user can pick up editing it here instead of starting from a
  // blank board pick. Reuses the exact same "fluidnc-config" message
  // shape sendToCompanion() sends in the other direction -- it's the same
  // payload either way, just going the opposite direction across the same
  // opener/opened pair, so one shape covers both. Gated on
  // activeCompanion.origin (never "*"), same reasoning as sendToCompanion:
  // wrong-origin messages just get silently ignored here, they can't be
  // misdirected TO the wrong place by an attacker since we're the
  // receiver deciding what to trust, not the sender.
  window.addEventListener("message", (event) => {
    if (!activeCompanion || event.origin !== activeCompanion.origin) return;
    const data = event.data;
    if (!data || data.type !== "fluidnc-config" || data.version !== 1 || typeof data.contents !== "string") return;
    console.log("[fluidnc-wizard] received config from opener:", data.filename);
    // Safe to call even before loadRoleData() resolves -- see
    // notifyCompanionReady(), which is only ever sent to the opener AFTER
    // loadRoleData() has already succeeded, so by the time a real reply
    // can possibly arrive back here, boot()'s own await of that same
    // promise has already completed too.
    handleIncomingConfigText(data.contents, data.filename || `${companion.label} config`);
  });
}

// Tells the opener (if any) that this tab is a live, ready-to-receive
// companion session -- see initCompanionHandoff()'s message listener
// above. Deliberately called from boot() only AFTER loadRoleData() has
// resolved (not from initCompanionHandoff() itself, which runs first,
// before any of that schema-derived data exists yet) -- sending "ready"
// any earlier would invite a race where the opener's reply arrives before
// this tab can actually process it (loadBoard()/importConfig() both
// depend on data loadRoleData() populates).
function notifyCompanionReady() {
  if (!activeCompanion || !openerWindow || openerWindow.closed) return;
  try {
    openerWindow.postMessage({ type: "fluidnc-wizard-ready", version: 1 }, activeCompanion.origin);
  } catch (e) { /* non-fatal -- opener just won't get a chance to hand us a config */ }
}

function sendToCompanion() {
  if (!activeCompanion || !board) {
    console.warn("[fluidnc-wizard] sendToCompanion: nothing to send", { activeCompanion, hasBoard: !!board });
    return; // no board picked/loaded yet -- nothing to send
  }
  const w = openerWindow;
  const btn = document.getElementById("sendToCompanionBtn");
  if (!w || w.closed) {
    // Opener tab was closed after this one loaded -- quietly retract the
    // button rather than posting into the void or erroring on click.
    console.warn("[fluidnc-wizard] sendToCompanion: opener gone, retracting button");
    activeCompanion = null;
    btn.style.display = "none";
    return;
  }
  // Logged permanently (not stripped in production) -- this handoff has no
  // other feedback channel if postMessage's delivery silently no-ops (e.g.
  // a stale/mismatched targetOrigin), and "Sent!" below only ever reflects
  // that this call was MADE, never that it was actually received -- see
  // the opener-side console.log this pairs with in
  // fluid-installer-breiler's ConfigurationModal.tsx.
  console.log("[fluidnc-wizard] sendToCompanion: posting to", activeCompanion.origin, "filename:", `${board.board.id}.config.yaml`);
  w.postMessage({
    type: "fluidnc-config",
    version: 1,
    filename: `${board.board.id}.config.yaml`,
    contents: lastPlainYaml,
  }, activeCompanion.origin);
  try { w.focus(); } catch (e) { /* some browsers/popup-blockers restrict focus(); non-fatal either way */ }
  const original = btn.dataset.origLabel || btn.textContent;
  btn.dataset.origLabel = original;
  btn.textContent = "Sent!";
  setTimeout(() => { btn.textContent = original; }, 1500);
}

// The role-tree/vocabulary data derived from schema/fluidnc-config-schema.json
// and schema/board.schema.json is global/board-independent, so it's loaded
// (and derived) once here before the first board, rather than per-loadBoard()
// like boards/chips/hotspots. Everything downstream (renderResources(),
// makeInputRow(), etc.) depends on INPUT_ROLE_TREE/SPINDLE_TYPES/
// BOARD_FIXED_SECTIONS/etc. being populated, so loadBoard() must not run
// until this resolves. Both of loadRoleData()'s schema fetches are required,
// same-origin static files this app ships with -- either one failing throws
// (see loadRoleData()'s own comments) and lands here, deliberately halting
// startup entirely rather than letting the wizard limp along in a partially-
// correct state: a missing/corrupt app file means the installation itself is
// broken, not that this one specific fetch's data should be treated as
// optional.
async function boot() {
  initCompanionHandoff();
  try {
    await loadRoleData();
  } catch (e) {
    document.getElementById("resourceCol").innerHTML = `<div class="note note-error">` +
      `Couldn't load a required schema file (${escapeAttr(e.message)}). If you opened this page ` +
      `via a file:// URL, browsers block fetch() of local files -- serve this folder over HTTP instead ` +
      `(e.g. "python3 -m http.server" from a terminal here, then open http://localhost:8000/index.html).</div>`;
    return;
  }
  await loadBoardManifest();
  // Only NOW -- after BOARD_IDS is actually populated -- do we invite the
  // opener to hand us a config. Sending this any earlier (originally
  // placed right after loadRoleData(), before this await) raced
  // detectBoardId(): its exact-id fast path (BOARD_IDS.find(...)) and its
  // by-name fallback both depend on BOARD_IDS being non-empty, so a
  // config that arrived before this line completed would silently fail
  // to auto-detect ITS OWN board -- exactly the bug reported ("board:
  // doberman" not matching, despite "doberman" being a perfectly valid
  // id) once WebInstaller started replying fast enough to win that race.
  notifyCompanionReady();
  // Normally no board is preselected/auto-loaded -- the user picks one
  // explicitly via the picker (or loads an existing config.yaml, which
  // auto-detects and selects its board for them, see configFileInput's
  // change handler) -- UNLESS a ?board=<id> URL param names one (see
  // getBoardIdFromUrl()/syncUrlToBoard() above), for linking directly into
  // the wizard with a board already selected.
  //
  // Deliberately NOT gated on BOARD_IDS.includes(urlBoardId): loadBoard()
  // fetches boards/<id>.board.yaml directly and reports its own error if
  // that fetch fails, so a board that exists on disk but isn't in the
  // manifest yet (e.g. a contributor testing a brand-new board.yaml before
  // running tools/gen_board_index.py) still loads via the URL param -- see
  // the comment above BOARD_IDS's declaration.
  const urlBoardId = getBoardIdFromUrl();
  if (urlBoardId) {
    if (BOARD_IDS.includes(urlBoardId)) document.getElementById("boardPicker").value = urlBoardId;
    await loadBoard(urlBoardId);
    return;
  }
  document.getElementById("boardNote").textContent = "Pick a board above to begin, or load an existing config.yaml.";
}
boot();
</script>
</body>
</html>
