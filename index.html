    cfg.ethernet.frequency_hz = TBD;
  }
  // NOTE: I2C is intentionally NOT handled here as a fixed peripheral --
  // unlike spi:/i2so:, FluidNC rarely has an onboard device actually using
  // the bus (its only I2C-consuming feature, an OLED display, is
  // deprecated), so a board's I2C pins are a bindable resource
  // (board.i2c_connectors), handled below alongside expansion_uarts, not
  // auto-emitted here. (Also confirmed against the connected FluidNC
  // source, MachineConfig.cpp's handler.sections("i2c", 0, MAX_N_I2C,
  // ...), that the real config key is numbered i2c0:/i2c1:/etc., not a
  // bare "i2c:" -- reflected in that emission below.)
  (fp.dedicated_uarts||[]).forEach((u, i) => {
    cfg[`uart${i+1}`] = { txd_pin: u.txd_pin, rxd_pin: u.rxd_pin, baud: u.baud, mode: u.mode };
  });

  cfg.axes = {};
  if (board.motor_sockets && board.motor_sockets.shared_disable_pin) {
    cfg.axes.shared_stepper_disable_pin = board.motor_sockets.shared_disable_pin;
  }
  // homing_runs -- number of homing passes, a top-level axes: scalar
  // (sibling of shared_stepper_disable_pin/reset_pin and the per-axis x/y/
  // z/... blocks, NOT inside any one axis' own homing: sub-block).
  // Unconditional like MachineConfig's own uncategorized scalars
  // (arc_tolerance_mm etc.) rather than gated on any axis having homing
  // enabled -- harmless/ignorable if no axis homes, and axes: itself is
  // always present regardless. @tuning typical in source, pre-filled from
  // config_items.yaml via configDocSpecFor().
  cfg.axes.homing_runs = TBD;

  // (paramDefaultOverrides declared up front, near cfg.name/-cfg.board above --
  // populated below when a motor socket's own extra facts document a
  // board-specific override, e.g. BTT Rodent's verified-correct
  // r_sense_ohms, overriding the generic per-driver-family guess
  // specForKey would otherwise suggest.)

  // Phase A results -> Phase B stubbing, motor sockets
  (board.motor_sockets ? board.motor_sockets.sockets : []).forEach((socket, i) => {
    const role = bindings[resourceKeyMotor(i)];
    if (!role || role === "unused") return;
    const [letter, slot] = role.split(":");
    if (!AXES.includes(letter)) return;
    const axis = ensureAxis(cfg, letter);
    const block = motorBlockFor(socket);
    // Annotated on `axis` (a sibling of motor0:/motor1:, at the same
    // indentation), not inside axis[slot] -- a comment nested one level
    // deeper, right above standard_stepper:, could be misread as applying
    // only to that first item rather than to the whole motor0:/motor1:
    // block this connector's pins occupy.
    annotate(axis, slot, socket.label);
    axis[slot] = axis[slot] || {};
    axis[slot][block.key] = block.body;
    // hard_limits is a sibling of the driver-type key above (and of
    // limit_neg_pin/limit_pos_pin/limit_all_pin, added later in the
    // allPins loop below if a limit switch gets bound to this motor) --
    // per-MOTOR, not per-axis (see specForKey's own comment on this key),
    // so it's stubbed here alongside the driver body, once per bound motor
    // socket, regardless of whether a limit pin ends up bound to it.
    axis[slot].hard_limits = TBD;
    if (socket.extra && socket.extra.r_sense_ohms_hint != null) {
      paramDefaultOverrides[`axes.${letter}.${slot}.${block.key}.r_sense_ohms`] = {
        default: socket.extra.r_sense_ohms_hint,
        defaultKind: "board",
      };
    }
  });

  // Generic pins + module-socket connectors -> limits / control / probe / spindle / coolant / digital outs
  const allPins = [];
  (board.generic_pins||[]).forEach((p, i) => allPins.push({ p, key: resourceKeyPin(i) }));
  // Module sockets' resolved generic_pin-kind connectors only -- their
  // expansion_uart-kind/rs485_channel-kind connectors are dispatched
  // separately below, alongside board.expansion_uarts/board.rs485_channels
  // (see allExpansionUarts/allRs485Channels), since those have their own
  // fixed uart_channel/ModbusVFD shape rather than the generic per-pin
  // role tree this loop drives.
  allModuleSocketConnectors().forEach(({ key, socket: s, connector: c, moduleName }) => {
    if (c.kind !== "generic_pin") return;
    allPins.push({ p: { label: `${s.label}/${moduleName}/${c.label}`, mcu_pin: c.mcu_pin, direction: c.direction }, key });
  });

  let spindleBound = false;
  cfg.control = {};
  allPins.forEach(({ p, key }) => {
    const role = bindings[key];
    if (!role || role === "unused") return;
    const pin = p.mcu_pin;

    if (role.startsWith("limit:")) {
      // "limit:<axis>:<motor0|motor1>:<neg|pos|all>" -- see INPUT_ROLE_TREE's
      // own declaration comment for why the motor level is real (a two-
      // motor axis' limit switches are per-motor in actual FluidNC config,
      // not shared at the axis level).
      const [, letter, motorSlot, which] = role.split(":");
      const axis = ensureAxis(cfg, letter);
      axis[motorSlot] = axis[motorSlot] || {};
      const field = which === "neg" ? "limit_neg_pin" : which === "pos" ? "limit_pos_pin" : "limit_all_pin";
      annotate(axis[motorSlot], field, p.label);
      axis[motorSlot][field] = pin;
    } else if (role.startsWith("spindle:")) {
      // Spindle type picks both the top-level config key and the exact
      // TBD tuning stub via SPINDLE_TYPES -- same dispatch-by-chosen-
      // variant pattern used for motor sockets and RS485/VFD spindles.
      // Each type's stub() reflects its own real config fields (e.g.
      // Relay/DAC genuinely have no pwm_hz; BESC has two extra tunables),
      // verified against FluidNC's actual source, not assumed uniform.
      const [, type, which] = role.split(":");
      const def = SPINDLE_TYPES[type];
      const cfgKey = def ? def.cfgKey : type;
      cfg[cfgKey] = cfg[cfgKey] || (def ? def.stub() : {});
      annotate(cfg[cfgKey], `${which}_pin`, p.label);
      cfg[cfgKey][`${which}_pin`] = pin;
      spindleBound = true;
    } else if (role.startsWith("user_output:")) {
      // "which" is "digital<n>" or "analog<n>" (stripPinSuffix's own
      // convention, same as every other section's dispatch) -- no
      // separate digital_output:/analog_output: cases needed, since
      // config_items.yaml's own field names already carry the
      // digital-vs-analog distinction.
      const which = role.split(":")[1];
      cfg.user_outputs = cfg.user_outputs || {};
      annotate(cfg.user_outputs, `${which}_pin`, p.label);
      cfg.user_outputs[`${which}_pin`] = pin;
      // <analogN>_hz -- per-channel PWM frequency, a real config field
      // with no resource/pin of its own to bind, so it's stubbed as an
      // ordinary open TBD the moment this channel gets a pin, same as a
      // spindle type's tuning fields. Whether a companion "<which>_hz"
      // field exists at all is looked up in CONFIG_ITEM_DOCS directly
      // (true only for analogN today) rather than hardcoded as
      // which.startsWith("analog") -- config_items.yaml already answers
      // that, no naming-convention guess needed. Only set once per
      // channel (never overwrites a value the user already typed in).
      const hzField = `${which}_hz`;
      if (CONFIG_ITEM_DOCS.user_outputs && CONFIG_ITEM_DOCS.user_outputs[hzField] && cfg.user_outputs[hzField] === undefined) {
        cfg.user_outputs[hzField] = TBD;
      }
    } else if (role.startsWith("axis:")) {
      // "axis:<rc_servo|solenoid>:<letter>:<motor0|motor1>" -- an ordinary
      // output-capable pin standing in for a dedicated motor socket. Same
      // real config.yaml shape a Motor socket's own onboard_fixed rc_servo/
      // solenoid case produces (see axisMotorBlockFor()), just sourced from
      // this pin instead of a board-fixed connector; isRoleClaimedByOther()
      // already keeps this from colliding with a real Motor socket claiming
      // the same axis+slot.
      const [, type, letter, slot] = role.split(":");
      if (!AXES.includes(letter)) return;
      const axis = ensureAxis(cfg, letter);
      const block = axisMotorBlockFor(type, pin);
      annotate(axis, slot, p.label);
      axis[slot] = axis[slot] || {};
      axis[slot][block.key] = block.body;
      axis[slot].hard_limits = TBD;
    } else {
      // Every role prefix NOT already handled above (control/probe/
      // user_input/coolant/status_output/sdcard/ethernet/i2so today, per
      // SPECIAL_CASE_ROLE_PREFIXES' own comment) reduces to the exact
      // same shape: write a pin into cfg[<section>][<field>], then stub
      // any of that section's own non-pin tuning fields (probe's
      // check_mode_start/hard_stop/probe_hard_limit, coolant's delay_ms,
      // status_outputs' report_interval_ms, ethernet's phy_type/phy_addr/
      // frequency_hz -- reproducing its old hand-seeded stub exactly) via
      // stubNonPinFields() the moment the section first exists. field is
      // normally "<which>_pin", except probe's own bare "pin" field
      // (pinFieldForWhich() handles that one exception -- see its own
      // comment) -- so no per-section special-casing is needed here at
      // all. sdcard/ethernet/i2so's own board-fixed pins (cs_pin,
      // card_detect_pin, int_pin, rst_pin, oe_pin -- all PCB-design-time
      // facts, never Generic-Pin-assignable, see BOARD_FIXED_SECTIONS'
      // own comment) are handled entirely upstream, by
      // computeBoardFixedRoles() (permanently blacklists these roles so
      // they never reach here) and the fp.sdcard/fp.ethernet/fp.i2so
      // pre-fill blocks above (write whichever of them this board's own
      // data actually fixes to a real pin) -- this dispatch branch itself
      // needs no awareness of that distinction. A future
      // generically-scanned section (see buildGenericRoleBranches()) is
      // handled here automatically -- no new branch needed unless it
      // needs its own real behavior, in which case it earns a spot above
      // AND an entry in SPECIAL_CASE_ROLE_PREFIXES, same as these four.
      const [prefix, which] = role.split(":");
      const docSection = sectionForRolePrefix(prefix);
      const field = pinFieldForWhich(docSection, which);
      cfg[docSection] = cfg[docSection] || {};
      annotate(cfg[docSection], field, p.label);
      cfg[docSection][field] = pin;
      stubNonPinFields(cfg[docSection], docSection);
    }
  });
  if (Object.keys(cfg.control).length === 0) delete cfg.control;

  // RS485 channels -> Modbus VFD spindle: a known model's own top-level
  // key (H2A:, Huanyang:, ...) for a supported VFD, or the generic
  // ModbusVFD: key for a custom/unsupported one -- see rs485RoleOptions'
  // own comment for why the top-level KEY (not a model: field) is what
  // actually selects a named model's real protocol behavior -- plus a
  // separate uartN: block carrying the actual bus pins, same as how a
  // dedicated TMC UART bus becomes its own uart1: block elsewhere in this
  // file. uart_num is handed out by nextSpareUartNum()/spareUartCandidates(),
  // shared with the expansion-UART and I2C-as-UART sections below via
  // usedUartNums -- confirmed against real per-board wiki examples
  // (6x/Corgi's own Huanyang examples use uart1; the 4x wiki's
  // commented-out RS485 example, on a TMC-UART board, uses uart2).
  const usedUartNums = new Set(); // shared across RS485/expansion-UART/I2C-as-UART below
  // Module-resolved rs485_channel/expansion_uart connectors are merged in
  // alongside the board's own directly-wired entries so a module plugged
  // into an expansion socket (e.g. the RS485 Module or Simple Pendant
  // Module) participates in config generation exactly like a board-fixed
  // connector of the same kind. Field names (tx_pin/rx_pin/rts_pin/label,
  // txd_pin/rxd_pin/baud/mode) were deliberately matched between board
  // objects and resolveModuleSocketConnectors()'s output so the loop
  // bodies below need no branching on which kind of source they came from.
  const allRs485Channels = [
    ...(board.rs485_channels || []).map((ch, i) => ({ ch, key: resourceKeyRs485(i) })),
    ...allModuleSocketConnectors()
      .filter(x => x.connector.kind === "rs485_channel")
      .map(x => ({ ch: { ...x.connector, commentLabel: `${x.socket.label}/${x.moduleName}/${x.connector.label}` }, key: x.key })),
  ];
  const allExpansionUarts = [
    ...(board.expansion_uarts || []).map((ex, i) => ({ ex, key: resourceKeyExpUart(i) })),
    ...allModuleSocketConnectors()
      .filter(x => x.connector.kind === "expansion_uart")
      .map(x => ({ ex: { ...x.connector, commentLabel: `${x.socket.label}/${x.moduleName}/${x.connector.label}` }, key: x.key })),
  ];
  allRs485Channels.forEach(({ ch, key }) => {
    const role = bindings[key];
    if (!role || role === "unused" || !role.startsWith("vfd:")) return;
    const model = role.split(":")[1];
    const isCustom = model === VFD_CUSTOM;
    const n = nextSpareUartNum(board, usedUartNums);
    // uartN: (the dependency) is set before the VFD block (the referencer)
    // -- object key insertion order drives jsyaml.dump's output order, and
    // conventionally a bus block is declared before the thing that uses it.
    // Annotated on `cfg` itself, as a sibling immediately above uartN:/
    // topKey: (same indentation as those top-level keys) -- not inside
    // either block, where it could be misread as captioning just that
    // block's first field (txd_pin/uart_num) rather than the whole section.
    const uartBlock = { txd_pin: ch.tx_pin, rxd_pin: ch.rx_pin };
    if (ch.rts_pin) uartBlock.rts_pin = ch.rts_pin;
    // baud/mode: no fixed board fact for these (rs485_channel's own schema
    // has no such field -- the physical bus doesn't dictate a rate, it's a
    // property of whichever VFD gets wired up), so these can't come from
    // board.yaml the way expansion_uart's baud/mode do. Given a
    // "suggested" default via paramDefaultOverrides instead of the generic
    // uartN.baud "typical" tuning (115200, meant for a TMC UART chain) --
    // real-world Modbus VFD links overwhelmingly use 9600/8N1 regardless
    // of model (confirmed against FluidNC/data-wmb/gr3rodent.yaml's own
    // real YL620 example). Not model-specific (no per-VFD-model baud/mode
    // data exists anywhere in this wizard or in FluidNC's own VFD driver
    // source -- baud/mode are pure config.yaml matters, never compiled
    // into a VFD class), but close enough across every supported model to
    // be worth pre-filling. Per collectAndInjectSlots()'s general
    // override handling, this silently pre-fills the field (same as a
    // "board"/"firmware" default would) rather than leaving it a bare
    // TBD -- NOT merely offered via the "def" button and otherwise inert;
    // a config author who needs something else still edits it directly,
    // or clears it with the "✕" button, same as any other pre-filled
    // field, and defaultKind: "suggested" is what gives it the softer
    // "verify for your hardware" tooltip wording (see paramWidgetHtml())
    // rather than "board"'s "documented/corrected" framing.
    paramDefaultOverrides[`uart${n}.baud`] = { default: 9600, defaultKind: "suggested" };
    paramDefaultOverrides[`uart${n}.mode`] = { default: "8N1", defaultKind: "suggested" };
    uartBlock.baud = TBD;
    uartBlock.mode = TBD;
    const annotateLabel = ch.commentLabel || ch.label;
    annotate(cfg, `uart${n}`, annotateLabel);
    cfg[`uart${n}`] = uartBlock;
    // Top-level key IS the model name for a known/supported VFD (H2A:,
    // Huanyang:, ...), never the generic ModbusVFD: + model: form -- see
    // rs485RoleOptions' own comment for why that form alone can't select a
    // named model's real protocol behavior. ModbusVFD: is used only for a
    // genuinely custom/unsupported VFD.
    const topKey = isCustom ? "ModbusVFD" : model;
    annotate(cfg, topKey, annotateLabel);
    const body = { uart_num: n };
    if (isCustom) {
      // No compiled model to fall back on -- every protocol field (model,
      // cw_cmd, min_RPM, ...) is a real, required fact about this VFD's own
      // Modbus wiring, sourced from its own register documentation, not an
      // override of anything -- ModbusVFD's own field set already includes
      // them, same config_items.yaml-derived stub as every other spindle
      // type (fixes the bug that let atc/m6_macro/off_on_alarm/
      // s0_with_disable/disable_with_s0/spinup_ms/spindown_ms silently
      // never appear here -- only tool_num/speed_map were hand-listed
      // before).
      Object.assign(body, schemaStub("ModbusVFD", tuningFieldNames("ModbusVFD")));
    } else {
      // A known model's non-protocol fields only (see vfdProtocolFields()'s
      // own comment for why those 10 are excluded here) -- the model's own
      // compiled-in constructor already supplies correct, working values
      // for every one of them. modbus_id is NOT set explicitly here (unlike
      // uart_num, a genuine per-instance fact this loop already knows) --
      // it's a real @tuning typical, default 1 config_items.yaml item like
      // any other, so leaving it as a TBD stub lets the normal autofill
      // path (see collectAndInjectSlots()) pre-fill it with a real,
      // editable widget instead of a silent, unchangeable literal.
      const vfdProtocolFieldSet = new Set(vfdProtocolFields());
      const nonProtocolFields = new Set([...tuningFieldNames("ModbusVFD")].filter(f => !vfdProtocolFieldSet.has(f)));
      Object.assign(body, schemaStub("ModbusVFD", nonProtocolFields));
      // The whole group of protocol fields is hidden behind one "Override
      // VFD Protocol" selector by default (see vfdOverrideSentinel()'s own
      // comment) -- vfdOverrideEnabled just controls which widget renders
      // (collapsed trigger vs. the 10 real fields); a field left unanswered
      // even once expanded is still never written to config.yaml (see the
      // resolve-step near lastPlainYaml, below) -- only real, explicitly
      // given values are.
      body[vfdOverrideSentinel(topKey)] = vfdOverrideEnabled[topKey]
        ? Object.fromEntries(vfdProtocolFields().map(f => [f, TBD]))
        : null;
    }
    cfg[topKey] = body;
  });

  // Expansion UART connectors (e.g. Corgi's RJ12) -> a uart_channel role.
  // Fixed pins/baud/mode are board facts; report_interval_ms is the one
  // genuinely open tuning param (wiki's own examples use 75ms but nothing
  // suggests that's a hard requirement). No rts_pin/cts_pin board fact
  // exists for this connector type (see expansion_uart schema) -- both are
  // always written as literal NO_PIN, matching every real example seen.
  // Shares the same usedUartNums pool as RS485 above (and I2C-as-UART
  // below) -- gets its own DISTINCT uart_num when the board has two spare
  // UARTs free (see spareUartCandidates()), only colliding with another
  // section's uart_num in the genuine, unavoidable case where every spare
  // UART is already spoken for.
  allExpansionUarts.forEach(({ ex, key }) => {
    const role = bindings[key];
    if (!role || role === "unused" || role !== "uart_channel") return;
    const n = nextSpareUartNum(board, usedUartNums);
    // Same sibling-of-cfg annotation placement as RS485 above.
    const uartBlock = {
      txd_pin: ex.txd_pin,
      rxd_pin: ex.rxd_pin,
      rts_pin: "NO_PIN",
      cts_pin: "NO_PIN",
      baud: ex.baud,
      mode: ex.mode,
    };
    const annotateLabel = ex.commentLabel || ex.label;
    annotate(cfg, `uart${n}`, annotateLabel);
    cfg[`uart${n}`] = uartBlock;
    annotate(cfg, `uart_channel${n}`, annotateLabel);
    cfg[`uart_channel${n}`] = { report_interval_ms: TBD, uart_num: n };
  });

  // I2C connectors -> either a real i2c0: bus (e.g. the deprecated OLED
  // display, FluidNC's only I2C-consuming feature) or, since I2C pins are
  // often bare GPIOs, repurposed entirely as a generic expansion UART
  // (scl_pin -> txd_pin, sda_pin -> rxd_pin) -- same uart_channel shape as
  // an expansion_uart connector, since the far end is equally an external,
  // config-author-visible device rather than anything onboard. Unlike a
  // dedicated expansion_uart connector, this repurposed bus has no fixed
  // baud/mode board fact (I2C pins don't imply a specific UART protocol),
  // so those are left as open TBD params instead of copied from the board.
  (board.i2c_connectors || []).forEach((ic, i) => {
    const role = bindings[resourceKeyI2c(i)];
    if (!role || role === "unused") return;
    if (role === "i2c_bus") {
      annotate(cfg, "i2c0", ic.label);
      cfg.i2c0 = { sda_pin: ic.sda_pin, scl_pin: ic.scl_pin };
    } else if (role === "expansion_uart") {
      const n = nextSpareUartNum(board, usedUartNums); // same shared pool as RS485/expansion-UART above
      const uartBlock = {
        txd_pin: ic.scl_pin,
        rxd_pin: ic.sda_pin,
        rts_pin: "NO_PIN",
        cts_pin: "NO_PIN",
        baud: TBD,
        mode: TBD,
      };
      annotate(cfg, `uart${n}`, ic.label);
      cfg[`uart${n}`] = uartBlock;
      annotate(cfg, `uart_channel${n}`, ic.label);
      cfg[`uart_channel${n}`] = { report_interval_ms: TBD, uart_num: n };
    }
  });

  // Uncategorized top-level items -- confirmed against the connected
  // FluidNC source (MachineConfig.cpp:83-89, MachineConfig::group()'s tail
  // end, after every named handler.section(...) call): 7 loose fields set
  // directly on MachineConfig itself, not part of any named sub-section
  // (Start/Kinematics/etc.), and not tied to any board resource -- so, like
  // Start/Kinematics, no annotate() comment either. Placed last in the
  // generated file since they're genuinely uncategorized. All 7 are
  // @tuning typical in source, so configDocSpecFor() pre-populates them
  // from config_items.yaml automatically -- editable inline, not left as
  // open TBDs.
  cfg.arc_tolerance_mm = TBD;
  cfg.junction_deviation_mm = TBD;
  cfg.verbose_errors = TBD;
  cfg.report_inches = TBD;
  cfg.enable_parking_override_control = TBD;
  cfg.use_line_numbers = TBD;
  cfg.planner_blocks = TBD;

  // Optional top-level sections with no board-resource correlation
  // (Parking/Macros/OLED/ATC Manual) -- see OPTIONAL_SECTIONS' own
  // declaration comment. Planted last, after every other cfg.* assignment
  // above, so they land at the END of the emitted file (js-yaml dumps
  // object keys in insertion order) rather than in the middle of the
  // board-derived sections. Sentinel is planted as its own KEY regardless
  // of enabled state, same "selector lives inside the draft itself"
  // pattern as kinematics/homing; when disabled the resolved clone deletes
  // the key entirely below, rather than emitting an empty block.
  Object.keys(OPTIONAL_SECTIONS).forEach(key => {
    cfg[sectionSentinel(key)] = sectionEnabled[key] ? OPTIONAL_SECTIONS[key].stub() : null;
  });

  // Spindle tool_num: suggest the next tool number not already assigned to
  // another spindle section in THIS config, rather than always 0 -- a
  // config with more than one spindle-like section (Pwm/Laser/.../
  // ModbusVFD are all direct top-level keys, each with its own tool_num
  // child; never nested deeper) would otherwise have every one of them
  // suggest the same "0". Two passes: first collect tool numbers already
  // ANSWERED (a real committed value in paramValues, not just the cfg-level
  // TBD sentinel every unanswered field always shows regardless -- cfg
  // itself never carries the user's actual answer, only paramValues does,
  // see collectAndInjectSlots), then walk the still-open ones in cfg's own
  // key order (== bind order) assigning each the lowest number not yet
  // used -- adding its own suggestion to the used set before moving to the
  // next, so several still-open spindles suggest distinct numbers too, not
  // just distinct from already-answered ones.
  {
    const usedToolNums = new Set();
    Object.keys(cfg).forEach(k => {
      const v = cfg[k];
      if (!v || typeof v !== "object" || v.tool_num !== TBD) return;
      const val = paramValues[`${k}.tool_num`];
      if (typeof val === "number") usedToolNums.add(val);
    });
    Object.keys(cfg).forEach(k => {
      const v = cfg[k];
      if (!v || typeof v !== "object" || v.tool_num !== TBD) return;
      const path = `${k}.tool_num`;
      if (Object.prototype.hasOwnProperty.call(paramValues, path)) return; // already answered -- no suggestion needed
      let n = 0;
      while (usedToolNums.has(n)) n++;
      usedToolNums.add(n);
      paramDefaultOverrides[path] = { default: n, defaultKind: "suggested" };
    });
  }

  // Work on a clone for the interactive view: it gets its pin leaves
  // overwritten with a "PINSLOT" sentinel (so we can splice in attribute
  // widgets at those positions) while every TBD slot is left untouched
  // and simply collected, exactly as before. `cfg` itself stays pristine.
  const liveCfg = JSON.parse(JSON.stringify(cfg));
  const paramSlots = [];
  const pinSlots = [];
  const keySlots = [];
  collectAndInjectSlots(liveCfg, "", paramSlots, pinSlots, paramDefaultOverrides, keySlots);

  let yamlText = dequoteAxisKeys(annotateYaml(jsyaml.dump(liveCfg, { lineWidth: -1, noRefs: true })));
  const failedImportText = importFailedItems.length ? formatFailedImports(importFailedItems) : "";
  const unresolved = paramSlots.filter(s => !Object.prototype.hasOwnProperty.call(paramValues, s.path)).length;

  // Tool-number uniqueness check: recomputed live every render (same
  // "recompute from current state on every pass" approach the GPIO-conflict
  // pass uses, just applied to a free-text field instead of a pin picker --
  // the user can type any number into any spindle's tool_num at any time,
  // so this can never be a one-time/at-creation-only check). Groups every
  // ANSWERED tool_num slot by its current value; any group with more than
  // one member is a conflict. toolNumConflicts (module-level, read by
  // paramWidgetHtml() above) becomes the flat set of paths to flag; the
  // note below lists the actual duplicated numbers and which sections share
  // each one.
  const toolNumByValue = new Map(); // value -> [sectionKey, ...]
  paramSlots.forEach(slot => {
    if (slot.key !== "tool_num" || !Object.prototype.hasOwnProperty.call(paramValues, slot.path)) return;
    const val = paramValues[slot.path];
    if (!toolNumByValue.has(val)) toolNumByValue.set(val, []);
    toolNumByValue.get(val).push(slot.path.slice(0, -".tool_num".length));
  });
  toolNumConflicts = new Set();
  const toolNumConflictGroups = [];
  toolNumByValue.forEach((sections, val) => {
    if (sections.length < 2) return;
    toolNumConflictGroups.push([val, sections]);
    sections.forEach(sectionKey => toolNumConflicts.add(`${sectionKey}.tool_num`));
  });
  const toolNumConflictNote = document.getElementById("toolNumConflictNote");
  if (toolNumConflictGroups.length) {
    toolNumConflictNote.innerHTML = "Duplicate spindle tool number" + (toolNumConflictGroups.length > 1 ? "s" : "") + ": " +
      toolNumConflictGroups.map(([val, sections]) => `<b>${escapeHtml(String(val))}</b> used by ${sections.map(escapeHtml).join(" and ")}`).join("; ") +
      " -- FluidNC requires each spindle's tool number to be unique.";
    toolNumConflictNote.style.display = "";
  } else {
    toolNumConflictNote.style.display = "none";
  }

  document.getElementById("summary").innerHTML = `
    <div class="stat done"><b>${Object.values(bindings).filter(v=>v&&v!=="unused").length}</b>bound resources</div>
    <div class="stat"><b>${countResources()}</b>total resources</div>
    <div class="stat tbd"><b>${unresolved}</b>TBDs</div>
    ${importFailedItems.length ? `<div class="stat tbd"><b>${importFailedItems.length}</b> import error${importFailedItems.length === 1 ? "" : "s"}</div>` : ""}
  `;

  const failedDiv = document.getElementById("failedImportComments");
  if (failedImportText) {
    failedDiv.style.display = "block";
    failedDiv.innerHTML = failedImportText;
  } else {
    failedDiv.style.display = "none";
    failedDiv.innerHTML = "";
  }

  document.getElementById("draft").innerHTML = buildInteractiveYaml(yamlText, paramSlots, pinSlots, keySlots);
  document.querySelectorAll("#draft .inline-field").forEach(el => {
    el.onchange = () => setParam(el.dataset.path, el.dataset.key, el.value);
  });
  document.querySelectorAll("#draft .default-btn").forEach(btn => {
    btn.onclick = () => setParamDefault(btn.dataset.path, btn.dataset.key, btn.dataset.default);
  });
  document.querySelectorAll("#draft .clear-btn").forEach(btn => {
    btn.onclick = () => setParam(btn.dataset.path, btn.dataset.key, "");
  });
  document.querySelectorAll("#draft .attr-field").forEach(el => {
    el.onchange = () => setPinAttr(el.dataset.path, el.dataset.attr, el.value);
  });
  document.querySelectorAll("#draft .kin-select").forEach(el => {
    el.onchange = () => { kinematicsType = el.value; generateDraft(); };
  });
  document.querySelectorAll("#draft .homing-select").forEach(el => {
    el.onchange = () => { homingEnabled[el.dataset.letter] = el.value === "true"; generateDraft(); };
  });
  document.querySelectorAll("#draft .section-select").forEach(el => {
    el.onchange = () => { sectionEnabled[el.dataset.section] = el.value === "true"; generateDraft(); };
  });
  document.querySelectorAll("#draft .vfd-override-select").forEach(el => {
    el.onchange = () => { vfdOverrideEnabled[el.dataset.topkey] = el.value === "true"; generateDraft(); };
  });

  // Plain-text version (real values where answered, literal TBD where not,
  // pin attributes appended where set) for Copy/Download -- the <pre>
  // itself now holds live form widgets, so its textContent isn't usable.
  const resolved = JSON.parse(JSON.stringify(cfg));
  function setAtPath(path, value) {
    const segs = path.split(".");
    let node = resolved;
    for (let i = 0; i < segs.length - 1; i++) node = node[segs[i]];
    node[segs[segs.length - 1]] = value;
  }
  paramSlots.forEach(({ path }) => {
    if (Object.prototype.hasOwnProperty.call(paramValues, path)) setAtPath(path, paramValues[path]);
  });
  pinSlots.forEach(({ path, basePin }) => {
    const attrs = pinAttrs[path];
    if (!attrs) return;
    const suffix = (attrs.level ? `:${attrs.level}` : "") + (attrs.pull ? `:${attrs.pull}` : "");
    if (suffix) setAtPath(path, basePin + suffix);
  });
  // Undo the KINSELECT sentinel now that every subordinate-field path
  // referencing it (e.g. "kinematics.KINSELECT.crank_mm") has already been
  // resolved above -- cfg.kinematics's real key is always the selected
  // system's actual cfgKey (Cartesian/CoreXY/etc.), never the literal
  // sentinel text itself.
  if (resolved.kinematics && Object.prototype.hasOwnProperty.call(resolved.kinematics, "KINSELECT")) {
    resolved.kinematics = { [kt.cfgKey]: resolved.kinematics.KINSELECT };
  }
  // homing: is genuinely optional -- `cfg`/`resolved` never carry a real
  // "homing" key for a disabled axis at all, only the HOMINGSELECT_<letter>
  // sentinel key (see ensureAxis()/homingSentinel()). Rename that sentinel
  // to the real "homing" key when enabled (keeping its TBD-resolved
  // fields); delete it outright when disabled, so config.yaml genuinely
  // has no homing: section for that axis -- not an empty one, not a
  // placeholder.
  Object.keys(resolved.axes || {}).forEach(letter => {
    const ax = resolved.axes[letter];
    if (!ax || typeof ax !== "object") return;
    const sentinelKey = homingSentinel(letter);
    if (!Object.prototype.hasOwnProperty.call(ax, sentinelKey)) return;
    if (homingEnabled[letter]) ax.homing = ax[sentinelKey];
    delete ax[sentinelKey];
  });
  // Same rename-or-delete idea one level up, for the optional top-level
  // sections themselves (Parking/Macros/OLED/ATC Manual) -- see
  // OPTIONAL_SECTIONS' own declaration comment.
  Object.keys(OPTIONAL_SECTIONS).forEach(key => {
    const sentinelKey = sectionSentinel(key);
    if (!Object.prototype.hasOwnProperty.call(resolved, sentinelKey)) return;
    if (sectionEnabled[key]) resolved[key] = resolved[sentinelKey];
    delete resolved[sentinelKey];
  });
  // Same rename-or-delete idea once more, one level deeper still (inside a
  // known VFD model's own block rather than at cfg's top level): hoist
  // vfdOverrideSentinel(m)'s children up to be direct siblings of
  // tool_num/uart_num/etc. (matching where they'd actually live in a real
  // config.yaml -- see generateDraft()'s isCustom branch, which puts them
  // there directly for a custom VFD), or drop the whole group if it was
  // never enabled. Unlike homing/OPTIONAL_SECTIONS, a field is hoisted only
  // if it was actually answered (paramSlots.forEach already applied any
  // real answer above) -- one left as a still-unanswered literal TBD is
  // simply never hoisted at all, so an expanded-but-partially-filled group
  // still only ever writes the fields the user actually gave a value to.
  // Only VFD_MODELS' own top-level keys carry this mechanism -- ModbusVFD:
  // (the custom/unsupported case) has no compiled default to fall back on,
  // so its protocol fields are plain required TBDs with no group sentinel
  // of their own, untouched here.
  VFD_MODELS.forEach(m => {
    const block = resolved[m];
    if (!block || typeof block !== "object") return;
    const sentinelKey = vfdOverrideSentinel(m);
    if (!Object.prototype.hasOwnProperty.call(block, sentinelKey)) return;
    const group = block[sentinelKey];
    delete block[sentinelKey];
    if (group && typeof group === "object") {
      Object.keys(group).forEach(f => {
        if (group[f] !== TBD) block[f] = group[f];
      });
    }
  });
  lastPlainYaml = dequoteAxisKeys(annotateYaml(jsyaml.dump(resolved, { lineWidth: -1, noRefs: true })));
  // Keep the hotspot photo's assigned/unassigned colors and tooltips in
  // sync with whatever just changed -- generateDraft() runs on every
  // binding edit, so this stays live rather than only reflecting board-load
  // time. No-op (returns immediately) for boards with no hotspot data.
  refreshHotspotStates();
  // Same idea for GPIO-conflict disabling: recompute on every binding
  // change so assigning (or un-assigning) a resource immediately
  // disables/re-enables anything else sharing one of its physical pins.
  refreshGpioConflicts();
  // Same idea for role-uniqueness graying: recompute on every binding
  // change so claiming (or un-claiming) a role immediately disables/
  // re-enables that same option everywhere else it appears.
  refreshRoleUniqueness();
}

/* ---------------------------------------------------------------------
 * Import an existing config.yaml -- the reverse of generateDraft() above:
 * instead of walking bindings -> cfg, this walks a loaded cfg -> bindings
 * (plus paramValues for real values found, instead of leaving them TBD).
 * The loaded file's own `board:` field is checked against every known
 * board_id/board.name (see detectBoardId(), called from the file-input
 * handler below) and, on an exact case-insensitive match, the picker
 * auto-switches to it before importing -- covers the common case of a file
 * this tool itself produced (which always writes the board's real name into
 * `board:`), or a hand-written config using the id directly. When there's
 * no match (a free-text label, a board this tool doesn't know, or the field
 * is simply absent), the currently-selected board is used as-is and the
 * report notes that explicitly, so the user knows to double-check it.
 *
 * Per-field pin ATTRIBUTES (:low/:high/:pu/:pd suffixes) ARE re-imported
 * into pinAttrs, at the same param path collectAndInjectSlots will assign
 * once the draft is regenerated -- for motor-socket pins specifically, only
 * when the loaded driver type matches what this board's own socket data
 * implies (motorBlockFor() is board-derived, not a user choice, so a
 * mismatched driver type means the real eventual path is unknown; see the
 * "notes" entry generated in that case). Fixed-protocol pins (uartN:/i2c0:
 * -- see isFixedProtocolPath()) never carry attributes in the first place,
 * so none are attempted for those.
 *
 * Ambiguous pin ownership (a board's own documented dual-purpose pin, e.g.
 * Corgi's shared MOSFET/5V-out) is resolved via the "# <label>" comment
 * this tool's own exports write immediately above the pin (or above a
 * wrapping block that contains it, e.g. "# RS485" above "uart1:") -- see
 * buildPinLabelHints(). When exactly one candidate resource's own label
 * matches that comment, it's used with confidence; otherwise (no comment,
 * or the comment doesn't uniquely match) this falls back to picking the
 * first candidate and reporting the ambiguity, since there's no other
 * signal available -- expected for hand-written configs, which have no
 * reason to carry this tool's specific comment convention.
 *
 * Still deliberately out of scope for now: a config.yaml with more than one
 * RS485/VFD block is only partly recognized -- the first one found (by
 * VFD_MODELS order, then plain ModbusVFD:) is imported, any others are
 * silently ignored, same single-block limitation this import block has
 * always had.
 * ------------------------------------------------------------------- */

// resourceKeyRs485/resourceKeyExpUart/resourceKeyI2c all return distinctly
// prefixed strings ("rs485:", "expuart:", "i2c:") -- used below to tell
// which kind of resource a matched uart-bus pin actually belongs to, since
// the correct role STRING differs by resource type even though the pin
// lookup itself is generic.
function resourceKeyPrefix(key) { return key.split(":")[0]; }

function parsePinString(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s || s === "NO_PIN") return null;
  const parts = s.split(":");
  const basePin = parts[0].toLowerCase();
  let level = "", pull = "";
  parts.slice(1).forEach(a => {
    const token = a.toLowerCase();
    if (token === "low" || token === "high") level = token;
    else if (token === "pu" || token === "pd") pull = token;
  });
  return { basePin, level, pull };
}

function buildPinOwnerIndex() {
  const idx = {};
  Object.keys(resourcePins).forEach(key => {
    (resourcePins[key] || []).forEach(pin => {
      if (!pin) return;
      const normalized = String(pin).toLowerCase();
      idx[normalized] = idx[normalized] || [];
      if (!idx[normalized].includes(key)) idx[normalized].push(key);
    });
  });
  return idx;
}

function recordFailedImport(path, value, message) {
  importFailedItems.push({ path, value, message });
}

/* Scrapes "# <label>" comments out of the RAW config.yaml text (jsyaml.load
 * discards comments entirely, so this is a separate line-based pass over
 * the original file text) and maps each pin VALUE found to the label of
 * its nearest enclosing/preceding comment -- i.e. exactly the inverse of
 * generateDraft()'s own annotate()/annotateYaml() mechanism, which writes
 * a resource's board label as a "# <label>" comment immediately above
 * either the pin's own key (e.g. "# In2" above "limit_neg_pin: gpio.2") OR
 * above a wrapping block key that CONTAINS the pin (e.g. "# RS485" above
 * "uart1:", which contains "txd_pin: gpio.15" one level deeper) -- so this
 * scanner tracks a small indent-keyed stack of "nearest active comment",
 * not just the immediately preceding line, to catch both shapes.
 *
 * Only useful for files this tool (or something matching its comment
 * convention) produced -- a hand-written or differently-annotated
 * config.yaml simply won't match anything here, and importConfig() falls
 * back to its existing ambiguous-pin reporting in that case, per the
 * explicit direction that "if there is no such comment, there is still an
 * ambiguity." */
function buildPinLabelHints(rawText) {
  const hints = {}; // pin base value (e.g. "gpio.2") -> label
  const lines = String(rawText || "").split(/\r\n|\n|\r/);
  const commentRe = /^(\s*)#\s?(.*)$/;
  const kvRe = /^(\s*)[A-Za-z0-9_]+:\s*(.*?)\s*$/;
  const stack = []; // [{ indent, label }], nearest-enclosing comment per indent level
  let pendingComment = null; // { indent, label } for the line directly below a comment
  lines.forEach(line => {
    const cm = line.match(commentRe);
    if (cm) {
      pendingComment = { indent: cm[1].length, label: cm[2] };
      return;
    }
    const kv = line.match(kvRe);
    if (!kv) { pendingComment = null; return; }
    const indent = kv[1].length;
    const rawValue = kv[2];
    while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
    let activeLabel = stack.length ? stack[stack.length - 1].label : null;
    if (pendingComment && pendingComment.indent === indent) {
      activeLabel = pendingComment.label;
      stack.push({ indent, label: pendingComment.label });
    }
    if (/^(gpio\.\d+|i2so\.\d+)$/.test(rawValue) && activeLabel) {
      hints[rawValue] = activeLabel;
    }
    pendingComment = null;
  });
  return hints;
}

/* Core of the importer: given a raw config.yaml document (already parsed
 * via jsyaml.load) and the ORIGINAL raw text (for comment-based pin
 * disambiguation, see buildPinLabelHints() above), populate
 * bindings/paramValues/pinAttrs/homingEnabled/kinematicsType and return a
 * { matched, ambiguous, unrecognized, notes } report for display. Resets
 * all import-relevant state first, same as loadBoard() does for a fresh
 * board load. */
function importConfig(doc, rawText) {
  bindings = {};
  paramValues = {};
  pinAttrs = {};
  homingEnabled = {};
  kinematicsType = "Cartesian";
  sectionEnabled = {};
  vfdOverrideEnabled = {};
  importFailedItems = [];

  const report = { matched: [], ambiguous: [], unrecognized: [], notes: [] };
  computeResourcePins();
  let pinOwnerIndex = buildPinOwnerIndex();
  const pinLabelHints = buildPinLabelHints(rawText);

  function isPendantModule(mod) {
    if (!mod) return false;
    const hasPendantConnector = Array.isArray(mod.expansion_uarts) || Array.isArray(mod.rs485_channels);
    if (!hasPendantConnector) return false;
    const candidateLabels = [];
    (mod.expansion_uarts || []).forEach(c => candidateLabels.push(String(c.generic_name || c.label || "").toLowerCase()));
    (mod.rs485_channels || []).forEach(c => candidateLabels.push(String(c.generic_name || c.label || "").toLowerCase()));
    return candidateLabels.some(label => label.includes("pendant"));
  }

  function inferPendantModuleSocket(txdPin, rxdPin, kind = "expansion_uart") {
    if (!board.expansion_sockets) return null;
    const candidates = [];
    Object.keys(MODULE_CATALOG).sort().forEach(moduleId => {
      const mod = MODULE_CATALOG[moduleId];
      if (kind === "expansion_uart" && !isPendantModule(mod)) return;
      if (kind === "rs485_channel" && !Array.isArray(mod.rs485_channels)) return;
      board.expansion_sockets.forEach((socket, si) => {
        if (!moduleFitsSocket(mod, socket)) return;
        const connectors = resolveModuleSocketConnectors(socket, moduleId);
        (connectors || []).forEach((c, ci) => {
          if (c.kind !== kind) return;
          const tx = c.kind === "rs485_channel" ? c.tx_pin : c.txd_pin;
          const rx = c.kind === "rs485_channel" ? c.rx_pin : c.rxd_pin;
          if (tx === txdPin && rx === rxdPin) {
            candidates.push({ si, moduleId, ci, connector: c });
          }
        });
      });
    });
    if (!candidates.length) return null;
    const preferred = candidates.find(c => c.moduleId === "pendant") || candidates.find(c => c.moduleId === "isolated_pendant");
    return preferred || candidates[0];
  }

  function normalizeHintLabel(label) {
    return String(label || "")
      .trim()
      .toLowerCase()
      .replace(/\s*\/\s*/g, "/")
      .replace(/\s+/g, " ");
  }

  function inferModuleSocketFromHint(label, pinRaw) {
    if (!board.expansion_sockets) return null;
    const parsed = parsePinString(pinRaw);
    if (!parsed) return null;
    const normalizedHint = normalizeHintLabel(label);
    const candidates = [];
    Object.keys(MODULE_CATALOG).sort().forEach(moduleId => {
      const mod = MODULE_CATALOG[moduleId];
      if (!mod) return;
      board.expansion_sockets.forEach((socket, si) => {
        if (!moduleFitsSocket(mod, socket)) return;
        const connectors = resolveModuleSocketConnectors(socket, moduleId);
        (connectors || []).forEach((c, ci) => {
          const moduleName = MODULE_CATALOG[moduleId].module.name;
          const candidateLabel = `${socket.label}/${moduleName}/${c.label}`;
          const normalizedCandidateLabel = normalizeHintLabel(candidateLabel);
          const connectorPins = c.kind === "generic_pin"
            ? [c.mcu_pin]
            : c.kind === "expansion_uart"
              ? [c.txd_pin, c.rxd_pin]
              : [c.tx_pin, c.rx_pin, c.rts_pin].filter(Boolean);
          const pinMatches = connectorPins.includes(parsed.basePin);
          const labelMatches = normalizedCandidateLabel === normalizedHint || normalizedCandidateLabel.endsWith(normalizedHint) || normalizedHint.endsWith(normalizedCandidateLabel);
          if (pinMatches && labelMatches) {
            candidates.push({ si, moduleId, ci, connector: c });
          }
        });
      });
    });
    if (!candidates.length) return null;
    return candidates[0];
  }

  function resolvePin(pinRaw, ctxLabel, allowedPrefixes, suppressFailure) {
    const parsed = parsePinString(pinRaw);
    if (!parsed) return null;
    let candidates = pinOwnerIndex[parsed.basePin] || [];
    if (!candidates.length) {
      const hint = pinLabelHints[parsed.basePin];
      if (hint) {
        const inferred = inferModuleSocketFromHint(hint, pinRaw);
        if (inferred) {
          bindings[resourceKeyModuleSocket(inferred.si)] = inferred.moduleId;
          computeResourcePins();
          pinOwnerIndex = buildPinOwnerIndex();
          candidates = pinOwnerIndex[parsed.basePin] || [];
          report.notes.push(`${ctxLabel}: inferred module "${inferred.moduleId}" via module socket ${inferred.si} from label "${hint}"`);
        }
      }
    }
    if (!candidates.length) {
      if (!suppressFailure) {
        const message = `pin ${parsed.basePin} not found on ${board.board.id}`;
        report.unrecognized.push(`${ctxLabel}: ${message}`);
        recordFailedImport(ctxLabel, pinRaw, message);
      }
      return null;
    }
    let effectiveCandidates = candidates;
    if (allowedPrefixes && allowedPrefixes.length) {
      const filtered = candidates.filter(k => allowedPrefixes.includes(resourceKeyPrefix(k)));
      if (filtered.length === 1) {
        const resolvedKey = filtered[0];
        if (resourceKeyPrefix(resolvedKey) === "modconn") {
          report.notes.push(`${ctxLabel}: pin ${parsed.basePin} was resolved to ${resolvedKey} by required resource type ${allowedPrefixes.join(" or ")}`);
        }
        return { resourceKey: resolvedKey, parsed };
      }
      if (filtered.length > 1) {
        effectiveCandidates = filtered;
      } else {
        if (!suppressFailure) {
          const message = `pin ${parsed.basePin} matches ${candidates.length} resources (${candidates.join(", ")}), but none are ${allowedPrefixes.join(" or ")}`;
          report.ambiguous.push(`${ctxLabel}: ${message}`);
          recordFailedImport(ctxLabel, pinRaw, message);
        }
        return null;
      }
    }
    if (effectiveCandidates.length > 1) {
      const hint = pinLabelHints[parsed.basePin];
      const hintMatches = hint ? effectiveCandidates.filter(k => resourceLabels[k] === hint) : [];
      if (hintMatches.length === 1) {
        report.notes.push(`${ctxLabel}: pin ${parsed.basePin} was ambiguous (${effectiveCandidates.length} candidates) but resolved via the "# ${hint}" comment -> ${hintMatches[0]}`);
        return { resourceKey: hintMatches[0], parsed };
      }
      report.ambiguous.push(
        hint
          ? `${ctxLabel}: pin ${parsed.basePin} matches ${effectiveCandidates.length} resources (${effectiveCandidates.join(", ")}); comment says "${hint}" but that doesn't uniquely match any of them -- used ${effectiveCandidates[0]}, verify and re-bind manually if wrong`
          : `${ctxLabel}: pin ${parsed.basePin} matches ${effectiveCandidates.length} resources (${effectiveCandidates.join(", ")}), and no disambiguating comment was found -- used ${effectiveCandidates[0]}, verify and re-bind manually if wrong`
      );
    }
    return { resourceKey: effectiveCandidates[0], parsed };
  }

  function bind(resourceKey, role, ctxLabel) {
    if (bindings[resourceKey] && bindings[resourceKey] !== "unused" && bindings[resourceKey] !== role) {
      report.ambiguous.push(`${ctxLabel}: resource ${resourceKey} was already bound to "${bindings[resourceKey]}" by an earlier field -- overwritten with "${role}"`);
    }
    bindings[resourceKey] = role;
    report.matched.push(`${ctxLabel} -> ${resourceKey} (${role})`);
  }

  // attrPath: the exact param path pinAttrs should be keyed under for this
  // pin (matching what collectAndInjectSlots will build once the draft is
  // regenerated from the new bindings) -- defaults to ctxLabel, which
  // already IS that path for every call site except the motor-socket one
  // (see below), which passes its own more specific path explicitly.
  function claimPin(pinRaw, role, ctxLabel, attrPath, allowedPrefixes, suppressFailure) {
    const r = resolvePin(pinRaw, ctxLabel, allowedPrefixes, suppressFailure);
    if (!r) return null;
    bind(r.resourceKey, role, ctxLabel);
    const path = attrPath !== undefined ? attrPath : ctxLabel;
    if (path && (r.parsed.level || r.parsed.pull)) {
      pinAttrs[path] = { level: r.parsed.level, pull: r.parsed.pull };
    }
    return r.resourceKey;
  }

  // blocks (motor driver bodies, spindle stubs, homing, kinematics, etc.)
  // where the field NAMES are already known to line up with what
  // specForKey()/collectAndInjectSlots expect, since they're the real
  // config.yaml field names either way. Skipping literal TBD values
  // matters for files that are themselves a previous half-finished export
  // from this tool -- copying the literal string TBD into paramValues
  // would make collectAndInjectSlots' `hasOwnProperty(paramValues, path)`
  // check see it as "answered" (rendered green/filled) even though its
  // content is the same unresolved placeholder, rather than leaving it as
  // a genuinely open (yellow) TBD slot.
  function copyScalarParams(src, pathPrefix, skipKeys) {
    if (!src || typeof src !== "object") return;
    Object.keys(src).forEach(k => {
      if (skipKeys && skipKeys.has(k)) return;
      const v = src[k];
      if (v === null || typeof v === "object" || v === TBD) return;
      paramValues[`${pathPrefix}.${k}`] = v;
    });
  }

  // --- axes: motor sockets, limit pins, axis-level tuning, homing ---
  // Derived from config_items.yaml's own section names
  // (axes.<letter>.motorN.<driverKey>) rather than hand-listed -- needed two
  // upstream fixes first (see build_config_docs.py's SECTIONS table):
  // null_motor used to render as a comment only (zero real fields -> no real
  // YAML key at all), and tmc_2160/tmc_2160Pro had no section of their own
  // (registration aliases of tmc_5160/tmc_5160Pro respectively -- note the
  // PREVIOUS version of that SECTIONS entry's own note incorrectly claimed
  // tmc_2160 was ALSO a raw-register tmc_5160Pro alias; confirmed against
  // the real registration() calls that it aliases the ordinary tmc_5160
  // instead -- see that entry's corrected note).
  const MOTOR_SECTION_PREFIX = "axes.<letter>.motorN.";
  // The shared/common per-motor section (limit_neg_pin/limit_pos_pin/
  // limit_all_pin/hard_limits/pulloff_mm) -- a sibling of, not one of, the
  // per-driver-type sections MOTOR_SECTION_PREFIX matches (note: no
  // trailing dot).
  const MOTOR_COMMON_SECTION = "axes.<letter>.motorN";
  const motorDriverKeys = new Set(
    Object.keys(CONFIG_ITEM_DOCS)
      .filter(section => section.startsWith(MOTOR_SECTION_PREFIX))
      .map(section => section.slice(MOTOR_SECTION_PREFIX.length))
  );
  // homing_runs -- a top-level axes: scalar (see generateDraft()'s own
  // comment), sibling to shared_stepper_disable_pin/reset_pin, NOT an
  // axis letter -- captured here, before the per-axis forEach below (which
  // would otherwise misidentify it as an unrecognized "axis letter" and
  // report a spurious warning, the same reason shared_stepper_disable_pin
  // is skipped just below).
  if (doc.axes && doc.axes.homing_runs != null && doc.axes.homing_runs !== TBD) {
    paramValues["axes.homing_runs"] = doc.axes.homing_runs;
  }
  // Non-letter siblings of x/y/z/a/b/c under axes: -- derived from
  // config_items.yaml's own "axes" section (Group-level keys, siblings of
  // the axis letters -- see build_config_docs.py's SECTIONS table) instead
  // of a hand-listed 3-name exclude set, so a future field added there
  // (e.g. a new shared_* pin) is automatically recognized as a legitimate
  // non-letter key rather than needing this list updated too or falling
  // through to a spurious "not a recognized axis letter" warning below.
  const axisSiblingKeys = new Set(Object.keys(CONFIG_ITEM_DOCS.axes || {}));
  Object.keys(doc.axes || {}).forEach(letter => {
    if (axisSiblingKeys.has(letter)) return;
    const axisDoc = doc.axes[letter];
    if (!axisDoc || typeof axisDoc !== "object") return;
    if (!AXES.includes(letter)) {
      report.unrecognized.push(`axes.${letter}: not a recognized axis letter, skipped`);
      return;
    }

    ["motor0", "motor1"].forEach(slot => {
      const motorDoc = axisDoc[slot];
      if (!motorDoc || typeof motorDoc !== "object") return;
      const driverKey = Object.keys(motorDoc).find(k => motorDriverKeys.has(k));
      const driverBody = driverKey ? motorDoc[driverKey] : null;
      // This driver type's own pin fields (step_pin/direction_pin/cs_pin/
      // ms1_pin/.../output_pin, whichever ones it actually has), derived
      // from its own config_items.yaml section instead of a hand-listed
      // union across every driver type -- rc_servo/solenoid's output_pin
      // is included the same way as any other type's pins here (it can
      // still resolve to EITHER a dedicated Motor socket or an ordinary
      // output-capable Generic pin/module connector, same as before -- see
      // below).
      const driverSection = driverKey ? CONFIG_ITEM_DOCS[MOTOR_SECTION_PREFIX + driverKey] : null;
      const motorPinFields = driverSection
        ? Object.keys(driverSection).filter(k => isPinType(MOTOR_SECTION_PREFIX + driverKey, k))
        : [];

      // Identify the physical resource via any one of its own pins
      // (step_pin preferred for driver-socket types) -- all of a socket's
      // pins share one resourceKey, so matching just one suffices. For
      // rc_servo/solenoid specifically, the resolved resourceKey can be
      // either a Motor socket (resourceKeyMotor) or a plain output pin/
      // module connector (resourceKeyPin/resourceKeyModConn) wearing the
      // "Axis -- RC Servo/Solenoid" role added for that case -- same real
      // config.yaml shape, different resource kind, so which ROLE string
      // to bind (and whether a board-derived "expected driver type" check
      // even applies) depends on which kind resolvePin() actually found.
      let resourceKey = null;
      if (driverBody) {
        const pinField = motorPinFields.find(f => driverBody[f]);
        if (pinField) {
          const r = resolvePin(driverBody[pinField], `axes.${letter}.${slot}`);
          if (r) resourceKey = r.resourceKey;
        }
      }
      if (!resourceKey) {
        const message = "no recognizable motor pin found";
        report.unrecognized.push(`axes.${letter}.${slot}: ${message}, skipped`);
        recordFailedImport(`axes.${letter}.${slot}`, motorDoc, message);
        return;
      }

      const isMotorSocket = resourceKeyPrefix(resourceKey) === "motor";
      // Whether this driver type genuinely needs a dedicated motor socket's
      // own STEP/DIR/UART/SPI pins, inferred from whether it HAS a
      // step_pin field at all in its own config_items.yaml section --
      // rc_servo/solenoid/dynamixel2 are the only types that don't (each a
      // single-PWM-pin or UART-bus virtual axis, no STEP/DIR wiring).
      // Replaces a hardcoded 2-name exemption (rc_servo/solenoid only) that
      // had actually missed dynamixel2 -- confirmed against its own real
      // motor_dynamixel2 schema $def (no step_pin there either) -- meaning
      // a loaded config with a Dynamixel2 axis motor was silently rejected
      // by this check before this fix.
      const needsDedicatedSocket = isPinType(MOTOR_SECTION_PREFIX + driverKey, "step_pin");
      if (!isMotorSocket && needsDedicatedSocket) {
        // Every OTHER driver type needs a dedicated motor socket's own
        // STEP/DIR/UART/SPI pins, which only a "motor" resourceKey can
        // provide -- resolving to anything else here means this pin
        // doesn't actually belong to a motor socket on this board at all.
        const message = `driver type "${driverKey}" needs a dedicated motor socket, but its pin resolved to ${resourceKey} (not one)`;
        report.unrecognized.push(`axes.${letter}.${slot}: ${message}, skipped`);
        recordFailedImport(`axes.${letter}.${slot}`, motorDoc, message);
        return;
      }
      const role = isMotorSocket ? `${letter}:${slot}` : `axis:${driverKey}:${letter}:${slot}`;
      bind(resourceKey, role, `axes.${letter}.${slot}`);

      // Tuning params only copied if the loaded config's own driver type
      // matches what this board's own socket data says it should be
      // (motorBlockFor() is board-derived, not a user choice) -- otherwise
      // the field names wouldn't line up with the path the regenerated
      // draft will actually use, so the values would silently go nowhere.
      // This check only makes sense for a real Motor socket -- a Generic
      // pin/module connector has no board-derived "expected" driver type at
      // all, since driverKey there IS the user's own choice, already
      // encoded directly in the "axis:<driverKey>:..." role bound above.
      let skipCopy = false;
      if (isMotorSocket) {
        const socketIndex = Number(resourceKey.split(":")[1]);
        const socket = (board.motor_sockets && board.motor_sockets.sockets || [])[socketIndex];
        const expectedKey = socket ? motorBlockFor(socket).key : null;
        if (driverKey && expectedKey && driverKey !== expectedKey) {
          report.notes.push(`axes.${letter}.${slot}: loaded config uses driver type "${driverKey}", but this board's own socket data implies "${expectedKey}" -- resource bound, but this socket's tuning fields and pin attributes were NOT copied (would land on the wrong regenerated path)`);
          skipCopy = true;
        }
      }
      if (!skipCopy && driverBody) {
        copyScalarParams(driverBody, `axes.${letter}.${slot}.${driverKey}`, new Set(motorPinFields));
        // Per-pin :low/:high/:pu/:pd attributes -- only meaningful once the
        // driver-type match above confirms this exact path
        // (axes.<letter>.<slot>.<driverKey>.<field>) will really exist in
        // the regenerated draft.
        motorPinFields.forEach(f => {
          if (!driverBody[f]) return;
          const parsed = parsePinString(driverBody[f]);
          if (parsed && (parsed.level || parsed.pull)) {
            pinAttrs[`axes.${letter}.${slot}.${driverKey}.${f}`] = { level: parsed.level, pull: parsed.pull };
          }
        });
      }
    });

    ["motor0", "motor1"].forEach(slot => {
      const motorDoc = axisDoc[slot];
      if (!motorDoc || typeof motorDoc !== "object") return;
      // limit_neg_pin/limit_pos_pin/limit_all_pin -- the shared/common
      // "axes.<letter>.motorN" section's own pin-typed fields matching
      // limit_*_pin, the "which" resource-key suffix extracted from the
      // field name itself (neg/pos/all) rather than a separately
      // hand-paired [field, which] list.
      Object.keys(CONFIG_ITEM_DOCS[MOTOR_COMMON_SECTION] || {}).forEach(field => {
        const m = field.match(/^limit_(.+)_pin$/);
        if (!m || !isPinType(MOTOR_COMMON_SECTION, field) || motorDoc[field] == null) return;
        claimPin(motorDoc[field], `limit:${letter}:${slot}:${m[1]}`, `axes.${letter}.${slot}.${field}`);
      });
      // hard_limits (and any other future plain per-motor scalar) --
      // motorDoc's own direct fields, distinct from the driver body's
      // scalars (copyScalarParams(driverBody, ...) above -- the driver
      // body itself is skipped automatically here too, since
      // copyScalarParams() already ignores any object-valued field, not
      // just ones named in skipKeys) and from the 3 limit pin fields just
      // claimed. Not gated on the driver-type match check above (unlike the
      // driver body's own tuning fields) -- this key's path
      // (axes.<letter>.<slot>.hard_limits) doesn't depend on which driver
      // type is in use, so it's always safe to copy back.
      // Skip set derived the same way as the claiming loop just above:
      // MOTOR_COMMON_SECTION's own pin-typed fields (currently just the 3
      // limit pins) -- these were already claimed as pins there, so
      // copyScalarParams() must not also copy them as plain scalar values
      // (pins are strings, so its generic object-value check alone
      // wouldn't otherwise skip them).
      copyScalarParams(motorDoc, `axes.${letter}.${slot}`,
        new Set(Object.keys(CONFIG_ITEM_DOCS[MOTOR_COMMON_SECTION] || {})
          .filter(k => isPinType(MOTOR_COMMON_SECTION, k))));
    });

    // No skipKeys needed -- motor0/motor1/homing are all object-valued
    // (schema $ref properties, same as motorDoc's own driver-type key
    // above), so copyScalarParams()'s own generic object check already
    // excludes them. shared_stepper_disable_pin doesn't even belong at
    // this nesting level to begin with -- it's a sibling of the axis
    // letters at the axesSection level (see cfg.axes.shared_stepper_disable_pin
    // elsewhere in this file), never a child of one, so it can't
    // structurally appear as a key inside axisDoc for a well-formed file.
    copyScalarParams(axisDoc, `axes.${letter}`, null);

    if (axisDoc.homing && typeof axisDoc.homing === "object") {
      homingEnabled[letter] = true;
      copyScalarParams(axisDoc.homing, `axes.${letter}.${homingSentinel(letter)}`, null);
    }
  });

  // --- probe/control/user_inputs/coolant/status_outputs/sdcard/ethernet/
  // i2so: same flat "claim every pin field via whichForField()'s which, then
  // copy back whichever of the section's own non-pin tuning fields are
  // set" shape generateDraft()'s matching else branch produces on the way
  // out (see stubNonPinFields()) -- e.g. probe's check_mode_start/
  // hard_stop/probe_hard_limit, coolant's delay_ms, status_outputs'
  // report_interval_ms, ethernet's phy_type/phy_addr/frequency_hz are all
  // picked up the same generic way, no field named individually.
  // sdcard/ethernet/i2so's own pin fields (BOARD_FIXED_SECTIONS) are
  // skipped entirely here, NOT passed to claimPin() at all -- they're
  // never Generic-Pin claims (computeBoardFixedRoles() permanently
  // blacklists every one of them, see that Set's own comment for why),
  // and they're regenerated directly from board.fixed_peripherals by
  // generateDraft()'s own fp.sdcard/fp.ethernet/fp.i2so pre-fill blocks
  // regardless of any binding -- there's nothing for a claim to
  // accomplish. Attempting it anyway is actively wrong, not merely
  // redundant: claimPin()'s resolvePin() reports a real, user-visible
  // "Failed to import" error whenever a pin doesn't match any known
  // Generic Pin resource (see recordFailedImport()) -- which a board-
  // internal wiring fact like i2so.bck_pin/sdcard.cs_pin never will,
  // since resourcePins is built from generic_pins/motor_sockets/etc.,
  // never from fixed_peripherals' own wiring. (A previous version of
  // this comment claimed claimPin() "harmlessly no-ops" for a
  // non-matching value -- confirmed wrong by reading resolvePin() itself:
  // that's only true when suppressFailure is passed, which this call
  // site never did.) copyScalarParams() still runs for every section,
  // pin fields or not -- untouched by this, since it only ever writes
  // back a field the loaded file actually set. Every EITHER_ROLE_TREE
  // key not in SPECIAL_CASE_ROLE_PREFIXES gets this treatment -- same
  // set generateDraft()'s own else branch relies on, so the two can
  // never disagree about which sections it covers.
  Object.keys(EITHER_ROLE_TREE).filter(prefix => !SPECIAL_CASE_ROLE_PREFIXES.has(prefix)).forEach(prefix => {
    const docSection = sectionForRolePrefix(prefix);
    const sectionDoc = doc[docSection] || {};
    const pinFields = Object.keys(CONFIG_ITEM_DOCS[docSection] || {}).filter(k => isPinType(docSection, k));
    if (!BOARD_FIXED_SECTIONS.has(docSection)) {
      pinFields.forEach(field => {
        if (sectionDoc[field] == null) return;
        claimPin(sectionDoc[field], `${prefix}:${whichForField(docSection, field)}`, `${docSection}.${field}`);
      });
    }
    copyScalarParams(sectionDoc, docSection, new Set(pinFields));
  });

  // --- user_outputs (digital/analog outputs + status_outputs) ---
  const userOutputsDoc = doc.user_outputs || {};
  const userOutputPinFields = Object.keys(CONFIG_ITEM_DOCS.user_outputs || {}).filter(k => isPinType("user_outputs", k));
  userOutputPinFields.forEach(field => {
    if (userOutputsDoc[field] == null) return;
    // "digital<n>"/"analog<n>" -- config_items.yaml's own field name,
    // "_pin" stripped, same convention as coolant/control/status_output.
    const which = field.slice(0, -4);
    const resourceKey = claimPin(userOutputsDoc[field], `user_output:${which}`, `user_outputs.${field}`);
    const hzField = `${which}_hz`;
    if (resourceKey && CONFIG_ITEM_DOCS.user_outputs[hzField]) {
      if (userOutputsDoc[hzField] != null && userOutputsDoc[hzField] !== TBD) {
        paramValues[`user_outputs.${hzField}`] = userOutputsDoc[hzField];
      }
    }
  });

  // --- spindles: any top-level key matching a known SPINDLE_TYPES cfgKey ---
  Object.keys(SPINDLE_TYPES).forEach(typeId => {
    const def = SPINDLE_TYPES[typeId];
    const spindleDoc = doc[def.cfgKey];
    if (!spindleDoc || typeof spindleDoc !== "object") return;
    const pinFields = new Set();
    // Union of output/pwm-capable (pins) and input-capable (inputPins) --
    // import doesn't care which direction a Generic Pin the value could
    // have come from, only that it needs to be claimed as a pin at all
    // (see buildSpindleTypes()'s pins/inputPins split -- PlasmaSpindle's
    // arc_ok_pin lives only in inputPins, so pins alone would both miss
    // claiming it here AND let it fall through to copyScalarParams below,
    // which would then wrongly treat its pin-string value as a plain
    // scalar param since it's not in pinFields either).
    def.pins.concat(def.inputPins).forEach(([which]) => {
      const field = `${which}_pin`;
      pinFields.add(field);
      if (spindleDoc[field] != null) claimPin(spindleDoc[field], `spindle:${typeId}:${which}`, `${def.cfgKey}.${field}`);
    });
    copyScalarParams(spindleDoc, def.cfgKey, pinFields);
  });

  // --- RS485 -> Modbus VFD spindle: a known model's own top-level key
  // (H2A:, Huanyang:, ...) or the generic ModbusVFD: key for a genuinely
  // custom/unsupported VFD -- see rs485RoleOptions' own comment and
  // generateDraft()'s allRs485Channels.forEach for why the top-level KEY,
  // not a model: field, is what selects a named model's real behavior.
  // Only the first VFD block found is imported (VFD_MODELS order, then
  // plain ModbusVFD:) -- see this function's own doc comment.
  const vfdTopKey = VFD_MODELS.find(m => doc[m] && typeof doc[m] === "object") ||
    (doc.ModbusVFD && typeof doc.ModbusVFD === "object" ? "ModbusVFD" : null);
  if (vfdTopKey) {
    const vfdDoc = doc[vfdTopKey];
    const isCustom = vfdTopKey === "ModbusVFD";
    const model = isCustom ? VFD_CUSTOM : vfdTopKey;
    const n = vfdDoc.uart_num;
    const uartBlock = doc[`uart${n}`];
    if (uartBlock && uartBlock.txd_pin != null) {
      // attrPath explicitly null: the pin actually lives in uartN:, a
      // fixed-protocol path (see isFixedProtocolPath()) that never gets
      // PINSLOT/attr treatment, and the VFD block itself isn't a real pin
      // leaf path -- nothing to attach attrs to here either way.
      let resourceKey = claimPin(uartBlock.txd_pin, `vfd:${model}`, vfdTopKey, null, ["rs485"], true);
      if (!resourceKey) {
        const inferred = inferPendantModuleSocket(uartBlock.txd_pin, uartBlock.rxd_pin, "rs485_channel");
        if (inferred) {
          bindings[resourceKeyModuleSocket(inferred.si)] = inferred.moduleId;
          computeResourcePins();
          pinOwnerIndex = buildPinOwnerIndex();
          resourceKey = resourceKeyModConn(inferred.si, inferred.ci);
          report.notes.push(`${vfdTopKey}: inferred RS485 module "${inferred.moduleId}" via module socket ${inferred.si}`);
          bind(resourceKey, `vfd:${model}`, vfdTopKey);
        }
      }
      if (resourceKey) {
        // A known model is deliberately excluded from SPINDLE_TYPES (see
        // buildSpindleTypes()'s `order` array comment -- it has no
        // pin-picker UI of its own, dispatched via RS485 instead), so it
        // never goes through the generic
        // "--- spindles ---" copyScalarParams() loop above. Its genuinely
        // open tuning fields (spinup_ms/spindown_ms/tool_num/...) still
        // need the same treatment here, or they silently reset to TBD on
        // reimport even though the source file had real values. uart_num
        // is re-derived above (from the RS485 role pick / claimPin);
        // model is only ever a real body field for the Custom case (see
        // generateDraft()'s isCustom branch) -- a known model's own body
        // has no model field to populate at all, the top-level key itself
        // carries that fact.
        const skipKeys = isCustom
          ? new Set(["uart_num", "modbus_id"])
          : new Set(["model", "uart_num", "modbus_id", ...vfdProtocolFields()]);
        copyScalarParams(vfdDoc, vfdTopKey, skipKeys);
        if (!isCustom) {
          // A known model's protocol fields default to hidden behind one
          // group-level "Override VFD Protocol" selector (see
          // vfdOverrideSentinel()'s own comment) -- excluded from the
          // generic copyScalarParams() call above (which would otherwise
          // populate paramValues at the wrong, flat "topKey.field" path)
          // since once expanded, generateDraft()'s own body places these
          // fields one level deeper, nested under the sentinel -- the exact
          // path collectAndInjectSlots will look for paramValues at. If the
          // imported file set any of them to a real value, the group must
          // also be expanded (vfdOverrideEnabled), or generateDraft() would
          // re-collapse it behind the sentinel and the resolve-step would
          // then drop the very values just copied in.
          const groupPath = `${vfdTopKey}.${vfdOverrideSentinel(vfdTopKey)}`;
          let anyAnswered = false;
          vfdProtocolFields().forEach(f => {
            const v = vfdDoc[f];
            if (v === undefined || v === null || v === TBD) return;
            paramValues[`${groupPath}.${f}`] = v;
            anyAnswered = true;
          });
          if (anyAnswered) vfdOverrideEnabled[vfdTopKey] = true;
        }
      } else {
        const message = `uart${n}.txd_pin did not resolve to an RS485 channel`;
        report.unrecognized.push(`${vfdTopKey}: ${message}, skipped`);
        recordFailedImport(vfdTopKey, vfdDoc, message);
      }
    } else {
      const message = "missing uart_num, or its referenced uartN: block";
      report.unrecognized.push(`${vfdTopKey}: ${message}, skipped`);
      recordFailedImport(vfdTopKey, vfdDoc, message);
    }
  }

  // --- expansion UART / I2C-as-UART: any uart_channelN: paired with a
  // uartN: block. Which resource type it resolves to (an actual expansion
  // UART connector vs. an I2C connector repurposed as one) determines the
  // correct role string, so the resourceKey's own prefix decides it. ---
  Object.keys(doc).forEach(key => {
    const m = key.match(/^uart_channel(\d+)$/);
    if (!m) return;
    const n = m[1];
    const uartBlock = doc[`uart${n}`];
    if (!uartBlock || uartBlock.txd_pin == null) {
      report.unrecognized.push(`${key}: no matching uart${n}: block with a txd_pin, skipped`);
      return;
    }
    let r = resolvePin(uartBlock.txd_pin, key, null, true);
    if (!r) {
      const inferred = inferPendantModuleSocket(uartBlock.txd_pin, uartBlock.rxd_pin);
      if (inferred) {
        bindings[resourceKeyModuleSocket(inferred.si)] = inferred.moduleId;
        computeResourcePins();
        pinOwnerIndex = buildPinOwnerIndex();
        const resourceKey = resourceKeyModConn(inferred.si, inferred.ci);
        report.notes.push(`${key}: inferred pendant module "${inferred.moduleId}" via module socket ${inferred.si}`);
        bind(resourceKey, "uart_channel", key);
        if (doc[key].report_interval_ms != null && doc[key].report_interval_ms !== TBD) {
          paramValues[`${key}.report_interval_ms`] = doc[key].report_interval_ms;
        }
        return;
      }
      r = resolvePin(uartBlock.txd_pin, key);
    }
    if (!r) return;
    const prefix = resourceKeyPrefix(r.resourceKey);
    if (prefix === "expuart") {
      bind(r.resourceKey, "uart_channel", key);
    } else if (prefix === "i2c") {
      bind(r.resourceKey, "expansion_uart", key);
    } else if (prefix === "modconn") {
      const moduleConn = allModuleSocketConnectors().find(x => x.key === r.resourceKey);
      if (moduleConn && moduleConn.connector.kind === "expansion_uart") {
        bind(r.resourceKey, "uart_channel", key);
      } else {
        const message = `txd_pin resolved to ${r.resourceKey}, which is not an expansion UART connector`;
        report.ambiguous.push(`${key}: ${message} -- skipped`);
        recordFailedImport(key, doc[key], message);
      }
    } else {
      const message = `txd_pin resolved to ${r.resourceKey}, which is neither an expansion UART nor I2C connector`;
      report.ambiguous.push(`${key}: ${message} -- skipped`);
      recordFailedImport(key, doc[key], message);
    }
    if (doc[key].report_interval_ms != null && doc[key].report_interval_ms !== TBD) {
      paramValues[`${key}.report_interval_ms`] = doc[key].report_interval_ms;
    }
  });

  // --- bare I2C bus --- (attrPath explicitly null: i2c0's pins are a
  // fixed-protocol path, see isFixedProtocolPath(), never PINSLOT-eligible)
  if (doc.i2c0 && doc.i2c0.sda_pin != null) {
    const result = claimPin(doc.i2c0.sda_pin, "i2c_bus", "i2c0", null);
    if (!result) recordFailedImport("i2c0", doc.i2c0, "failed to resolve i2c0 SDA pin");
  }

  // --- kinematics ---
  if (doc.kinematics && typeof doc.kinematics === "object") {
    const sysKey = Object.keys(doc.kinematics)[0];
    const matchedTypeId = Object.keys(KINEMATICS_TYPES).find(t => KINEMATICS_TYPES[t].cfgKey === sysKey);
    if (matchedTypeId) {
      kinematicsType = matchedTypeId;
      copyScalarParams(doc.kinematics[sysKey], "kinematics.KINSELECT", null);
    } else if (sysKey) {
      report.notes.push(`kinematics: unrecognized system "${sysKey}", left as Cartesian`);
    }
  }

  // --- start / stepping / uncategorized top-level scalars, and name: ---
  // (name: is set unconditionally to TBD by generateDraft() itself, same
  // open-TBD mechanism as these others -- not tied to any board resource.)
  if (doc.name != null && doc.name !== TBD) paramValues.name = doc.name;
  if (doc.start) copyScalarParams(doc.start, "start", null);
  if (doc.stepping) copyScalarParams(doc.stepping, "stepping", new Set(["engine"]));
  // Every other scalar in config_items.yaml's "(top-level machine items)"
  // section -- board (handled above via board-detection, not a plain
  // paramValue) and name/meta (name handled just above; meta isn't
  // surfaced by this wizard at all) are the only ones excluded, so a
  // future scalar added there is picked up automatically instead of
  // needing this list hand-updated too.
  const TOP_LEVEL_SCALAR_EXCLUDE = new Set(["board", "name", "meta"]);
  Object.keys(CONFIG_ITEM_DOCS["(top-level machine items)"] || {})
    .filter(key => !TOP_LEVEL_SCALAR_EXCLUDE.has(key))
    .forEach(key => {
      if (doc[key] != null && doc[key] !== TBD) paramValues[key] = doc[key];
    });

  // --- optional top-level sections with no board correlation: parking /
  // macros / oled / atc_manual --- mirrors the KINSELECT/homing sentinel
  // convention above: presence of the real section key in the loaded doc
  // means the selector should come back enabled, and its scalar params are
  // stored under the SECTIONSELECT_<key> sentinel path (same path the
  // sentinel occupies in `cfg` itself, see OPTIONAL_SECTIONS/generateDraft()).
  Object.keys(OPTIONAL_SECTIONS).forEach(key => {
    if (doc[key] && typeof doc[key] === "object") {
      sectionEnabled[key] = true;
      copyScalarParams(doc[key], sectionSentinel(key), null);
      report.matched.push(key);
    }
  });

  return report;
}

function renderImportReport(report, filename, boardNote) {
  let panel = document.getElementById("importReport");
  if (!panel) {
    panel = document.createElement("div");
    panel.id = "importReport";
    panel.className = "note";
    document.body.appendChild(panel);
  }
  const total = report.matched.length;
  let html = "";
  if (boardNote) html += `<div>${escapeHtml(boardNote)}</div>`;
  html += `<b>Loaded ${escapeHtml(filename)}:</b> ${total} resource(s) matched`;
  if (report.ambiguous.length) html += `, ${report.ambiguous.length} ambiguous`;
  if (report.unrecognized.length) html += `, ${report.unrecognized.length} unrecognized`;
  html += `. <button onclick="document.getElementById('importReport').style.display='none'">Dismiss</button>`;
  if (report.ambiguous.length || report.unrecognized.length || report.notes.length) {
    html += `<ul>`;
    report.ambiguous.forEach(m => html += `<li><b class="tag-warn">Ambiguous:</b> ${escapeHtml(m)}</li>`);
    report.unrecognized.forEach(m => html += `<li><b class="tag-warn">Unrecognized:</b> ${escapeHtml(m)}</li>`);
    report.notes.forEach(m => html += `<li><b>Note:</b> ${escapeHtml(m)}</li>`);
    html += `</ul>`;
  }
  panel.innerHTML = html;
  // Nothing to flag at all -> plain info. Anything ambiguous/unrecognized,
  // or a boardNote saying the config's own board didn't match (so pin
  // bindings should be double-checked), is worth a warning tone instead --
  // this import succeeded, but the result deserves a second look.
  const needsAttention = report.ambiguous.length || report.unrecognized.length ||
    (boardNote && boardNote.includes("verify pin bindings"));
  panel.className = needsAttention ? "note note-warn" : "note note-info";
  panel.style.display = "block";
}

/* Best-effort match of a loaded config's own `board:` field back to one of
 * this tool's board_ids, so the picker can auto-switch instead of relying
 * on the user to have pre-selected the right board. Two passes: a direct
 * board_id match first (covers a hand-written config that happens to use
 * the id itself), then a match against each board file's own human-
 * readable `board.name` -- generateDraft() itself writes `cfg.board =
