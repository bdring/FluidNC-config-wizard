<style>
  :root {
    --bg: #0f1417; --panel: #171e23; --border: #2a343b; --text: #dbe4e8;
    --muted: #7d8f98; --accent: #64e3fc; --tbd: #d9a441; --fixed: #5c7d63; --danger: #e0616b;
    /* Halfway between --muted and --text -- for secondary-but-still-worth-
       reading text (section headers, per-row sub info, the fixed-
       peripherals list) that needs to stay visually subordinate to actual
       resource names/values without being as low-contrast as --muted. */
    --muted-strong: #aebcc4;
    /* Amber, but distinct from --tbd's amber -- --tbd already has an
       established, different meaning ("this field needs a decision"), so
       a genuine advisory warning (e.g. the RS485/expansion-UART "only one
       of these can be used" note) gets its own slightly more orange tone
       rather than overloading --tbd's. */
    --warn: #e0a53c;
    /* Deliberately much more visible than plain --border (#2a343b, barely
       distinguishable from --bg/--panel) -- reused as --muted rather than a
       one-off color since it's already an established, legible gray-blue in
       this palette. Only for the vertical dividers BETWEEN the main panes
       (.col.left/.col.hotspot below), matching hotspot-editor.html's own
       --pane-divider -- every other border (buttons, inputs, section
       headers) stays on plain --border, which is fine at that small scale. */
    --pane-divider: var(--muted);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 12.5px; }
  /* Stands in for the "Open Hotspot Editor" button while that tab is open
     (see updateHotspotEditorBtn()) -- --muted-strong, not plain --muted
     like header p above, since this is an actionable instruction someone
     needs to actually read and act on, not incidental subtext. */
  .header-note { color: var(--muted-strong); font-size: 13px; }
  /* Board picker sits in a flex:1 middle region so it lands roughly
     centered in the header (between the title and the right-pinned
     load-config button) rather than jammed hard against the right edge --
     it reads much better against the resource pane's own "Pick a board
     above" instruction that way, since the picker is now actually more
     "above" than "above and off to the right". */
  .header-picker { flex: 1; text-align: center; }
  .header-right { margin-left: auto; display: flex; align-items: baseline; gap: 16px; }
  select, button {
    color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 6px 10px; font-size: 13px; font-family: inherit;
  }
  select { background: var(--panel); }
  /* #505050, not var(--panel) (#171e23, near-black) -- var(--panel) reads as
     visually almost indistinguishable from the page's own --bg (#0f1417)
     specifically on BUTTONS, where the only other cue a control exists is a
     1px border; select gets a native OS dropdown affordance that doesn't
     have the same problem, so it keeps --panel. */
  button { background: #505050; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06181c; font-weight: 600; border-color: var(--accent); }
  /* Draft (right) column is sized to just fit ~60 monospace characters
     (see pre#draft's width: 50ch below) via the "max-content" track --
     rather than a fraction of the window, since the point is a fixed
     comfortable reading width for YAML text, not proportional scaling.
     The resource-picker column takes whatever's left (1fr). See the
     matching 3-column version renderHotspotPane() sets below when a
     hotspot photo pane is also present. */
  main { display: grid; grid-template-columns: 1fr max-content; gap: 0; height: calc(100vh - 61px); }
  #importReport { grid-column: 1 / -1; }
  /* Widened by renderHotspotPane() (JS, inline style) to 3 columns only
     when the loaded board has a hotspots/<id>.hotspots.yaml file -- most
     boards don't yet, so this stays the default 2-column layout for those. */
  .col { overflow-y: auto; padding: 18px 24px; }
  .col.left { border-right: 2px solid var(--pane-divider); }
  section { margin-bottom: 22px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted-strong); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  /* Label column capped (minmax(0, ...)), NOT 1fr -- controls column gets
     the 1fr instead, so a wide left pane hands its extra room to the
     selects (where long option text like "Sd Card — Card Detect" actually
     needs it) rather than to the label (a short name/sub pair that never
     needed more than ~200px). Was backwards before: label was 1fr and
     controls a hard-fixed 200px/260px, so widening the pane just stretched
     the label while .cascade-controls/.output-controls stayed pinned
     narrow, truncating their <select> text no matter how much room was
     actually available. */
  .row {
    display: grid; grid-template-columns: minmax(0, 200px) minmax(140px, 1fr); gap: 10px; align-items: center;
    padding: 6px 0;
  }
  .row .lbl { display: flex; flex-direction: column; }
  .row .lbl .name { font-weight: 600; }
  .row .lbl .sub { color: var(--muted-strong); font-size: 11.5px; margin-top: 1px; }
  .row.gpio-conflict select { opacity: 0.5; cursor: not-allowed; }
  .row select { width: 100%; }
  .row.output-row, .row.cascade-row { grid-template-columns: minmax(0, 200px) minmax(240px, 1fr); }
  /* flex-wrap so a deep cascade (limit's 4 chained selects: category/
     axis/motor/direction) wraps onto a second line rather than staying
     forced onto one; flex: 0 1 auto + min-width: max-content so each
     select sizes to its OWN selected text instead of being squeezed to
     an equal 1/Nth share regardless of content -- with flex:1 + min-
     width:0 (the old rule), 4 selects divided evenly no matter how wide
     the row was, so short ("Ne" for "Negative") and long ("Fir" for
     "First Motor") labels alike got truncated to a few characters each.
     flex-grow:0 (not 1) deliberately leaves any leftover row width
     unclaimed rather than stretching every select to fill it -- a row
     with a wide left pane and short option text (e.g. "Limit"/"X axis")
     would otherwise balloon each select to match the pane's own width
     for no reason; a select only ever needs to be as wide as what it's
     actually showing. */
  .output-controls, .cascade-controls { display: flex; gap: 4px; flex-wrap: wrap; }
  /* width: auto overrides .row select's own width:100% -- flex-basis:auto
     defers to the width property when one is set (per spec), so without
     this override here, flex-basis effectively resolved to "100% of the
     flex container" instead of "the select's own content size," silently
     defeating flex-grow:0 above (every select still stretched to fill
     the row no matter how short its text). */
  .output-controls select, .cascade-controls select { flex: 0 1 auto; min-width: max-content; width: auto; }
  /* Each row's selector(s) live inside a small positioned wrapper (.ctrl-wrap
     for a single-select row, or the existing .output-controls/.cascade-
     controls for the two multi-select row types) so .conflict-note --
     appended as a child of that SAME wrapper, not the row as a whole -- can
     use inset:0 to cover exactly the selector portion of the row and
     nothing else (never the name/sub text on the left). See
     refreshGpioConflicts(). Opaque background so the selector underneath is
     fully hidden, not just dimmed; only ever shown on an UNASSIGNED
     resource, disappears (selector reappears) the instant the conflicting
     resource reverts to Unused. */
  .row.module-socket-row { border-top: 1px solid var(--border, #333); margin-top: 6px; padding-top: 10px; }
  .module-connectors {
    grid-column: 1 / -1;
    margin: 0 0 4px 18px;
    padding-left: 10px;
    border-left: 2px solid var(--border, #333);
  }
  .module-connectors .row { padding: 4px 0; }
  .ctrl-wrap { position: relative; }
  .output-controls, .cascade-controls { position: relative; }
  .conflict-note {
    display: none; position: absolute; inset: 0;
    align-items: center; padding: 0 8px;
    background: var(--panel); color: var(--danger); font-size: 11.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 5px;
  }
  .fixed-fact { color: var(--text); font-weight: 600; }
  /* Config-item doc tooltip (config_items.yaml, see lookupItemDoc()) --
     dotted underline hints that hovering the key reveals its description,
     without competing visually with the plain YAML text around it. */
  .doc-key { border-bottom: 1px dotted var(--muted-strong); cursor: help; }
  .fixed-list { font-size: 12px; color: var(--muted-strong); line-height: 1.6; }
  .fixed-list code { color: #71b599; background: none; }
  code { background: #0a1013; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  pre#draft {
    background: #0a1013; border: 1px solid var(--border); border-radius: 6px;
    padding: 14px; font-size: 12.5px; line-height: 1.55; overflow-x: auto;
    white-space: pre; min-height: 200px;
    /* Explicit monospace stack -- needed so the "ch" unit below (which
       resolves against THIS element's own font, since width is set here)
       reliably means "60 monospace character widths" rather than
       whatever <pre>'s UA-default font happens to be per browser. */
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    width: 50ch; max-width: 100%; box-sizing: content-box;
    /* The draft text is drag-selectable (so the user can copy a snippet,
       not just the whole file via the Copy button) -- but #draft is full
       of real interactive controls (input.inline-field, select.attr-field,
       .inline-btn, etc, see generateDraft()), and on Chrome/Windows a
       mouse-drag text selection that starts or ends over one of those
       controls gets silently collapsed the instant the mouse button is
       released (reported: highlight vanishes on mouseup, though Ctrl-C
       while still held down does copy it -- i.e. the browser's internal
       selection object is fine, only the visible-highlight/finalize step
       is glitching). Not reproduced on Chrome/macOS. Making every such
       control unselectable (below) keeps a selection's start/end points
       from ever landing inside one, which avoids the finalize glitch. */
    user-select: text;
  }
  pre#draft input, pre#draft select, pre#draft button {
    user-select: none; -webkit-user-select: none;
  }
  .tbd-token { color: var(--tbd); font-weight: 700; }
  .summary { display: flex; gap: 18px; margin-bottom: 12px; font-size: 12.5px; }
  .summary .stat b { font-size: 16px; display: block; }
  .summary .stat.tbd b { color: var(--tbd); }
  .failed-imports {
    background: rgba(224, 96, 107, 0.12);
    border: 1px solid #e0616b;
    border-radius: 6px; padding: 12px; margin: 0 0 12px;
    color: #f66;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.55;
  }
  .failed-import-entry + .failed-import-entry {
    margin-top: 12px;
  }
  .failed-import-label {
    font-weight: 700; margin-bottom: 6px;
  }
  .failed-imports pre {
    margin: 0; padding: 8px; background: rgba(0,0,0,0.12);
    border-radius: 4px; white-space: pre-wrap; word-break: break-word;
  }
  .summary .stat.done b { color: #6fbf73; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  /* .note is the base box (background/border/spacing) for every status/
   * guidance message in the resource pane. Its SEVERITY -- what kind of
   * message it is -- is a separate modifier class, always paired with
   * "note": .note-instruct (imperative -- tells the user to do something
   * right now, e.g. "Pick a board above to begin"), .note-info (neutral
   * status/context, nothing to act on), .note-warn (advisory -- worth
   * noticing but not a failure, e.g. a shared-pin/bus conflict), or
   * .note-error (an operation actually failed -- couldn't load/parse a
   * file). Color-only (an earlier left accent-stripe treatment looked like
   * an unclosed bracket against this box's own border, so was dropped);
   * deliberately reuses existing app-wide color tokens (--accent for
   * "do this", --danger for real errors) rather than inventing a fully
   * separate palette, except --warn (see its definition above) which
   * needed to stay distinct from --tbd's already-established meaning. */
  .note {
    font-size: 14px; line-height: 1.5; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 16px;
  }
  .note-instruct { color: var(--accent); }
  .note-info { color: var(--muted-strong); }
  .note-warn { color: var(--warn); }
  .note-error { color: var(--danger); }
  /* The loaded board's name, shown just below the resource-pane's intro
     instruction note -- styled like a heading (same weight/size as
     header h1) rather than folded into that note's own instructional
     text/color, since it's an identifying title, not an instruction. */
  .board-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 16px; }
  /* Ambiguous/Unrecognized import-report list items are their own small
   * warning-flavored callouts inside an otherwise info/warn-toned panel --
   * see renderImportReport() -- so their <b> label gets --warn directly
   * rather than waiting for a wrapping .note-warn (which colors the WHOLE
   * panel, a coarser-grained decision made once per import, not per line). */
  .note b.tag-warn { color: var(--warn); }
  .inline-field {
    font: inherit; font-size: 12.5px; font-family: inherit; color: var(--tbd);
    background: #1c262c; border: 1px solid var(--tbd); border-radius: 3px;
    padding: 0 4px; margin: 0 1px;
  }
  .inline-field.filled { color: #6fbf73; border-color: #6fbf73; }
  /* Duplicate tool_num across two spindle sections -- see toolNumConflicts'
     declaration comment. Overrides .filled's green (a conflicted field is
     still "answered", just answered wrong) -- order here matters: this rule
     must come after .filled so its color/border wins when both classes are
     present, which they always are together for a conflicted field. */
  .inline-field.conflict { color: var(--danger); border-color: var(--danger); background: rgba(224,97,107,.12); }
  .inline-field:focus { outline: none; border-color: var(--accent); }
  input.inline-field { width: 9ch; }
  select.inline-field { max-width: 22ch; }
  .inline-field::placeholder { color: var(--muted); }
  .inline-btn {
    font: inherit; font-size: 10.5px; line-height: 1; cursor: pointer;
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 4px; margin: 0 1px; vertical-align: middle;
  }
  .inline-btn:hover { color: var(--text); border-color: var(--accent); }
  .inline-btn.default-btn:hover { color: #6fbf73; border-color: #6fbf73; }
  .inline-btn.clear-btn:hover { color: #d9694a; border-color: #d9694a; }
  .attr-field {
    font: inherit; font-size: 10.5px; background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); border-radius: 3px; padding: 0 2px; margin-left: 1px;
  }
  .attr-field.set { color: var(--accent); border-color: var(--accent); }
  /* Level picker on a pin whose active level is known but not yet chosen
     (see pinWidgetHtml()'s activeLevel/levelOpts) -- same pending/open-TBD
     amber used for numeric TBD fields (.inline-field's default color),
     distinguishing "not yet decided" from a pin where blank has always
     just meant "no suffix, don't care." */
  .attr-field.tbd { color: var(--tbd); border-color: var(--tbd); }
  .kin-select {
    font: inherit; font-size: 12.5px; font-family: inherit; color: var(--text);
    background: #1c262c; border: 1px solid var(--border); border-radius: 3px;
    padding: 0 2px; margin-left: -4px;
  }
  /* section-select sits at the true left margin (a top-level key, like
     start:/stepping:), same as kin-select above -- the browser's default
     <select> box adds a few px of left padding/border that a plain text
     key doesn't have, so without this it visually reads as indented one
     level even though the underlying YAML key is at column 0. */
  .section-select {
    font: inherit; font-size: 12.5px; font-family: inherit; color: var(--text);
    background: #1c262c; border: 1px solid var(--border); border-radius: 3px;
    padding: 0 2px; margin-left: -4px;
  }
  .col.hotspot { border-right: 2px solid var(--pane-divider); }
  /* Always scale the board photo to fill the pane's width -- not just
     capping a large photo down, but also stretching a small one up. A photo
     scaled up at view time by the browser looks the same as one baked to a
     bigger resolution once at export time (same source pixels, same
     interpolation) -- so hotspot-editor.html's export step doesn't
     manufacture extra pixels; the goal here is legibly locating a
     connector, not photo quality, and this way the file itself stays
     honestly sized.
     display:block + width:100% here is load-bearing, not decorative: it's
     what gives updateHotspotLayout() a real, container-driven width to read
     via wrap.getBoundingClientRect() and adapt to. An inline-block wrap
     (tried briefly, reverted) shrink-wraps to its OWN content instead --
     since that content (#hotspotImg) is exactly what this function sets
     FROM the wrap's measured width, that shrink-wrap just mirrors the
     img's current size right back, i.e. it never actually reflects the
     pane's available width and the photo silently stops adapting to it.
     #hotspotImgPad exists to reserve room AROUND the photo for hotspots
     that extend past its own 0-100% bounds (see updateHotspotLayout() --
     hotspots.yaml's rect/label_rect coordinates are percentages of the
     RAW, unpadded photo, unbounded, matching exactly what
     hotspot-editor.html itself edits/exports now that IT no longer pads
     the image either) -- its padding is computed and set in JS, not CSS,
     since it depends on both the current column width and each board's own
     hotspot extents. #hotspotImg's width is likewise set in JS (a plain
     px value, not width:100%) for the same reason. #hotspotOverlay spans
     the FULL padded box (content + padding) of imgWrap, i.e. the whole
     reserved workspace, not just the photo itself -- same structure
     hotspot-editor.html's own #imgWrap/#imgPad/#overlay already use. */
  #hotspotImgWrap { position: relative; display: block; width: 100%; }
  #hotspotImgPad { display: block; }
  #hotspotImgWrap img { display: block; user-select: none; -webkit-user-drag: none; }
  #hotspotOverlay { position: absolute; inset: 0; }
  /* Color encodes binding state, not just hover: yellow (--tbd, same color
     the rest of the wizard already uses for "open/TBD") for a connector
     with no role assigned yet, green for one that does -- refreshed live
     on every generateDraft() (see refreshHotspotStates()), not just at
     board-load time. Magenta is reserved exclusively for "this is the one
     you just clicked" (.active), so it always reads as a distinct
     selection state, never confusable with the assigned/unassigned color. */
  .hotspot-rect {
    position: absolute; box-sizing: border-box; cursor: pointer;
    border: 3px solid var(--tbd); background: rgba(217,165,60,.14);
    transition: background .15s, border-color .15s;
  }
  .hotspot-rect.assigned { border-color: #6fbf73; background: rgba(111,191,115,.16); }
  .hotspot-rect:hover, .hotspot-rect.hover { background: rgba(217,165,60,.34); }
  .hotspot-rect.assigned:hover, .hotspot-rect.assigned.hover { background: rgba(111,191,115,.34); }
  .hotspot-rect.active { border-color: #e63cc8 !important; background: rgba(230,60,200,.30) !important; }
  /* Resource name shown centered inside the box (rather than pinned to the
     top-left corner), wrapping within the rect's own width rather than
     overflowing past its edges as a single nowrap line -- long connector
     names on small hotspots stay legible and contained; still allowed to
     overflow vertically if a box is very short (no truncation/ellipsis/
     font-shrinking yet, a known rough spot to revisit later) rather than
     hiding any of the text. A dark backing chip keeps it legible over any
     of the box's yellow/green/magenta fill states. pointer-events: none so
     it never steals the click/hover that's meant for the rect itself.
     IMPORTANT: horizontal centering is done with text-align, NOT
     left:50%/transform translateX -- an absolutely-positioned auto-width
     box with only `left` set (no `right`) is sized via shrink-to-fit
     against the space between `left` and the containing block's edge, so
     `left:50%` only gives it ~half the box's width to lay text out in
     *before* the translate(-50%) shift is ever applied (transforms are
     paint-time, they don't participate in that width calculation) --
     that's what was forcing short labels like "Spindle Out2" to wrap even
     though they fit on one line just fine once actually centered. Keeping
     `left`/`right` both set (so the box spans the full rect width, same
     as before centering was added) and centering the text WITHIN that
     full-width box via text-align avoids the trap; only the vertical axis
     uses a transform, which doesn't hit this problem. */
  .hotspot-label {
    position: absolute; top: 50%; left: 2px; right: 2px; transform: translateY(-50%);
    z-index: 2; pointer-events: none;
    /* --hotspot-scale is set on #hotspotImgWrap by updateHotspotLayout() to
       the photo's current rendered width divided by a fixed reference width
       (HOTSPOT_FONT_REF_WIDTH, currently 1000) -- NOT the photo's own
       native resolution, which was tried first and caused a real bug: it
       tied font size to a per-photo value that has nothing to do with how
       big the photo is actually rendered, so a photo with a large native
       resolution shown at a modest size (e.g. in a narrower pane) produced
       a tiny, near-illegible scale factor. 14px is this codebase's own
       tuned base size (bumped up from an initial 10px, which read too
       small even at scale close to 1). Falls back to 1 (unscaled) before
       JS has run. */
    font-size: calc(14px * var(--hotspot-scale, 1)); line-height: 1.3; color: #f2f6f8;
    white-space: normal; word-break: break-word;
    text-align: center; overflow: visible; box-sizing: border-box;
  }
  /* .vertical mirrors .hotspot-role-label.vertical below, but the two are
     driven by INDEPENDENT fields -- this one by rect_orientation (or, if
     absent, rect's own aspect ratio; see boxOrientation()), the role
     label by label_orientation/label_rect's own aspect ratio. No coupling:
     rect and label_rect can each be oriented differently. Switches
     from top:50%+translateY (base .hotspot-label's centering, height left
     "auto") to top:0/bottom:0 + flex centering, same as
     .hotspot-role-label already does -- NEEDED, not just cosmetic: in
     vertical-rl, the element's HEIGHT becomes the text's wrapping
     constraint (its inline-size), and an "auto" height doesn't reliably
     expand to fit vertical text across browsers, so the base rule's
     wrapped even inside a visually tall-enough box. Pinning height to the
     rect's own full height (top:0;bottom:0) gives vertical text the same
     generous room horizontal text already got from the rect's WIDTH. */
  .hotspot-label.vertical {
    top: 0; bottom: 0; transform: rotate(180deg);
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; text-orientation: mixed;
  }
  /* This OUTER element intentionally spans the full rect width (see the
     comment above on why -- left/right, not left+transform) and stays
     background-less; the dark backing chip lives on this INNER span
     instead, so it hugs just the rendered characters rather than the whole
     (often much wider) box. An inline element naturally shrinks to its own
     text -- and, for text long enough to wrap onto more than one line (see
     word-break above), naturally draws a separate right-sized chip behind
     EACH line rather than one wide box spanning the rect's full width. */
  .hotspot-label-text {
    background: rgba(10,16,19,.72); padding: 1px 4px; border-radius: 2px;
  }
  /* The connector's OWN name (e.g. "Motor1") always shows as the corner
     chip above (.hotspot-label, unconditional). .hotspot-role-label is a
     different thing: the FluidNC ROLE that's been assigned to that
     connector (e.g. "X Motor" / "Limit X-"), shown only once a hotspot has
     an editor-authored label_rect AND the connector is actually bound to
     something -- positioned at that separate rect (same %-of-image space
     as the connector box, not nested inside it) rather than the connector
     box's own corner, since small/crowded connectors often have no room
     for both their own name and the assigned role. Text content/visibility
     is refreshed live by refreshHotspotStates(), same as the connector
     box's assigned/unassigned coloring. label_orientation: "vertical" (or,
     if absent, label_rect's own aspect ratio -- see boxOrientation(),
     independent of rect_orientation above) rotates the text to read
     bottom-to-top; still allowed to overflow past the rect for now (same
     "fix later" stance as the corner chip). */
  .hotspot-role-label {
    position: absolute; z-index: 2; pointer-events: none; padding: 1px 4px;
    /* Same --hotspot-scale AND base size as .hotspot-label above -- kept in
       sync with it deliberately, so a connector's own name and its assigned
       role read at the same size. */
    font-size: calc(14px * var(--hotspot-scale, 1)); line-height: 1.25; color: #000; background: palegreen;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; text-align: center; white-space: normal;
    word-break: break-word; overflow: visible; box-sizing: border-box;
    border: 1px solid #000; border-radius: 2px;
  }
  .hotspot-role-label.vertical {
    writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
  }
  .hotspot-role-label:empty { display: none; }
  /* Module image overlay inside a socket hotspot rect */
  .hotspot-rect.has-module-overlay { background: transparent !important; }
  .hotspot-rect.has-module-overlay > .hotspot-label { display: none; }
  .module-socket-overlay { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .module-socket-rotated img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .module-hotspot-chip { position: absolute; pointer-events: auto; }
  .module-hotspot-chip .hotspot-role-label { position: absolute; }
  /* Same green already used for the hotspot photo's own assigned state
     (see .hotspot-rect.assigned above, #6fbf73) -- one persistent visual
     vocabulary for "this resource has a role" across both panes, kept in
     sync live by refreshGpioConflicts() (runs on every binding change,
     same as the hotspot photo's own refreshHotspotStates()). Declared
     BEFORE .row.hotspot-target below so the magenta "just clicked via a
     hotspot" state -- a momentary selection cue, not a data state --
     still wins the box-shadow/background when a row happens to be both
     assigned AND the current hotspot selection; reorder these two rules
     together if that priority ever needs to change. box-shadow: inset
     (not outline + outline-offset) -- an outline is drawn OUTSIDE the
     row's own box, and consecutive .row elements sit directly adjacent
     (only padding between them, no gap), so an outward-offset outline on
     one row bled into its neighbor's space, making adjacent boxes look
     oversized and overlapping. An inset shadow stays entirely within the
     row's own box no matter how rows are spaced. */
  .row.assigned {
    background: rgba(111,191,115,.10); box-shadow: inset 0 0 0 2px #6fbf73; border-radius: 6px;
  }
  .row.hotspot-target {
    background: rgba(230,60,200,.16); box-shadow: inset 0 0 0 2px #e63cc8; border-radius: 6px;
  }
</style>
</head>
<body>

<header>
  <h1>FluidNC Board Mapping Wizard</h1>
  <div class="header-picker">
    <select id="boardPicker"></select>
  </div>
  <div class="header-right">
    <!-- See gotoHotspotEditor() -- named target so repeated clicks reuse
         the same companion tab instead of piling up a new one each time,
         and carries the currently-loaded board (if any) as a ?board=
         param so the hotspot editor lands on the same board instead of
         its own blank "pick one" state. Replaced by hotspotEditorOpenNote
         (see updateHotspotEditorBtn()) while that tab is known to still be
         open, so a second click can't reload it out from under whatever
         in-progress hotspot placement it has -- clicking here always
         navigates a REUSED tab for real, unlike merely switching to it.
         A disabled button alone said nothing about WHY or what to do
         instead, easy to miss/misread as just broken -- swapping it for
         an actual instruction is the point. -->
    <button id="gotoHotspotEditorBtn" onclick="gotoHotspotEditor()">Open Hotspot Editor</button>
    <span id="hotspotEditorOpenNote" class="header-note" style="display:none">Hotspot Editor is open in another tab — switch to it manually</span>
    <input type="file" id="customBoardFileInput" accept=".yaml,.yml,text/yaml" style="display:none">
  </div>
</header>

<main>
  <div class="note" id="importReport" style="display:none"></div>
  <div class="col left" id="resourceCol">
    <div class="note note-instruct" id="boardNote"></div>
    <!-- importReport's tier varies by outcome (error/info/warn) -- its
         className is set in full wherever its content is, see
         renderImportReport() and configFileInput's change handler. -->
  </div>
  <div class="col hotspot" id="hotspotCol" style="display:none">
    <!-- Populated by renderHotspotPane() only when hotspots/<id>.hotspots.yaml
         exists for the loaded board (currently just Corgi, as a prototype)
         -- hidden and excluded from the grid entirely otherwise. -->
  </div>
  <div class="col right">
    <div class="summary" id="summary"></div>
    <!-- Populated/shown only when two spindle sections' tool_num fields
         currently share a value -- see generateDraft()'s toolNumConflicts
         block. Hidden (not just empty) otherwise, same convention as
         #importReport. -->
    <div class="note note-error" id="toolNumConflictNote" style="display:none"></div>
    <div class="toolbar">
      <button onclick="copyDraft()">Copy</button>
      <button onclick="downloadDraft()">Download .yaml</button>
      <button onclick="document.getElementById('configFileInput').click()">Load config.yaml…</button>
      <!-- Companion-tool handoff (see boot()'s companion-detection block and
           sendToCompanion()) -- hidden by default, only shown when this tab
           was opened, via window.open(), by a known companion tool passing
           ?companion=<key> (e.g. WebInstaller's "Configure" button). Label
           text is set dynamically from COMPANION_TOOLS at boot. -->
      <button id="sendToCompanionBtn" style="display:none" onclick="sendToCompanion()"></button>
      <input type="file" id="configFileInput" accept=".yaml,.yml,text/yaml" style="display:none">
    </div>
    <div id="failedImportComments" class="failed-imports" style="display:none"></div>
    <pre id="draft"></pre>
  </div>
</main>

<script>
/* ---------------------------------------------------------------------
 * Board/chip/hotspot data now lives in real sidecar files, fetched at
 * runtime, instead of being embedded as JS string literals in this file.
 * This trades away the ability to preview the wizard in an environment
 * that can't fetch relative files (e.g. pasted into a chat sidebar) for a
 * shape that actually matches the real project layout (fluidnc-boards'
 * boards/*.board.yaml, chips/*.chip.yaml) and lets board/hotspot data be
 * edited without touching this file at all.
 *
 * IMPORTANT: fetch() of relative files is blocked by the browser's CORS
 * policy when this page is opened directly via a file:// URL (Chrome
 * included) -- there's no way around that from the page itself. To run
 * this locally, serve the folder over HTTP, e.g. from a terminal in this
 * folder: `python3 -m http.server 8000`, then open
 * http://localhost:8000/index.html. It also works as-is once pushed to
 * GitHub Pages, since that serves over real HTTP(S).
 *
 * BOARD_IDS is a manifest, not a directory listing -- fetch() can't
 * enumerate a folder's contents, so the wizard needs to be told which
 * board files exist. Rather than hand-maintaining this array, it's loaded
 * at boot from boards/index.json (see loadBoardManifest() below), which is
 * regenerated by tools/gen_board_index.py -- run that script and commit
 * its output whenever a board.yaml is added/removed/renamed.
 *
 * This manifest only drives the *dropdown* (and detectBoardId()'s config-
 * import auto-match below). loadBoard() itself just fetches
 * boards/<id>.board.yaml directly and never consults BOARD_IDS, so a board
 * that isn't in the manifest yet can still be loaded and tested via
 * index.html?board=<id> -- see boot()'s use of getBoardIdFromUrl() further
 * down. That's deliberate: it lets a contributor iterate on a brand-new
 * board file locally without needing to regenerate the manifest first.
 * ------------------------------------------------------------------- */
let BOARD_IDS = [];

// no-store on both fetches below -- same caching gotcha as
// loadBoardManifest()'s own fetch of boards/index.json: a locally-served
// python3 -m http.server response has no Cache-Control header, just
// Last-Modified, so a plain reload after editing a board.yaml (or its
// hotspots.yaml/chip.yaml) can silently keep showing the OLD content with
// no error (see bdring/FluidNC-config-wizard#14).
async function fetchYamlText(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.text();
}

// Returns null (not a throw) for optional per-board files -- a missing
// hotspots file is expected for every board except Corgi so far, and
// should silently fall back to no hotspot pane, not break board loading.
async function fetchYamlTextOptional(path) {
  try {
    const res = await fetch(path, { cache: "no-store" });
    if (!res.ok) return null;
    return await res.text();
  } catch (e) {
    return null;
  }
}


/* ---------------------------------------------------------------------
 * Role vocabularies. Real FluidNC has a larger set; this prototype covers
 * enough of it to demonstrate the resource-first walk + TBD stubbing.
 * ------------------------------------------------------------------- */
/* AXES / MOTOR_ROLE_TREE / INPUT_ROLE_TREE / SPINDLE_TYPES are derived at boot directly
 * from FluidNC's own authoritative fluidnc-config-schema.json (a versioned
 * copy lives at schema/fluidnc-config-schema.json in this repo, fetched
 * once -- see loadRoleData() below), rather than from a hand-generated
 * role-data.yaml sidecar. There used to be a two-step pipeline here (a
 * Python script read the schema and wrote role-data.yaml, which the wizard
 * then fetched) -- collapsed into one step per feedback ("consider doing
 * the work at runtime in javascript so there is no need for a cached role
 * file"): the exact same derivation logic now runs live in the browser
 * every time the page loads, so there's no intermediate artifact that can
 * go stale by someone forgetting to re-run a generator.
 *
 * What's still hand-authored here (the schema has no concept of these --
 * they're UI vocabulary, not config-file structure): AXES, MOTOR_LABELS,
 * LIMIT_DIRECTIONS (axis/motor-as-a-selectable-thing is a wizard UI
 * grouping choice, not a schema concept -- every other field/pin label
 * (spindle types, control/probe/coolant/status_output children, spindle
 * pins) is derived mechanically from the schema's own key names via
 * titleLabel()/cfgKey, no separate label map needed).
 *
 * What's still hardcoded LOGIC, not data at all: the tree-CONSTRUCTION
 * shape below (e.g. "build one Limit branch per axis, each with a
 * motor0/motor1 level under it") and generateDraft()'s per-role dispatch
 * (which config.yaml field(s) a given leaf path writes to) -- tied to
 * FluidNC's config schema, not expressible as passive data without
 * inventing a schema language. */
// The sentinel value marking an unanswered config item -- both in cfg's own
// data model (every stub() function below plants this as a leaf value) and
// in the rendered draft text/HTML (the literal word shown to the user, e.g.
// paramWidgetHtml()'s TBD <option> and the placeholder ghost text) --
// same literal deliberately used for both, so there's exactly one place
// that says what an open field looks like. A single named constant instead
// of ~110 separate string literals also makes TBD stop showing up as
// false-positive noise when grepping the file for hardcoded config-item
// names.
const TBD = "TBD";
// Maybe we should inject an axes enum in config.json
const AXES = ["x", "y", "z", "a", "b", "c"];
const MOTOR_LABELS = { motor0: "First Motor", motor1: "Second Motor" };
const LIMIT_DIRECTIONS = { neg: "Negative", pos: "Positive", all: "all" };
// Every spindle's tuning stub field opens as TBD, same as every other
// role's tuning fields -- this used to special-case tool_num to a baked-in literal 0, which made
// it the one spindle field the wizard's normal inline-field/"def"/"clear"
// machinery never touched, so it couldn't be changed from the UI at all
// (only by hand-editing the exported YAML). specForKey's own
// `case "tool_num": return numeric(0, "firmware")` already existed and was
// simply unused while this literal shadowed it -- removing the special case
// lets that spec take over, so tool_num now gets the same editable widget
// (pre-fillable with 0 via the "def" button, but genuinely changeable) every
// other tuning field already has.

function titleLabel(fieldKey) {
  return fieldKey.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}
function stripPinSuffix(key) {
  return key.endsWith("_pin") ? key.slice(0, -4) : key;
}

// MOTOR_ROLE_TREE and INPUT_ROLE_TREE.limit depend only on the
// hand-authored vocabulary above (no schema fetch needed), so they're built
// synchronously here rather than inside loadRoleData().
const MOTOR_ROLE_TREE = Object.fromEntries(AXES.map(ax => [ax, {
  label: `${ax.toUpperCase()} axis`,
  children: Object.fromEntries(Object.keys(MOTOR_LABELS).map(m => [m, { label: MOTOR_LABELS[m] }])),
}]));

// Flat [value,label] form of the same axis/motor-slot vocabulary
// MOTOR_ROLE_TREE encodes as a tree -- used by cascadeOptionsFor()'s
// "axis:rc_servo"/"axis:solenoid" categories (makeOutputRow's fixed 2-step
// picker needs a flat secondary-select list, not a tree; see
// buildOutputRoleBranches() for the tree-shaped equivalent EITHER_ROLE_TREE
// uses instead, which reuses MOTOR_ROLE_TREE directly).
function axisMotorSlotOptions() {
  const opts = [];
  AXES.forEach(ax => {
    Object.keys(MOTOR_LABELS).forEach(m => opts.push([`${ax}:${m}`, `${ax.toUpperCase()} axis — ${MOTOR_LABELS[m]}`]));
  });
  return opts;
}

function buildLimitBranch() {
  return {
    label: "Limit",
    children: Object.fromEntries(AXES.map(ax => [ax, {
      label: `${ax.toUpperCase()} axis`,
      children: Object.fromEntries(Object.keys(MOTOR_LABELS).map(m => [m, {
        label: MOTOR_LABELS[m],
        children: Object.fromEntries(Object.keys(LIMIT_DIRECTIONS).map(dir => [dir, { label: LIMIT_DIRECTIONS[dir] }])),
      }])),
    }])),
  };
}

/* Everything below DOES need the fetched schema: which pins Probe/Control
 * actually expose, how many User Input/Output slots exist, and each
 * spindle type's real pin set + tuning-field list. Mirrors
 * generate_role_data.py's logic exactly (that script is retired now that
 * this runs live, but its header comment has the fuller rationale for each
 * choice below if it's ever useful to consult in FluidNC-config-wizard's
 * git history). */
// Generic pin_attributes-filtered {key: {label}} children for one
// config_items.yaml section -- the shared core every flat (non-spindle,
// non-limit) role category reduces to: sweep the section's own fields for
// ones whose @pin_attributes is in `attrs` (a single value, or an array
// when a section needs the union of more than one -- e.g. sdcard mixes
// output cs_pin with input card_detect_pin, so the "either-direction"
// tree needs both), keyed with the "_pin" suffix stripped (matching every
// section's own generateDraft()/importConfig() dispatch convention,
// including probe's "pin" field -- stripPinSuffix("pin") is a no-op,
// since "pin" itself doesn't end in "_pin", so the field's own name IS
// its stripped key already). Reads CONFIG_ITEM_DOCS directly rather than
// a schema $def's properties list -- config_items.yaml already has the
// exact same field names, so there's no need to also cross-reference the
// schema just to enumerate them.
function sectionRoleChildren(docSection, attrs) {
  const attrSet = new Set(Array.isArray(attrs) ? attrs : [attrs]);
  const children = {};
  const items = CONFIG_ITEM_DOCS[docSection] || {};
  Object.keys(items).forEach(fullKey => {
    const attr = pinAttributesOf(docSection, fullKey);
    if (!attr || !attrSet.has(attr)) return;
    const key = whichForField(docSection, fullKey);
    // attr carried alongside label for the same reason buildSpindleTypes()'s
    // pin-entry tuples do -- cascadeOptionsFor() needs to know which
    // specific field is "pwm"-tagged (e.g. user_outputs.analogN_pin) to
    // filter it per-physical-pin without also dropping this section's
    // plain-output fields (e.g. that same section's digitalN_pin).
    children[key] = { label: titleLabel(key), attr };
  });
  return children;
}

// config_items.yaml top-level sections structurally excluded from the
// generic role-category scan below, for reasons that hold regardless of
// which board is loaded (a board-load-time, per-pin exclusion -- e.g.
// sdcard.cs_pin already being fixed by THIS board's own data -- is a
// separate concern, see computeBoardFixedRoles()):
const GENERIC_ROLE_SECTIONS_EXCLUDED = new Set([
  "enum_types", // not a real section -- the enum-anchor preamble config_items.yaml's own YAML anchors/aliases live under
  "spindle_sections", // not a real section either -- the flat name list SPINDLE_SECTIONS is built from (see its own declaration comment)
  "vfd_protocol_fields", // not a real section either -- the flat name list vfdProtocolFields() reads (see its own declaration comment)
  "axes", // shared_stepper_disable_pin/reset_pin -- a hardware-topology fact
          // (does this board's PCB tie multiple drivers' disable lines
          // together at all), never something a Generic-Pin role
          // assignment could retroactively create -- see
          // board.schema.json's own shared_disable_pin description.
]);

// config_items.yaml section name -> role-prefix key, ONLY for the three
// sections whose already-established role-string convention
// (generateDraft()'s dispatch, importConfig()'s claimPin() calls,
// cascadeOptionsFor()) is singular while the section name itself is
// plural. Every other section's role-prefix is just its own section
// name, no mapping needed.
const ROLE_PREFIX_OVERRIDES = { status_outputs: "status_output", user_inputs: "user_input", user_outputs: "user_output" };

// Reverse of ROLE_PREFIX_OVERRIDES -- a role's leading ":"-segment back
// to the real config_items.yaml/cfg object section name (identity for
// every section with no override entry).
function sectionForRolePrefix(prefix) {
  const entry = Object.entries(ROLE_PREFIX_OVERRIDES).find(([, p]) => p === prefix);
  return entry ? entry[0] : prefix;
}

// Top-level role prefixes (EITHER_ROLE_TREE's own keys, see loadRoleData())
// that need dispatch/import logic beyond the generic "write a pin into
// cfg[<section>][<field>], stub the section's own non-pin tuning fields"
// shape -- limit (nested under axis/motor slot, not a flat section),
// spindle (per-type field sets via SPINDLE_TYPES), user_output
// (analogN_pin's per-CHANNEL _hz companion isn't a section-wide field
// stubNonPinFields() can express), axis (writes into cfg.axes[letter]
// [slot], not cfg[<section>]). generateDraft()'s dispatch handles each
// of these in its own branch BEFORE the final generic else (see below);
// importConfig() uses this same set to exclude them from its matching
// generic import loop. Every other EITHER_ROLE_TREE key -- control/probe/
// user_input/coolant/status_output/sdcard/ethernet/i2so today --
// automatically gets the generic treatment with no need to list them by
// name here; a
// brand-new generically-scanned section (see buildGenericRoleBranches())
// picks it up for free, the same "denylist the exceptions" pattern
// GENERIC_ROLE_SECTIONS_EXCLUDED already uses one level up.
const SPECIAL_CASE_ROLE_PREFIXES = new Set(["limit", "spindle", "user_output", "axis"]);

function isGenericRoleSection(sectionName) {
  if (GENERIC_ROLE_SECTIONS_EXCLUDED.has(sectionName)) return false;
  if (sectionName.includes(".")) return false; // axes.<letter>.*, kinematics.*, extenders.* -- nested, not a flat top-level category
  if (SPINDLE_SECTIONS.has(sectionName)) return false; // spindle types -- own "Spindle" category via buildSpindleTypes(), not a flat one here
  return true;
}

// {roleKey: {label, children}} for every config_items.yaml section that
// (a) isn't structurally excluded above and (b) has at least one field
// whose @pin_attributes is in `attrs` -- e.g. buildGenericRoleBranches
// ("input") picks up control/probe/user_inputs (every field) plus
// sdcard (card_detect_pin alone, cs_pin being output-only); a section
// with nothing matching (e.g. sdcard under "output" alone would miss
// card_detect_pin, but include cs_pin) is simply omitted rather than
// added as an empty, dead category. A brand-new FluidNC feature with
// input/output-role config pins shows up here automatically -- no
// wizard change needed, unlike the hand-listed {control, probe,
// user_input}/{coolant, status_output} objects this replaced.
function buildGenericRoleBranches(attrs) {
  const branches = {};
  Object.keys(CONFIG_ITEM_DOCS).forEach(sectionName => {
    if (!isGenericRoleSection(sectionName)) return;
    const children = sectionRoleChildren(sectionName, attrs);
    if (!Object.keys(children).length) return;
    const key = ROLE_PREFIX_OVERRIDES[sectionName] || sectionName;
    branches[key] = { label: titleLabel(key), children };
  });
  return branches;
}

// Generically-scanned sections that are a real board.fixed_peripherals
// concept -- every one of their pin-typed fields (sdcard's cs/
// card_detect, ethernet's cs/int/rst, i2so's bck/data/ws/oe) is a PCB-
// design-time fact, never a spare GPIO a Generic Pin picker could
// retroactively wire up, whether this board's own data gives it a real
// pin, states it as NO_PIN, or omits the whole block entirely -- unlike
// control/probe/user_inputs/coolant/status_outputs, which are pure
// user-wiring sections with no fixed_peripherals counterpart on ANY
// board, and so are always fully user-assignable. Originally
// card_detect_pin/int_pin/rst_pin/oe_pin were treated as an exception
// (NO_PIN left them open, on the theory that an unpopulated accessory
// pin was a spare trace waiting to be wired) -- corrected once that
// turned out to be wrong even in the one case actually observed in
// practice (sdcard.card_detect_pin): the card-detect switch lives
// inside the SD SOCKET COMPONENT ITSELF, so a socket that doesn't have
// one has no signal anywhere for any GPIO to pick up, same as
// axes.shared_stepper_disable_pin/shared_reset_pin's own "never open"
// treatment (which this now matches exactly) -- and the identical
// reasoning applies to ethernet's/i2so's own chip-level accessory pins,
// even though no current board populates them to have shown the same
// bug yet. A user wanting a genuine one-off lashup (an external SPI
// Ethernet module wired to spare GPIOs, say) writes their own board
// file describing it as a real fixed fact instead. See
// computeBoardFixedRoles(), the one place this distinction matters.
//
// Populated at boot from board.schema.json's own fixed_peripherals def
// (see loadRoleData()) -- this is a hard, mechanical, zero-judgment
// structural fact (is this section's name literally a property of
// fixed_peripherals in the ONE schema that defines board.yaml's own
// shape), not something to separately guess or hand-list here. i2c is
// correctly absent because board.schema.json itself keeps i2c_connectors
// as its own top-level key, never nested under fixed_peripherals --
// confirming this via the schema directly, rather than reasoning about
// "which sections are buses," is what makes this derivation exact rather
// than a judgment call. Empty only transiently (before loadRoleData()'s
// fetch resolves) -- NOT a supported "fetch failed" state: that fetch
// deliberately throws and halts boot() rather than leaving this empty
// (see loadRoleData()'s own comment) -- a same-origin file that's part
// of this app's own deployment failing to load means the installation
// is broken, not that this one specific feature should quietly degrade.
let BOARD_FIXED_SECTIONS = new Set();

// Set of Generic-Pin ROLE PATHS (e.g. "sdcard:cs", "sdcard:card_detect")
// that are NEVER available for a user to assign via an ordinary Generic
// Pin -- consulted by isRoleClaimedByOther() so these are greyed out the
// same way an already-user-assigned role is, with no separate UI code
// path needed. EVERY pin-typed field of a BOARD_FIXED_SECTIONS section
// is blacklisted unconditionally (see that Set's own comment for why:
// PCB-design-time facts, not spare GPIOs, regardless of whether this
// board's own data gives a field a real pin, states NO_PIN, or omits the
// whole block) -- so, unlike the rest of this file's per-board state,
// this Set doesn't actually depend on which board is loaded; it's
// recomputed on every applyBoardDoc() call purely for architectural
// consistency with the rest of that function, not because the result
// would ever differ. A section that's never a fixed_peripherals concept
// at all (control, ...) isn't in BOARD_FIXED_SECTIONS, so nothing is ever
// blacklisted for it -- genuinely always user-assignable.
function computeBoardFixedRoles() {
  const fixed = new Set();
  Object.keys(CONFIG_ITEM_DOCS).forEach(sectionName => {
    if (!isGenericRoleSection(sectionName)) return;
    if (!BOARD_FIXED_SECTIONS.has(sectionName)) return;
    const items = CONFIG_ITEM_DOCS[sectionName] || {};
    Object.keys(items).forEach(fullKey => {
      if (!isPinType(sectionName, fullKey)) return;
      const key = ROLE_PREFIX_OVERRIDES[sectionName] || sectionName;
      fixed.add(`${key}:${stripPinSuffix(fullKey)}`);
    });
  });
  return fixed;
}

// Which pin_attributes values make a field reachable from an output-capable
// vs an input-capable Generic Pin. Almost every spindle pin is output/pwm,
// but PlasmaSpindle's arc_ok_pin is genuinely input (it reads the plasma
// cutter's arc-transferred signal) -- lumping every spindle pin into one
// list (as this used to) meant arc_ok_pin was only ever reachable from an
// output-capable pin (the wrong direction for what it does) and never from
// a genuinely input-only one. "io" would need both buckets if it ever
// appeared here; isr/adc/dac don't occur on any current spindle field,
// listed for forward-compat rather than guessed at. A pin field with no
// recognized pin_attributes value defaults to the output bucket, matching
// this function's pre-pin_attributes behavior of treating every pin field
// as output-assignable, rather than silently dropping it from both.
const SPINDLE_PIN_INPUT_ATTRS = new Set(["input", "isr", "adc", "io"]);
const SPINDLE_PIN_OUTPUT_ATTRS = new Set(["output", "pwm", "dac", "io"]);

function buildSpindleTypes() {
  const result = {};
  SPINDLE_SECTIONS.forEach(cfgKey => {
    const typeId = cfgKey.toLowerCase();
    const props = CONFIG_ITEM_DOCS[cfgKey] || {};
    const pins = [];
    const inputPins = [];
    const stubFields = [];
    Object.keys(props).forEach(fullKey => {
      if (!isPinType(cfgKey, fullKey)) {
        stubFields.push([fullKey, TBD]);
        return;
      }
      const key = stripPinSuffix(fullKey);
      const attr = pinAttributesOf(cfgKey, fullKey);
      // Third element carries the field's own pin_attributes tag (e.g.
      // "pwm" vs plain "output") -- every existing [key,label] consumer
      // destructures only the first two and simply ignores it, so this is
      // additive; cascadeOptionsFor() is the one place that reads it, to
      // drop a "pwm"-tagged field from a physical pin that can't actually
      // do PWM (see pinSupportsPwm()) without also dropping that same
      // type's other, plain-output fields (e.g. PWM's own direction_pin/
      // enable_pin, which any output-capable pin -- I2SO included -- can
      // still serve).
      const entry = [key, titleLabel(key), attr];
      if (!attr || SPINDLE_PIN_OUTPUT_ATTRS.has(attr)) pins.push(entry);
      if (attr && SPINDLE_PIN_INPUT_ATTRS.has(attr)) inputPins.push(entry);
    });
    result[typeId] = {
      // The real config.yaml type name (e.g. "10V", "HBridge") -- not worth
      // a separate hand-authored label map just to add cosmetic touches
      // ("0-10V", "H-Bridge") that don't help pick the right one.
      label: cfgKey,
      cfgKey,
      pins, // output/pwm-capable -- consumed by strict-output pins (cascadeOptionsFor) and, unioned with inputPins, by "either" pins (see buildOutputRoleBranches()).
      inputPins, // input-capable -- consumed by strict-input pins (see INPUT_ROLE_TREE.spindle below).
      stub: () => Object.fromEntries(stubFields),
    };
  });
  // Excluded, by NAME, because each genuinely needs different treatment,
  // not because of being forgotten: OnOff (a base class FluidNC itself
  // never instantiates directly -- Relay is the real, selectable on/off
  // type; note it still has its own real config_items.yaml section, since
  // Relay/DAC's own group() calls OnOff::group(), so "has doc coverage"
  // alone can't distinguish it), NoSpindle (not currently offered as a
  // dropdown choice), and ModbusVFD (dispatched separately via the RS485
  // role -- see generateDraft()'s allRs485Channels loop).
  const SPINDLE_TYPES_EXCLUDED = new Set(["onoff", "nospindle", "modbusvfd"]);
  // Deliberate display-order preference for the common types, most-likely
  // first -- NOT a filter (unlike an earlier version of this list, which
  // silently dropped any spindle_* type it didn't happen to name). Any
  // real type not named here still appears, just appended afterward in
  // whatever order remains -- e.g. a newly-added spindle_* class nobody's
  // updated this preference list for yet shows up somewhere rather than
  // silently vanishing from the dropdown the way a pure allowlist would.
  const ORDER_HINT = ["pwm", "laser", "10v", "relay", "dac", "besc", "hbridge", "plasmaspindle"];
  const ordered = {};
  ORDER_HINT.forEach(t => { if (result[t]) { ordered[t] = result[t]; delete result[t]; } });
  Object.keys(result).forEach(t => { if (!SPINDLE_TYPES_EXCLUDED.has(t)) ordered[t] = result[t]; });
  return ordered;
}

// Builds an all-TBD stub object from a config_items.yaml section's own field
// list, same idea as buildSpindleTypes()'s stubFields above -- lets
// OPTIONAL_SECTIONS and the ModbusVFD dispatch (below) track config_items.yaml
// instead of hand-listing their own field sets, which is exactly how the
// atc/m6_macro ModbusVFD bug happened (see generateDraft()'s ModbusVFD
// block). Requires CONFIG_ITEM_DOCS to be loaded (awaited in loadRoleData())
// -- only called from stub() closures invoked during/after generateDraft(),
// never at module-load time.
function schemaStub(sectionName, allowSet) {
  const props = CONFIG_ITEM_DOCS[sectionName] || {};
  const keys = allowSet ? Object.keys(props).filter(k => allowSet.has(k)) : Object.keys(props);
  return Object.fromEntries(keys.map(k => [k, TBD]));
}

// The 10 protocol-definition fields (model, min_RPM, max_RPM, and the 7
// Modbus command templates) a compiled-in named model (H2A, Huanyang, ...)
// supplies correct, working values for via its own C++ constructor --
// entirely independent of config.yaml (see rs485RoleOptions' own comment).
// Read straight off config_items.yaml's own vfd_protocol_fields: list (see
// build_config_docs.py's vfd_protocol_fields(), mechanically derived there
// from which fields ModbusVFD's own group() contributes directly, as
// opposed to the ones its Spindle/VFDSpindle base classes contribute) --
// not hand-listed here, for the same reason schemaStub() itself isn't: a
// hand-list could silently drift out of sync exactly the way the original
// atc/m6_macro bug did.
function vfdProtocolFields() {
  return CONFIG_ITEM_DOCS.vfd_protocol_fields || [];
}
// Key-position sentinel (like sectionSentinel()/homingSentinel()) for the
// whole group of vfdProtocolFields()'s 10 fields, under a known VFD
// model's own top-level key -- see generateDraft()'s allRs485Channels.forEach
// and vfdOverrideGroupWidgetHtml() for the full mechanism. One selector for
// the whole group, not one per field: collapsed, none of the 10 fields (or
// their names) appear in the draft at all, only this single "Override VFD
// Protocol" line; expanded, all 10 appear as ordinary open TBD fields --
// any left unanswered are simply never written to config.yaml (same
// "genuinely absent, not an empty placeholder" idea as OPTIONAL_SECTIONS),
// so there's no need for a second, per-field layer of hiding on top.
function vfdOverrideSentinel(topKey) { return `VFDOVERRIDE_${topKey}`; }
// topKey (e.g. "H2A") -> bool, defaults to false (collapsed) if unset --
// same convention as sectionEnabled/homingEnabled.
let vfdOverrideEnabled = {};
let INPUT_ROLE_TREE, SPINDLE_TYPES, EITHER_ROLE_TREE, GENERIC_ROLE_TREE_OUTPUT_KEYS;

async function loadRoleData() {
  // BOARD_FIXED_SECTIONS -- see its own declaration comment for why this
  // is a hard structural fact (fixed_peripherals' own property names)
  // rather than a judgment call. board.schema.json is otherwise never
  // fetched at runtime (every other board.yaml-shape assumption in this
  // file is ordinary hardcoded property access, see applyBoardDoc()) --
  // this is the one place a specific structural fact about board.yaml's
  // own shape needs to be read live rather than hand-copied, to keep it
  // in lockstep with board.schema.json instead of silently drifting the
  // next time a fixed_peripherals property is added or removed there.
  // Deliberately NOT graceful-degradation here (unlike CONFIG_ITEM_DOCS/
  // isPinType() elsewhere in this file, where absence is a genuinely
  // expected, normal state -- a board with no hotspots file, say):
  // board.schema.json is a same-origin static file that ships as part of
  // this app's own deployment, so it failing to fetch or parse isn't
  // "optional data happens to be missing," it's a sign the installation
  // itself is broken -- which means there's no reason to trust any OTHER
  // file loaded the same way either. fetchYamlText() (not the Optional
  // variant) and no local try/catch, so a failure here throws and
  // propagates to boot()'s existing catch (same one
  // fluidnc-config-schema.json's own fetch above already relies on),
  // which halts startup with a visible error instead of silently
  // proceeding with an empty BOARD_FIXED_SECTIONS -- the real, observed
  // failure mode of the old graceful-degrade version: cs_pin and every
  // other board-fixed accessory pin would incorrectly become
  // Generic-Pin-selectable rather than the page visibly refusing to load.
  const boardSchemaText = await fetchYamlText("schema/board.schema.json");
  const boardSchema = JSON.parse(boardSchemaText);
  const fpDefName = boardSchema.properties.fixed_peripherals.$ref.split("/").pop();
  BOARD_FIXED_SECTIONS = new Set(Object.keys(boardSchema.$defs[fpDefName].properties || {}));

  // Loaded here, before the tree-building calls below, specifically so
  // isPinType() (config_items.yaml's own @config type: pin -- the
  // authoritative signal, not a "_pin" naming-convention guess) has real
  // data to check against. Same graceful-degradation contract as before:
  // CONFIG_ITEM_DOCS defaults to {}, so a fetch failure here just means
  // every isPinType() call returns false (falls back to non-pin/stub-field
  // treatment) rather than throwing -- a real, temporary degradation of the
  // wizard's structure (not just tooltips, now), which is the accepted
  // tradeoff for not hand-duplicating pin-ness as a second, driftable
  // signal (see interrupt0-3's own known gap in config_items.yaml -- the
  // one case where this genuinely is less complete than the schema's own
  // $ref-based pin typing was).
  await loadConfigItemDocs();
  SPINDLE_SECTIONS = new Set(CONFIG_ITEM_DOCS.spindle_sections || []);

  INPUT_ROLE_TREE = {
    limit: buildLimitBranch(),
    ...buildGenericRoleBranches("input"),
  };
  SPINDLE_TYPES = buildSpindleTypes();
  // Strict-input pins only ever see a spindle type's input-capable pins
  // (currently just PlasmaSpindle's arc_ok_pin) -- added only once
  // SPINDLE_TYPES exists, and only if at least one type actually has one,
  // so this doesn't add an always-empty "Spindle" category otherwise.
  const inputSpindleChildren = spindleRoleChildren(def => def.inputPins);
  if (Object.keys(inputSpindleChildren).length) {
    INPUT_ROLE_TREE.spindle = { label: "Spindle", children: inputSpindleChildren };
  }
  // Keys of every generically-scanned section reachable from the OUTPUT
  // side (coolant/status_output/sdcard/user_outputs today) -- shared by
  // outputCategoryOptions()/cascadeOptionsFor() (the flat picker strict-
  // output pins use) and buildOutputRoleBranches() (the tree "either"
  // pins use) below, so the two pickers can never disagree about which
  // generic sections are output-reachable. "pwm", not just "output", so
  // user_outputs.analogN_pin (pin_attributes: pwm) is picked up alongside
  // digitalN_pin (pin_attributes: output) -- the only other non-excluded,
  // non-dotted, non-spindle-type section with a pwm-tagged field is a
  // spindle type itself, already handled separately above.
  GENERIC_ROLE_TREE_OUTPUT_KEYS = Object.keys(buildGenericRoleBranches(["output", "pwm"]));
  // "either" generic_pins (a bare, uncommitted GPIO usable as EITHER a
  // plain input OR a plain output -- see board.schema.json's own
  // "direction" description) need BOTH role spaces in one picker, not just
  // the input tree makeInputRow was previously always given regardless of
  // direction. Reuses makeInputRow's existing generic N-level cascading
  // renderer (and refreshRoleUniqueness()'s tree-walking uniqueness check)
  // for the output side too, via buildOutputRoleBranches() reshaping the
  // same category/cascade data makeOutputRow itself uses into the
  // {label, children} tree shape makeInputRow expects -- rather than
  // building a second, parallel UI widget and uniqueness-checking path
  // just for these pins. Note this is NOT a plain Object.assign(INPUT_ROLE_TREE,
  // buildOutputRoleBranches()) -- a section reachable from BOTH directions
  // (spindle's PlasmaSpindle, sdcard) needs the UNION of its input and
  // output children here, which buildOutputRoleBranches() computes
  // directly (via ["input","output"] on the generic portion, and
  // pins.concat(inputPins) for spindle) rather than relying on a shallow
  // merge to combine two separately-built halves.
  EITHER_ROLE_TREE = Object.assign({}, INPUT_ROLE_TREE, buildOutputRoleBranches());

  await loadModuleCatalog();
}

// id -> parsed modules/<id>.module.yaml (see schema/module.schema.json).
// Board-independent, like INPUT_ROLE_TREE/SPINDLE_TYPES, so loaded once
// here rather than per-board. Graceful degradation throughout, same
// philosophy as loadConfigItemDocs()/chipGpioCaps: a missing/unparseable
// catalog or individual module file just means module sockets have no
// (or fewer) module choices available -- never a hard error, since this
// entire feature is additive on top of the wizard's core function.
let MODULE_CATALOG = {};
let MODULE_HOTSPOT_CATALOG = {}; // moduleId -> parsed hotspots YAML, or null

async function loadModuleCatalog() {
  MODULE_CATALOG = {};
  MODULE_HOTSPOT_CATALOG = {};
  const indexText = await fetchYamlTextOptional("modules/index.json");
  if (!indexText) return;
  let ids;
  try {
    ids = JSON.parse(indexText);
  } catch (e) {
    console.warn(`Couldn't parse modules/index.json (${e.message}); module sockets will have no module choices.`);
    return;
  }
  for (const id of ids) {
    const text = await fetchYamlTextOptional(`modules/${id}.module.yaml`);
    if (!text) { console.warn(`Couldn't fetch modules/${id}.module.yaml, skipping.`); continue; }
    try {
      const doc = jsyaml.load(text);
      if (doc && doc.module && doc.module.id) MODULE_CATALOG[doc.module.id] = doc;
      else console.warn(`modules/${id}.module.yaml has no module.id, skipping.`);
    } catch (e) {
      console.warn(`Couldn't parse modules/${id}.module.yaml (${e.message}), skipping.`);
    }
    const htext = await fetchYamlTextOptional(`hotspots/${id}_module.hotspots.yaml`);
    MODULE_HOTSPOT_CATALOG[id] = htext ? jsyaml.load(htext) : null;
  }
}

/* Does every module_pin this module's own connectors reference actually
 * exist on the given socket? A module with a "*" wildcard connector (see
 * modules/passthrough.module.yaml) always fits, any socket size -- it
 * adapts to however many pins the socket has rather than requiring
 * specific ones. Used to filter the module-choice dropdown so a socket
 * only ever offers modules it can actually accommodate. */
function moduleFitsSocket(mod, socket) {
  const pinNums = new Set((socket.pins || []).map(p => p.module_pin));
  const refs = [];
  let hasWildcard = false;
  (mod.generic_pins || []).forEach(gp => {
    if (gp.module_pin === "*") hasWildcard = true;
    else refs.push(gp.module_pin);
  });
  (mod.expansion_uarts || []).forEach(eu => refs.push(eu.txd_pin, eu.rxd_pin));
  (mod.rs485_channels || []).forEach(rc => {
    refs.push(rc.tx_pin, rc.rx_pin);
    if (rc.rts_pin) refs.push(rc.rts_pin);
  });
  if (hasWildcard) return true;
  return refs.every(r => pinNums.has(r));
}

/* Resolves a module's own module_pin-addressed connectors (generic_pins /
 * expansion_uarts / rs485_channels -- see schema/module.schema.json)
 * against a specific board socket's real mcu_pin list, producing a flat
 * array of connector descriptors shaped so renderResources()/
 * computeResourcePins()/generateDraft() can render/bind/dispatch them
 * exactly like a board's own directly-wired generic_pins/expansion_uarts/
 * rs485_channels entries -- the only difference from a board fact is where
 * the mcu_pin came from. Returns null if no module (or an unrecognized
 * module id) is assigned to this socket -- callers should treat that the
 * same as "socket has no connectors right now", not an error.
 *
 * The "*" wildcard generic_pins connector (modules/passthrough.module.yaml)
 * is a TEMPLATE, not a literal connector -- expanded here into one
 * independent connector per pin the socket actually has, in socket-pin
 * order, each inheriting the template's direction/profiles unchanged. */
function resolveModuleSocketConnectors(socket, moduleId) {
  if (!moduleId || moduleId === "unused") return null;
  const mod = MODULE_CATALOG[moduleId];
  if (!mod) return null;
  const socketPins = socket.pins || [];
  const pinByModulePin = {};
  socketPins.forEach(p => { pinByModulePin[p.module_pin] = p; });
  const out = [];

  (mod.generic_pins || []).forEach(gp => {
    if (gp.module_pin === "*") {
      socketPins.forEach(sp => {
        out.push({
          kind: "generic_pin",
          label: `${gp.label} ${sp.module_pin}`,
          generic_name: `${gp.generic_name || gp.label}${sp.module_pin}`,
          mcu_pin: sp.mcu_pin,
          direction: gp.direction,
        });
      });
      return;
    }
    const sp = pinByModulePin[gp.module_pin];
    if (!sp) return; // module needs a pin this socket doesn't have -- shouldn't happen if moduleFitsSocket() gated the choice, but degrade gracefully rather than throw
    out.push({
      kind: "generic_pin",
      label: gp.label,
      generic_name: gp.generic_name || gp.label,
      mcu_pin: sp.mcu_pin,
      direction: gp.direction,
    });
  });

  (mod.expansion_uarts || []).forEach(eu => {
    const txp = pinByModulePin[eu.txd_pin], rxp = pinByModulePin[eu.rxd_pin];
    if (!txp || !rxp) return;
    out.push({
      kind: "expansion_uart",
      label: eu.label,
      generic_name: eu.generic_name || eu.label,
      txd_pin: txp.mcu_pin,
      rxd_pin: rxp.mcu_pin,
      baud: eu.baud,
      mode: eu.mode,
      connector_type: eu.connector_type,
    });
  });

  (mod.rs485_channels || []).forEach(rc => {
    const txp = pinByModulePin[rc.tx_pin], rxp = pinByModulePin[rc.rx_pin];
    if (!txp || !rxp) return;
    const rtsp = rc.rts_pin ? pinByModulePin[rc.rts_pin] : null;
    out.push({
      kind: "rs485_channel",
      label: rc.label,
      generic_name: rc.generic_name || rc.label,
      tx_pin: txp.mcu_pin,
      rx_pin: rxp.mcu_pin,
      rts_pin: rtsp ? rtsp.mcu_pin : undefined,
    });
  });

  return out;
}

/* Every currently-resolved module-socket connector across the whole board,
 * flattened with the resourceKeyModConn() each is bound under -- the one
 * place computeResourcePins()/renderResources()/generateDraft() all walk
 * from, so the three stay in lockstep by construction rather than each
 * re-deriving the same si/ci bookkeeping independently. */
function allModuleSocketConnectors() {
  const out = [];
  (board.expansion_sockets || []).forEach((s, si) => {
    const moduleId = bindings[resourceKeyModuleSocket(si)];
    const connectors = resolveModuleSocketConnectors(s, moduleId);
    (connectors || []).forEach((c, ci) => out.push({
      si,
      ci,
      socket: s,
      key: resourceKeyModConn(si, ci),
      connector: c,
      moduleId,
      moduleName: moduleId && MODULE_CATALOG[moduleId] ? MODULE_CATALOG[moduleId].module.name : undefined,
    }));
  });
  return out;
}

/* Reshapes outputCategoryOptions()/cascadeOptionsFor()'s primary/secondary
 * category data into the {label, children} tree shape makeInputRow()
 * expects, so "either" pins (see EITHER_ROLE_TREE above) can offer the
 * exact same output roles makeOutputRow's own 2-step picker does, through
 * one shared tree-walking renderer. Leaf role strings this produces are
 * identical to the ones makeOutputRow already writes to bindings[] --
 * "spindle:<type>:<which>", "coolant:flood"/"coolant:mist",
 * "user_output:digital<n>", "user_output:analog<n>", "status_output:<which>" --
 * so generateDraft()'s role-dispatch switch needs no changes at all; both
 * UIs are just two different pickers writing into the same string space. */
// {typeId: {label, children}} for a spindle-role tree, from whichever of
// each type's own pin lists pickPins selects out of SPINDLE_TYPES (see
// buildSpindleTypes()'s pins/inputPins split) -- shared by the two tree
// contexts that need a spindle branch: strict-input pins (inputPins alone)
// and "either" pins (pins+inputPins together, below -- an either-capable
// physical pin can supply BOTH directions, so it should see the full set,
// unlike strict-output pins, which get output-only pins straight from
// SPINDLE_TYPES[type].pins via cascadeOptionsFor(), no tree involved).
// Types with no matching pins (e.g. arc_ok_pin-less types when only
// inputPins is selected) are skipped entirely rather than left as an empty
// branch.
function spindleRoleChildren(pickPins) {
  const children = {};
  Object.keys(SPINDLE_TYPES).forEach(t => {
    const def = SPINDLE_TYPES[t];
    const list = pickPins(def);
    if (!list.length) return;
    children[t] = { label: def.label, children: Object.fromEntries(list.map(([which, label]) => [which, { label }])) };
  });
  return children;
}

function buildOutputRoleBranches() {
  return {
    spindle: { label: "Spindle", children: spindleRoleChildren(def => def.pins.concat(def.inputPins)) },
    // ["input","output","pwm"], not "output" alone -- a section reachable
    // from an input-capable pin too (sdcard: cs_pin is output-only, but
    // card_detect_pin is input-only, same mixed shape as PlasmaSpindle's
    // arc_ok_pin above) needs the UNION here, since this object's keys
    // OVERWRITE INPUT_ROLE_TREE's same-named keys entirely in the
    // Object.assign() that builds EITHER_ROLE_TREE (see loadRoleData()) --
    // a plain "output" scan here would silently lose card_detect_pin's
    // reachability for "either"-direction pins the way it did before this
    // was fixed for spindle above. "pwm" picks up user_outputs.analogN_pin
    // (pin_attributes: pwm) alongside digitalN_pin (output) -- no more
    // special-cased digital_output/analog_output branches here; both fold
    // into this generic scan's own "user_output" category (see
    // ROLE_PREFIX_OVERRIDES) the same way coolant/status_output/sdcard do.
    ...buildGenericRoleBranches(["input", "output", "pwm"]),
    // Reuses MOTOR_ROLE_TREE by reference for both branches (it's read-only
    // here, never mutated by the tree walker) -- keeps this in lockstep with
    // Motor sockets' own axis/motor-slot vocabulary automatically, same
    // leaf-path shape ("axis:rc_servo:x:motor0") the flat makeOutputRow
    // picker produces via outputCategoryOptions()/axisMotorSlotOptions().
    axis: {
      label: "Axis",
      children: {
        rc_servo: { label: "RC Servo", children: MOTOR_ROLE_TREE },
        solenoid: { label: "Solenoid", children: MOTOR_ROLE_TREE },
      },
    },
  };
}

// Config-item hover-tooltip text, sourced from FluidNC's own generated
// docs/config_items.yaml (see FluidNC/tools/build_config_docs.py upstream --
// produced from // @config / @default annotations next to each
// handler.item(...) call, so it's authoritative, not hand-maintained here).
// Purely a presentation enhancement: every lookup below degrades to "no
// tooltip" (never an error) if this fetch fails or a given key isn't found,
// so the wizard's core function never depends on it.
let CONFIG_ITEM_DOCS = {}; // sectionName -> { itemKey -> {description, default, type, tuning?, default_note?} }

// Which of CONFIG_ITEM_DOCS' own top-level keys are spindle types -- read
// straight off config_items.yaml's own spindle_sections: list (see
// build_config_docs.py's SPINDLE_SECTIONS, mechanically derived there from
// which SECTIONS entries' contributors live under Spindles/) rather than
// fluidnc-config-schema.json's now-retired "spindle_" $def-name prefix
// convention. Populated by loadConfigItemDocs(), same lifecycle as
// CONFIG_ITEM_DOCS itself -- empty (never matches) until that resolves.
let SPINDLE_SECTIONS = new Set();

// True once CONFIG_ITEM_DOCS has been loaded from a source that actually
// carries @tuning data (see FluidNC/src/Configuration/ItemDocs.md) --
// i.e. NOT a pre-migration release's config_items.yaml. configDocSpecFor()
// itself degrades silently regardless (a missing `tuning` on one item just
// means that one item falls back to specForKey()'s own guess, same as
// always); this flag exists so loadConfigItemDocs() below can log what it
// actually decided.
let configDocsHaveTuningData = false;

// Pure predicate, no side effects -- true iff ANY item anywhere in a parsed
// config_items.yaml carries a `tuning` field. Used to test both the fetched
// latest-release copy and the local fallback copy with the same logic.
function configDocsHaveTuning(parsed) {
  return Object.values(parsed).some(
    section => section && typeof section === "object" &&
      Object.values(section).some(item => item && typeof item === "object" && item.tuning !== undefined)
  );
}

// bdring/fluidnc-releases mirrors each GitHub release's files as plain
// raw-served content specifically so browser JS can fetch them cross-origin
// -- a real GitHub Release asset/tag download does NOT send CORS headers,
// but raw.githubusercontent.com does. Same two-step pattern (ask the GitHub
// API which tag is latest, then fetch that tag's mirrored file) used by
// fluid-installer-breiler's GithubService.getReleaseManifest() against the
// same mirror repo -- confirmed against that project's actual source rather
// than guessed. releases/latest (not the full releases list) is enough here
// since the wizard only ever wants the single newest published release, not
// a version picker.
const FLUIDNC_LATEST_RELEASE_API = "https://api.github.com/repos/bdring/FluidNC/releases/latest";
const FLUIDNC_RELEASES_RAW_BASE = "https://raw.githubusercontent.com/bdring/fluidnc-releases/main/releases";

// Fetches the latest published FluidNC release's own docs/config_items.yaml
// text, or null on ANY failure (offline, rate-limited, release predates
// build-release.py generating this file, CORS hiccup, ...) -- always a soft
// miss, same "never blocks the wizard's core function" policy as every
// other optional fetch here. Never throws.
async function fetchLatestReleaseConfigItemDocsText() {
  try {
    const relResp = await fetch(FLUIDNC_LATEST_RELEASE_API, { headers: { Accept: "application/json" } });
    if (!relResp.ok) return null;
    const release = await relResp.json();
    const tag = release && release.tag_name;
    if (!tag) return null;
    const fileResp = await fetch(`${FLUIDNC_RELEASES_RAW_BASE}/${tag}/docs/config_items.yaml`);
    if (!fileResp.ok) return null;
    return await fileResp.text();
  } catch (e) {
    return null;
  }
}

// Tries the latest real FluidNC release's own config_items.yaml first (the
// eventual, authoritative source -- see fetchLatestReleaseConfigItemDocsText()
// above); falls back to this repo's local schema/config_items.yaml copy
// whenever the release copy is unreachable, unparseable, OR simply
// pre-dates the @tuning/@default_note migration (checked via
// configDocsHaveTuning() -- as of this writing the latest published
// release's copy predates it, so this fallback is the live, expected path
// today, not a rare edge case). The local copy is presumed kept current by
// whoever maintains this repo; per explicit direction, an equally-stale
// local copy still gets used (nothing else to fall back to) but is flagged
// loudly rather than silently trusted.
async function loadConfigItemDocs() {
  const releaseText = await fetchLatestReleaseConfigItemDocsText();
  if (releaseText) {
    try {
