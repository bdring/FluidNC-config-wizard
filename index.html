      const parsed = jsyaml.load(releaseText);
      if (parsed && typeof parsed === "object" && configDocsHaveTuning(parsed)) {
        CONFIG_ITEM_DOCS = parsed;
        configDocsHaveTuningData = true;
        return;
      }
      console.warn(
        "The latest published FluidNC release's config_items.yaml predates the @tuning/" +
        "@default_note migration (see FluidNC/src/Configuration/ItemDocs.md) -- falling back to " +
        "this repo's local schema/config_items.yaml copy until a new release ships the annotated " +
        "file."
      );
    } catch (e) {
      console.warn("Couldn't parse the latest release's config_items.yaml -- falling back to the local copy.", e);
    }
  }

  const text = await fetchYamlTextOptional("schema/config_items.yaml");
  if (!text) return;
  try {
    const parsed = jsyaml.load(text);
    if (parsed && typeof parsed === "object") {
      CONFIG_ITEM_DOCS = parsed;
      configDocsHaveTuningData = configDocsHaveTuning(parsed);
      if (!configDocsHaveTuningData) {
        console.warn(
          "schema/config_items.yaml (local fallback) ALSO has no @tuning data on any item -- every " +
          "field silently falls back to specForKey()'s generic {type: \"text\"} guess: no field " +
          "auto-fills, and every field renders as a plain text box instead of its real enum/number " +
          "widget shape (specForKey() has carried no per-field data since shapeForDocType() took " +
          "over deriving shape from config_items.yaml's own type/values). Re-sync this file from a " +
          "FluidNC release/build that includes the migration."
        );
      }
    }
  } catch (e) {
    console.warn("Couldn't parse schema/config_items.yaml -- config-item tooltips will be unavailable.", e);
  }
}

// Maps a WIZARD-internal dotted path (as built by generateDraft()'s cfg
// object, e.g. "axes.x.motor0.tmc_2209") to the matching SECTION key
// config_items.yaml itself uses (e.g. "axes.<letter>.motorN.tmc_2209") --
// the doc file uses literal placeholder segments for anything that varies
// per-instance (axis letter, motor slot number, uart/uart_channel number),
// while the wizard's own paths naturally contain the real, current value at
// generateDraft() time. Spindle section names (PWM/Laser/BESC/HBridge/
// OnOff/PlasmaSpindle/ModbusVFD) need no translation at all -- they already
// match verbatim, since SPINDLE_TYPES' cfgKey values come directly from the
// same schema $defs the doc generator's own C++ source annotations target.
function docSectionForPath(path) {
  if (!path) return "(top-level machine items)";
  // VFDOVERRIDE_<topKey> (see vfdOverrideSentinel()) is elided outright,
  // not translated -- unlike HOMINGSELECT_/SECTIONSELECT_/KINSELECT below,
  // it doesn't correspond to any real nesting level in config.yaml at all
  // (a known model's protocol fields, once resolved, are direct siblings
  // of tool_num/uart_num/etc., not nested under this group's own key --
  // see generateDraft()'s resolve-step), so "H2A.VFDOVERRIDE_H2A.min_RPM"
  // needs to resolve exactly like "H2A.min_RPM" would.
  const segs = path.split(".").filter(seg => !/^VFDOVERRIDE_/.test(seg));
  segs.forEach((seg, i) => {
    // A known VFD model's own top-level key (H2A, Huanyang, ...) -- see
    // rs485RoleOptions' own comment -- carries the same config_items.yaml
    // section ("ModbusVFD") as the generic key; config_items.yaml has no
    // separate per-model section of its own (gen_config_docs.py sections
    // by C++ class, and every named model shares ModbusVFD's own group()).
    if (i === 0 && VFD_MODELS.includes(seg)) { segs[i] = "ModbusVFD"; return; }
    if (i === 1 && segs[0] === "axes" && AXES.includes(seg)) { segs[i] = "<letter>"; return; }
    if (i === 2 && segs[0] === "axes" && /^motor[01]$/.test(seg)) { segs[i] = "motorN"; return; }
    // HOMINGSELECT_<letter>/KINSELECT/SECTIONSELECT_<key> are the wizard's
    // own internal sentinel KEYS (see homingSentinel()/sectionSentinel(),
    // and cfg.kinematics = { KINSELECT: ... } in generateDraft()) -- they
    // sit in `cfg` (and therefore in collectAndInjectSlots()'s path
    // tracking) exactly where the real key belongs, but aren't real key
    // names themselves; translate back to what config_items.yaml expects.
    if (/^HOMINGSELECT_[a-z]+$/.test(seg)) { segs[i] = "homing"; return; }
    if (seg === "KINSELECT") { segs[i] = kinematicsType; return; }
    const sectionMatch = seg.match(/^SECTIONSELECT_([a-z_]+)$/);
    if (sectionMatch) { segs[i] = sectionMatch[1]; return; }
    if (/^uart\d+$/.test(seg)) { segs[i] = "uartN"; return; }
    if (/^uart_channel\d+$/.test(seg)) { segs[i] = "uart_channelN"; return; }
  });
  return segs.join(".");
}

// parentPath/key split from a full dotted path (paramSlots/pinSlots/
// keySlots entries all store the FULL path, e.g. "axes.x.motor0.run_amps",
// same convention throughout this file) -- reconstructs the parentPath
// collectAndInjectSlots() originally had before appending ".key", without
// needing every call site to also stash it separately.
function parentPathOf(fullPath, key) {
  return fullPath.length > key.length ? fullPath.slice(0, -(key.length + 1)) : "";
}

// Returns tooltip-ready text ("description" alone, or with a trailing
// "Default: X" line when the doc records one) for a field at the given
// WIZARD path, or null if this key isn't documented (an unannotated field,
// a wizard-internal structural key with no config_items.yaml entry of its
// own, or the docs simply didn't load) -- always a soft miss, never an
// error, per this feature's whole "presentation enhancement only" premise.
function lookupItemDoc(parentPath, key) {
  const section = CONFIG_ITEM_DOCS[docSectionForPath(parentPath)];
  const item = section && section[key];
  if (!item || !item.description) return null;
  const desc = item.description.trim();
  return item.default !== undefined ? `${desc}\n\nDefault: ${item.default}` : desc;
}

// config_items.yaml's own reserved @default sentinel (see ItemDocs.md) for
// "no fixed literal exists" (board-dependent, code-substituted, ...) --
// never a value worth pre-filling or offering as a "def" button target.
const NO_LITERAL_DEFAULT = "(none)";

// @default's raw text is always either a bare literal (255, true, NO_PIN,
// z, 8N1, ...) or, for a string/macro-typed field, that same literal
// wrapped in its own literal quote characters (e.g. '""', '"None"') --
// see ItemDocs.md's @default convention, which requires @default to look
// exactly like the real config.yaml value would. This strips exactly that
// one layer of quoting when present; every other type's default is already
// bare and passes through unchanged. Deliberately keyed off the STRING'S
// OWN shape rather than an enumerated list of "which config_items.yaml
// type: values are quoted" -- a few C++ types whose value is nonetheless
// expressed as quoted-string syntax (e.g. speed_map's std::vector, still
// written as "") would otherwise need special-casing here too.
function coerceConfigDocDefault(rawDefault, docType) {
  if (rawDefault === undefined || rawDefault === NO_LITERAL_DEFAULT) return undefined;
  if (docType === "boolean") return rawDefault === "true";
  if (docType === "integer" || docType === "float") {
    const n = Number(rawDefault);
    return Number.isNaN(n) ? undefined : n;
  }
  const m = /^"(.*)"$/.exec(rawDefault);
  return m ? m[1] : rawDefault;
}

/* Section-scoped @tuning/@default lookup -- the source-of-truth counterpart
 * to specForKey()'s hand-maintained per-field-NAME guess. Resolved by PATH
 * (via docSectionForPath(), same section-resolution lookupItemDoc() already
 * uses for tooltips), which is what lets this correctly distinguish e.g.
 * BESC's min_pulse_us from RcServo's, or status_outputs' report_interval_ms
 * from uart_channel's -- the exact bare-name collisions specForKey() alone
 * could never resolve (see TUNING_CLASSIFICATION_REVIEW.md). Returns null
 * when config_items.yaml has nothing for this exact item (not yet
 * annotated with @tuning, this section not covered, or the docs fetch
 * failed) -- callers fall back entirely to specForKey()'s own guess in that
 * case, so an unannotated field behaves exactly as it did before this
 * lookup existed. */
function configDocSpecFor(parentPath, key) {
  const section = CONFIG_ITEM_DOCS[docSectionForPath(parentPath)];
  const item = section && section[key];
  if (!item) return null;
  return {
    type: item.type || null,
    values: item.values || null,
    tuning: item.tuning || null,
    default: coerceConfigDocDefault(item.default, item.type),
  };
}

// Which of a config_items.yaml SECTION's own fields carry a @tuning tag --
// used to filter a schema $def's property list down to just the fields
// worth offering as a wizard tuning slot, without a separate hand-authored
// allowlist. Used only by the ModbusVFD dispatch in generateDraft() (every
// other spindle type's stub, via buildSpindleTypes(), already includes
// every non-pin schema field with no filtering needed at all -- ModbusVFD's
// $def uniquely also carries protocol/connection detail like debug/
// poll_ms/cw_cmd that config_items.yaml correctly leaves untagged).
function tuningFieldNames(docSection) {
  const items = CONFIG_ITEM_DOCS[docSection] || {};
  return new Set(Object.keys(items).filter(k => items[k] && items[k].tuning));
}

// Whether a field is pin-typed, per config_items.yaml's own @config
// type: pin annotation -- the authoritative signal (mechanically derived
// from the real C++ Pin/InputPin/EventPin member type), used in place of
// the "_pin" naming-convention guess the role-tree builders used to make.
// The naming convention is NOT reliable: extenders.pinextenderN's
// interrupt0-3 fields are genuinely pin-typed (confirmed against the
// schema's own $ref: pinAny) but aren't "_pin"-suffixed at all -- and,
// going the other direction, config_items.yaml doesn't yet resolve THEIR
// type either (gen_config_docs.py can't follow the nested
// _isrData[0]._pin struct-array member access -- a known, accepted gap,
// see gen_config_docs.py's own comments), so those 4 fields fall back to
// non-pin treatment here until that's separately fixed. Requires
// CONFIG_ITEM_DOCS to be loaded -- loadRoleData() now awaits
// loadConfigItemDocs() before calling any of the tree-building functions
// that use this, specifically to make that true.
function isPinType(docSection, key) {
  const item = CONFIG_ITEM_DOCS[docSection] && CONFIG_ITEM_DOCS[docSection][key];
  return !!item && item.type === "pin";
}

// Stubs every one of docSection's own non-pin fields (its real "tuning"
// settings -- booleans, intervals, delays, with no pin/resource of their
// own to bind) as an open TBD in obj, the moment the section becomes
// relevant (i.e. right after a first pin gets bound to it) -- matches the
// schema's own "an all-default block is equivalent to omitting the
// section" description, and only sets fields not already present, so
// binding a second pin to the same section never resets a value the user
// already typed in. configDocSpecFor() picks up each one's real @default/
// @tuning from config_items.yaml once stubbed here, same as any other
// field. Only safe for a FLAT section whose non-pin fields are single,
// section-wide settings, not per-index companions of a specific pin (e.g.
// user_outputs.analogN_hz, which must stay tied to whichever channel N
// actually got a pin, so it keeps its own bespoke stub instead).
function stubNonPinFields(obj, docSection) {
  const items = CONFIG_ITEM_DOCS[docSection] || {};
  Object.keys(items).forEach(k => {
    if (isPinType(docSection, k)) return;
    if (obj[k] === undefined) obj[k] = TBD;
  });
}

// A pin-typed field's own @pin_attributes value (see FluidNC's ItemDocs.md)
// -- input/output/io/pwm/isr/adc/dac for an ordinary GPIO-style field
// matched against a board's generic-pin role selector, or spi/i2s/uart/i2c
// for a field that IS one of that bus's own native signal lines instead.
// null if the field isn't pin-typed, or (a handful of older releases'
// config_items.yaml) doesn't carry this tag yet -- callers should treat
// that the same as "doesn't match," not throw.
function pinAttributesOf(docSection, key) {
  const item = CONFIG_ITEM_DOCS[docSection] && CONFIG_ITEM_DOCS[docSection][key];
  return (item && item.type === "pin" && item.pin_attributes) || null;
}

// A section's own bare "pin" field (probe's own "pin", not a
// "<name>_pin"-suffixed one -- see isPinType/config_items.yaml) strips
// down to the section's own role key (e.g. "probe") instead of the
// literal, undescriptive "pin" -- otherwise identical to
// stripPinSuffix(). The one forward-direction transform every generic
// section's role-tree/import field-to-role mapping goes through.
function whichForField(docSection, field) {
  if (field === "pin") return ROLE_PREFIX_OVERRIDES[docSection] || docSection;
  return stripPinSuffix(field);
}
// Reverse of whichForField() -- reconstructs the real config_items.yaml
// field name from a role's "which" segment. Only ever reconstructs the
// bare "pin" field in the one case whichForField() itself produces it
// (which equals this section's own role key AND the section genuinely
// has a literal "pin" field, e.g. probe); every other section's fields
// all end in "_pin", so this is a plain "<which>_pin" reconstruction.
function pinFieldForWhich(docSection, which) {
  const ownKey = ROLE_PREFIX_OVERRIDES[docSection] || docSection;
  if (which === ownKey && isPinType(docSection, "pin")) return "pin";
  return `${which}_pin`;
}

/* Widget SHAPE (type/enum-options) derived mechanically from config_items.yaml's
 * own type/values -- the source-of-truth counterpart to specForKey()'s
 * hand-maintained per-NAME guess, viable now that Phase A (gen_config_docs.py)
 * closed the type-inference gaps that used to leave many fields as
 * type: unknown or an enum with no captured values list. Plain "true"/
 * "false" is used for every boolean -- config_items.yaml's own hover
 * tooltip (see lookupItemDoc()) is where a field-specific explanation
 * belongs, not the option label itself. The remaining irreducible residue
 * is a couple of text-shaped types with a real syntax template worth
 * showing as a placeholder even before any real default is known
 * (TEXT_TYPE_PLACEHOLDERS) -- a real per-field default, when
 * config_items.yaml has one, always wins over these via resolveFieldSpec()
 * below regardless. */
const BOOLEAN_OPTIONS_GENERIC = [["true", "true"], ["false", "false"]];
const TEXT_TYPE_PLACEHOLDERS = {
  uart_mode: "8N1",
  "std::vector<float>": "0.0 0.0 0.0",
  "std::vector<Configuration::speedEntry>": "0=0% 100=100%",
};
// Fields whose real widget shape is a constrained enum even though
// config_items.yaml's own type is plain "integer" -- the legal-value SET
// (not just a min/max range) is a hardware/firmware constraint enforced by
// runtime validation in the driver's own code, not expressed via the
// EnumItem-array item() overload the way axis/run_mode/message_level/etc.
// genuinely are -- config_items.yaml has no way to carry this. Confirmed:
// microsteps is the only field across the whole tree where the previous
// hand-authored specForKey() offered an enum but config_items.yaml's type
// alone can't reproduce it (found by diffing specForKey() against
// shapeForDocType() for every documented field).
const NUMERIC_ENUM_OVERRIDES = {
  microsteps: [1, 2, 4, 8, 16, 32, 64, 128, 256].map(n => [String(n), String(n)]),
};
function shapeForDocType(key, docType, docValues) {
  if (NUMERIC_ENUM_OVERRIDES[key]) {
    return { type: "enum", options: NUMERIC_ENUM_OVERRIDES[key] };
  }
  if (docType === "boolean") {
    return { type: "enum", options: BOOLEAN_OPTIONS_GENERIC };
  }
  if (docType === "enum" && docValues && docValues.length) {
    // String(v) -- config_items.yaml's own enum values are whatever
    // literal type the source's EnumItem array uses (i2so.min_pulse_us's
    // are genuinely numeric: [1, 2, 4]), but option values/labels and
    // paramValues[] comparisons throughout this file are string-typed
    // (see paramWidgetHtml's `cur = String(paramValues[slot.path])`) --
    // a bare numeric value here would both crash escapeHtml() (expects
    // a string) and never match `cur` on reimport.
    return { type: "enum", options: docValues.map(v => [String(v), String(v)]) };
  }
  if (docType === "axis") {
    return { type: "enum", options: AXES.map(a => [a, a]) };
  }
  if (docType === "integer" || docType === "float") {
    return { type: "number" };
  }
  // string, macro, pin (only reached here when genuinely unbound to a real
  // board resource -- see collectAndInjectSlots()'s isPinLeaf() branch,
  // which never reaches specForKey/shapeForDocType at all for a REAL pin),
  // unknown, uart_mode, floatArray, speedMap, the rgbled hex-color type --
  // all plain text, optionally with a syntax-template placeholder.
  return { type: "text", placeholder: TEXT_TYPE_PLACEHOLDERS[docType] || "" };
}

/* Full field-spec resolution for a TBD slot at (parentPath, key) -- shape
 * plus default/defaultKind -- the single function collectAndInjectSlots(),
 * setParam(), and setParamDefault() all now call, so a given field is
 * treated identically everywhere instead of each call site re-deriving its
 * own answer. Shape comes from config_items.yaml (shapeForDocType()) for
 * any item this exact path+key is documented for -- effectively everything,
 * after this session's annotation rollout -- falling back to specForKey()'s
 * much smaller hand-maintained guess only when there's no doc coverage at
 * all (docs fetch failed, or a genuinely unannotated field). default/
 * defaultKind always prefer config_items.yaml's own @default/@tuning over
 * whatever specForKey() might otherwise have guessed. */
function resolveFieldSpec(parentPath, key) {
  const docSpec = configDocSpecFor(parentPath, key);
  let spec = docSpec && docSpec.type ? shapeForDocType(key, docSpec.type, docSpec.values) : specForKey(key);
  if (docSpec && docSpec.tuning) {
    spec = Object.assign({}, spec, { defaultKind: docSpec.tuning === "typical" ? "firmware" : "suggested" });
  }
  if (docSpec && docSpec.default !== undefined) {
    spec = Object.assign({}, spec, { default: docSpec.default, placeholder: String(docSpec.default) });
  }
  return spec;
}

/* Generic two-step cascade lookup: given a step-1 category value, returns
 * the step-2 [value,label] options for it, or null if that category is
 * already a complete, non-cascading choice (coolant, unused). Spindle
 * types and user outputs (digital/analog) both go through this same
 * mechanism -- it's what keeps the primary dropdown from growing every
 * time either set grows (a new spindle type, or config_items.yaml adding
 * more digital/analog output slots).
 *
 * `basePin`, when given, drops any "pwm"-tagged field this exact physical
 * pin can't actually serve (see pinSupportsPwm()) -- e.g. a spindle:pwm
 * pin picked on an I2SO pin still offers direction_pin/enable_pin (plain
 * output, fine on I2SO), just not output_pin (needs real hardware PWM).
 * Callers that don't have a physical pin in hand (axisMotorSlotOptions()'s
 * bare axis/motor vocabulary has none to check against) simply don't pass
 * one, and nothing is filtered -- this never turns a real option list into
 * an empty one in practice (every current spindle type and generic section
 * that has a "pwm" field also has at least one plain-output field
 * alongside it, verified against config_items.yaml), but callers should
 * still treat an empty array as "nothing selectable," same as null. */
function cascadeOptionsFor(category, basePin) {
  const pwmOk = !basePin || pinSupportsPwm(basePin);
  const dropPwmOnly = (entries) => pwmOk ? entries : entries.filter(([, , attr]) => attr !== "pwm");
  if (category.startsWith("spindle:")) {
    const type = category.split(":")[1];
    return SPINDLE_TYPES[type] ? dropPwmOnly(SPINDLE_TYPES[type].pins) : null;
  }
  if (category.startsWith("axis:")) {
    return axisMotorSlotOptions();
  }
  if (GENERIC_ROLE_TREE_OUTPUT_KEYS.includes(category)) {
    // Same children EITHER_ROLE_TREE[category] already computed via
    // sectionRoleChildren() -- reused here rather than re-derived, so
    // there's exactly one place that decides what counts as e.g. a
    // coolant/status-output/sdcard pin.
    const entries = Object.entries(EITHER_ROLE_TREE[category].children).map(([k, v]) => [k, v.label, v.attr]);
    return dropPwmOnly(entries);
  }
  return null;
}

/* Top-level category options for an output-capable pin -- step 1 of the
 * two-step menu. Every category here cascades (picking one reveals step 2
 * via cascadeOptionsFor()) -- spindle types, and every generically-scanned
 * output section (coolant/status_output/sdcard/user_outputs today, see
 * GENERIC_ROLE_TREE_OUTPUT_KEYS) alike. */
function outputCategoryOptions(basePin) {
  const opts = [{ value: "unused", label: "— Unused —" }];
  Object.keys(SPINDLE_TYPES).forEach(t => opts.push({ value: `spindle:${t}`, label: `Spindle — ${SPINDLE_TYPES[t].label}` }));
  GENERIC_ROLE_TREE_OUTPUT_KEYS.forEach(k => opts.push({ value: k, label: EITHER_ROLE_TREE[k].label }));
  // RC Servo/Solenoid are single-PWM-pin "motors" (see Motors/RcServo.h,
  // Motors/Solenoid.h) -- unlike every other axis driver, they need no
  // dedicated motor socket (STEP/DIR/UART/SPI), so any output-capable pin
  // can serve as one. Step 2 (cascadeOptionsFor) picks which axis/motor
  // slot this pin drives, same vocabulary Motor sockets use.
  // Unlike a spindle type (a mix of pwm/plain fields, filtered per-field
  // by cascadeOptionsFor()), these two ARE their one pwm-tagged output_pin
  // -- there's no non-pwm fallback field to offer instead, so an I2SO pin
  // (or any other basePin pinSupportsPwm() says no to) drops the whole
  // category here rather than a sub-option later.
  if (!basePin || pinSupportsPwm(basePin)) {
    opts.push({ value: "axis:rc_servo", label: "Axis — RC Servo" });
    opts.push({ value: "axis:solenoid", label: "Axis — Solenoid" });
  }
  return opts;
}

/* Split a full role value into its category (step 1) and, for cascading
 * categories, the specific sub-value chosen in step 2. */
function roleCategory(full) {
  if (!full || full === "unused") return "unused";
  const parts = full.split(":");
  if (parts[0] === "spindle") return `spindle:${parts[1]}`;
  if (GENERIC_ROLE_TREE_OUTPUT_KEYS.includes(parts[0])) return parts[0];
  if (parts[0] === "axis") return `axis:${parts[1]}`;
  return full;
}
function roleSubValue(full) {
  const parts = (full || "").split(":");
  if (parts[0] === "spindle") return parts[2];
  if (GENERIC_ROLE_TREE_OUTPUT_KEYS.includes(parts[0])) return parts[1];
  if (parts[0] === "axis") return `${parts[2]}:${parts[3]}`;
  return undefined;
}

/* The model choice fully determines the resulting block's shape -- and,
 * critically, which top-level config.yaml KEY gets used, not just which
 * model: field value. Confirmed against the actual FluidNC source
 * (GenericFactory<Spindle>/ParserHandler.h, plus ModbusVFD.h's own doc
 * comment on its model field): config.yaml's top-level KEY NAME alone
 * (ModbusVFD vs H2A vs Huanyang, each its own factory registration) is
 * what selects the C++ class that gets constructed -- model: is parsed
 * into a string field but never read anywhere at runtime. So a supported
 * model (H2A, Huanyang, ...) MUST use its own top-level key (that class's
 * constructor is what actually supplies working cw_cmd/min_RPM/etc.
 * protocol values); writing ModbusVFD: + model: "H2A" instead constructs
 * the plain base class, whose protocol fields are all empty/sentinel --
 * silently non-functional. Model list is every concrete VFD model
 * implemented under FluidNC/src/Spindles/VFD/ in the bdring/FluidNC source
 * as of this writing (confirmed against the actual repo, not from memory)
 * -- re-check that directory if this needs to grow later. The generic
 * ModbusVFD: key itself is offered too, as "Custom / Unsupported" -- the
 * legitimate path for a VFD with no compiled-in class, where the user
 * supplies every protocol field (cw_cmd, min_RPM, ...) by hand from the
 * VFD's own Modbus register documentation; see generateDraft()'s
 * allRs485Channels.forEach for how the two cases diverge. */
const VFD_MODELS = [
  "DanfossVLT2800", "DeltaMS300", "FolinnBD600", "H100", "H2A",
  "Huanyang", "MollomG70", "NowForever", "SiemensV20", "YL620"
];
const VFD_CUSTOM = "__custom__";
function rs485RoleOptions() {
  return [
    { value: "unused", label: "— Unused —" },
    ...VFD_MODELS.map(m => ({ value: `vfd:${m}`, label: `Modbus VFD Spindle — ${m}` })),
    { value: `vfd:${VFD_CUSTOM}`, label: "Modbus VFD Spindle — Custom / Unsupported" },
  ];
}

/* Kinematics is a machine-level (not board-resource-tied) choice -- every
 * board can, in principle, host any kinematic system, so unlike motor
 * sockets/pins/RS485 this isn't walked from board.* facts. Confirmed
 * against the connected FluidNC source: Kinematics::afterParse() defaults
 * _system to a plain Cartesian when the config's "kinematics:" section (or
 * its subordinate system name) is absent, so Cartesian-with-no-subordinate-
 * items is the correct, real default -- not just a UI convenience. Other
 * compiled-in systems (see src/CMakeLists.txt's Kinematics/*.cpp list;
 * PolarArm.hx and the .cppx/.orig files alongside them are NOT compiled)
 * each register under a specific factory name and some define their own
 * subordinate config items via group() -- CoreXY and Midtbot genuinely
 * have empty group() overrides (no subordinate items at all), while
 * ParallelDelta and WallPlotter each expose a real, fixed set of geometry
 * fields. cfgKey is each type's exact registered factory name (case-
 * sensitive, confirmed from each .cpp's `KinematicsFactory::InstanceBuilder
 * registration("...")` call -- note midtbot/parallel_delta are lowercase,
 * unlike Cartesian/CoreXY/WallPlotter). stub() returns exactly the fields
 * each type's real group() exposes, TBD-stubbed like every other role. */
const KINEMATICS_TYPES = {
  Cartesian:      { cfgKey: "Cartesian", label: "Cartesian (default)", stub: () => ({}) },
  CoreXY:         { cfgKey: "CoreXY", label: "CoreXY", stub: () => ({}) },
  midtbot:        { cfgKey: "midtbot", label: "Midtbot", stub: () => ({}) },
  parallel_delta: { cfgKey: "parallel_delta", label: "Parallel Delta",
                    stub: () => ({
                      crank_mm: TBD, base_triangle_mm: TBD, linkage_mm: TBD,
                      end_effector_triangle_mm: TBD, kinematic_segment_len_mm: TBD,
                      use_servos: TBD, up_degrees: TBD,
                    }) },
  WallPlotter:    { cfgKey: "WallPlotter", label: "Wall Plotter",
                    stub: () => ({
                      left_axis: TBD, left_anchor_x: TBD, left_anchor_y: TBD,
                      right_axis: TBD, right_anchor_x: TBD, right_anchor_y: TBD,
                      segment_length: TBD,
                    }) },
};

function kinematicsOptions() {
  return Object.keys(KINEMATICS_TYPES).map(k => ({ value: k, label: KINEMATICS_TYPES[k].label }));
}

/* Optional top-level sections with no board-resource correlation at all
 * (no pins, nothing to bind on the left pane) -- Parking, Macros, OLED,
 * ATC Manual. Same "selector lives inside the draft itself" pattern as
 * Homing (see homingEnabled/ensureAxis()/homingWidgetHtml()): each gets a
 * sectionSentinel(key) planted as its own KEY in `cfg` (see generateDraft()
 * below), which a <select> replaces in the interactive view -- when
 * disabled, no trace of the real section key appears anywhere, not even an
 * empty block (a genuinely absent section is different from an empty one).
 * Field lists/defaults confirmed against fluidnc-config-schema.json's
 * macrosSection/parkingSection/oledSection/atc_manual $defs.
 *
 * atc_manual is referenced BY NAME from a spindle's own `atc:` field (see
 * SPINDLE_TYPES' stub_fields, specForKey's "atc" case) -- enabling this
 * section doesn't automatically fill that field in for you; the user still
 * has to type the literal string "atc_manual" into whichever spindle's atc:
 * field wants to reference it (same "click def, or type your own" pattern
 * as every other open text field, not a special-cased link between the two).
 *
 * "Perhaps others" beyond these four: extenders: is deprecated (not worth
 * adding a first-class toggle for a feature under active removal); every
 * other genuinely optional top-level section this schema knows about
 * (control/coolant/probe/user_outputs/user_inputs/spindle types/
 * status_outputs) IS resource-bound and already has its own left-pane
 * row(s) instead. */
// Field sets are config_items.yaml-derived (schemaStub(), above) rather than
// hand-listed -- each stub() used to be its own literal object here,
// duplicating the corresponding section's field list byte-for-byte with no
// way to notice drift if that field list ever gained/renamed a field (the
// same anti-pattern that let ModbusVFD's atc/m6_macro go missing for a full
// release cycle; see generateDraft()'s ModbusVFD block and schemaStub()'s
// own comment). Section names match config_items.yaml's own top-level keys
// directly (parking/macros/oled/atc_manual) -- no separate schema-only
// naming convention to bridge anymore.
const OPTIONAL_SECTIONS = {
  parking: { label: "Parking", stub: () => schemaStub("parking") },
  macros: { label: "Macros", stub: () => schemaStub("macros") },
  oled: { label: "OLED", stub: () => schemaStub("oled") },
  atc_manual: { label: "ATC Manual", stub: () => schemaStub("atc_manual") },
};
function sectionSentinel(key) { return `SECTIONSELECT_${key}`; }
let sectionEnabled = {};   // section key -> bool, defaults to false (falsy) if unset

/* Confirmed against real vendor documentation (4x controller wiki's own
 * "UARTS" section, verbatim): "UART0 is used for the USB/Serial port.
 * UART1 is used for the TMC2209 drivers. UART2 is the only one left to the
 * user. This means if you use it for the RS485, there are non left for
 * pendants, display, etc." -- i.e. a board with UART-addressed onboard TMC
 * drivers (detected via any motor socket's extra.bus === "uart1", a real
 * board fact already recorded for such boards) has already consumed
 * uart_num 1, so the one remaining non-USB UART for RS485/expansion is 2;
 * a board without such drivers (6x, Corgi) defaults to 1. This is a
 * WIZARD-level default, applied identically to whichever of RS485/
 * expansion UART a config actually binds -- deliberately NOT arbitrated
 * further than that, because on a TMC-UART board both would default to
 * the same remaining number 2 and only one can really be used at once
 * (confirmed by the 4x wiki's own commented-out RS485 example, which
 * literally warns "Be sure pendant is not using UART 2" and uses
 * uart_num: 2 for RS485 in that scenario) -- a genuine hardware limit (the
 * ESP32 only has 3 UART peripherals total), not a wizard bug to engineer
 * around. */
function boardHasUartTmc(b) {
  return !!(b.motor_sockets && b.motor_sockets.sockets &&
    b.motor_sockets.sockets.some(s => s.extra && s.extra.bus === "uart1"));
}

// ESP32 has 3 UART hardware peripherals total: uart0 is always reserved for
// the USB/serial console (see boardHasUartTmc()'s comment for the wiki
// source), leaving uart1 and uart2 as two genuinely INDEPENDENT "spare"
// UARTs, each with its own distinct set of assignable pins. A board WITHOUT
// onboard UART-addressed TMC drivers (which would otherwise consume uart1)
// can freely use BOTH uart1 and uart2 for two different peripherals at
// once -- e.g. RS485 on one, an expansion UART connector on the other --
// with no real hardware conflict between them. Only a board WITH onboard
// UART-TMC drivers is down to a single remaining spare (uart2). This
// replaces an earlier version of this logic that unconditionally handed
// EVERY one of RS485/expansion UART/I2C-as-UART the SAME single number on a
// non-TMC board, regardless of how many of them actually ended up bound at
// once -- silently colliding them all onto one shared uart1 block even
// though the board genuinely had a second free UART sitting unused (a real
// case that broke a real generated file -- see PROGRESS.md).
function spareUartCandidates(b) {
  return boardHasUartTmc(b) ? [2] : [1, 2];
}

// Hands out a DISTINCT number from spareUartCandidates(board) to each of
// RS485/expansion UART/I2C-as-UART as generateDraft() binds them, tracked
// via the shared `usedUartNums` Set passed in (one instance per generateDraft()
// call) -- so up to two of them can coexist on a board with two genuinely
// free UARTs. Falls back to reusing the LAST candidate once every candidate
// is already taken -- a real, unavoidable hardware conflict once every
// spare UART is spoken for (e.g. all 3 of RS485+expansion+I2C-as-UART bound
// at once with only 2 spares, or 2 of them bound at once on a UART-TMC
// board with only 1 spare), which the wizard has no further UART
// peripherals to invent
function nextSpareUartNum(board, usedUartNums) {
  const candidates = spareUartCandidates(board);
  const free = candidates.find(n => !usedUartNums.has(n));
  const n = free !== undefined ? free : candidates[candidates.length - 1];
  usedUartNums.add(n);
  return n;
}

/* ---------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------- */
let board = null;          // parsed board object
let BOARD_FIXED_ROLES = new Set(); // recomputed per board load, see computeBoardFixedRoles()
let bindings = {};         // resourceKey -> role value string
let paramValues = {};      // JSON-pointer-ish path (e.g. "axes.x.steps_per_mm") -> user-entered value
let pinAttrs = {};         // path -> { level: ""|"low"|"high", pull: ""|"pu"|"pd" }
// Set of paramValues paths (always "<SpindleCfgKey>.tool_num") whose CURRENT
// value collides with another spindle section's tool_num -- recomputed every
// generateDraft() call (see there), read by paramWidgetHtml() to flag the
// affected inputs. FluidNC requires tool numbers to be unique; the wizard
// only suggests distinct ones (see generateDraft()'s next-available-number
// block) but a user can freely type over that suggestion at any time, so
// this is a live check, not a one-time suggestion.
let toolNumConflicts = new Set();
let kinematicsType = "Cartesian"; // selected top-level kinematics system, defaults to Cartesian
/* Start: is another machine-level (not board-resource-tied) section, same
 * category as Kinematics -- confirmed against the connected FluidNC source
 * (Machine::Start, defined inline in src/Machine/MachineConfig.h): a plain
 * Configurable with exactly 3 bool fields, no enum/factory involved:
 * must_home/check_limits default true, deactivate_parking defaults false
 * (MachineConfig.h's own member initializers). The section itself is
 * optional in config.yaml (MachineConfig::afterParse() auto-instantiates a
 * default Start() if absent), but the wizard always emits it directly into
 * the draft (see generateDraft()'s Start block) with all 3 fields
 * pre-populated from their compiled-in defaults (see @tuning typical on
 * each in MachineConfig.h), editable inline -- no separate left-pane UI
 * state needed for this section at all. */
let chipGpioCaps = {};     // gpio number -> chip-file gpio fact object (see loadBoard()/pinWidgetHtml())
let genericPinProfiles = {}; // basePin string (e.g. "gpio.2") -> this board's generic_pins input_profile object, if any (see loadBoard()/pinWidgetHtml())

// I2S-shift-register virtual pins (i2so.N) are a fixed, universal fact of
// what an I2S shift-register output IS -- not a per-board or per-chip fact
// that could vary and therefore needs sourcing from a data file, unlike
// chipGpioCaps (pullup/pulldown genuinely DO vary per chip/pin and come
// from chips/<id>.chip.yaml). Same shape AND same omit-when-false
// convention as a chipGpioCaps entry (e.g. chips/esp32.chip.yaml's
// { pin: 1, input: true, output: true } leaves pullup/pulldown out rather
// than writing them as false) -- every consumer already treats absent and
// false identically (caps.pullup || caps.pulldown, caps.output), so only
// output needs stating. Consulted through one accessor (pinCapsFor()
// below) instead of ad hoc basePin.startsWith("i2so.") checks scattered
// per call site.
const I2SO_PIN_CAPS = { output: true };

// Per-pin capability record for any mcu_pin string, real (gpio.N, sourced
// from this board's chip file) or virtual (i2so.N, always I2SO_PIN_CAPS).
// Returns null for an unrecognized bus or a gpio number this chip file
// doesn't document -- callers must treat that as "unknown fact, don't
// guess" (same posture chipGpioCaps lookups already had before this
// accessor existed), never as "assume capable."
function pinCapsFor(basePin) {
  if (basePin.startsWith("i2so.")) return I2SO_PIN_CAPS;
  if (basePin.startsWith("gpio.")) return chipGpioCaps[parseInt(basePin.slice(5), 10)] || null;
  return null;
}

// Which mcu_pin BUS (gpio vs i2so) supports PWM at all -- a fact about the
// bus/pin-address-space itself, not about any individual pin within it,
// and not chip-specific either (true for any chip family this schema could
// ever describe): a GPIO-bus pin capable of digital output can drive LEDC
// PWM via the GPIO matrix; an I2SO-bus pin never can, regardless of index,
// since it's a serial shift-register output with no timer channel behind
// it. No chip.yaml/board.yaml data needed for this -- unlike pullup/
// pulldown, it doesn't vary per pin or per chip, so it isn't part of
// pinCapsFor()'s per-pin record.
const BUS_PWM_CAPABLE = { gpio: true, i2so: false };

function pinSupportsPwm(basePin) {
  const caps = pinCapsFor(basePin);
  return !!(caps && caps.output && BUS_PWM_CAPABLE[basePin.split(".")[0]]);
}

/* A pin's own conditioning circuit fixes which electrical level it reads
 * while current is actively conducting through it (e.g. an opto-isolator's
 * phototransistor pulling the signal low while its LED is lit) -- a real,
 * fixed hardware fact, independent of whether the switch wired to it is
 * Normally-Open or Normally-Closed (that's a separate, per-installation
 * choice the wizard can't know, per explicit user direction: NO and NC are
 * both in common use, so no default can be assumed). The `conditioning`
 * enum's base values (opto_isolated/rc_filtered/raw) each have a known,
 * currently-universal active level; the `_high`/`_low` suffixed variants
 * (schema/board.schema.json) exist for the rare board whose circuit
 * inverts the usual case for that conditioning type. Unlisted conditioning
 * values (level_shifted, comparator, or an unrecognized string) simply
 * aren't in this map -- pinWidgetHtml() falls back to the plain, unannotated
 * :low/:high labels for those, same graceful-degradation rule as every
 * other board-derived fact in this file. */
const CONDITIONING_ACTIVE_LEVEL = {
  opto_isolated: "low",
  opto_isolated_high: "high",
  rc_filtered: "high",
  rc_filtered_low: "low",
  raw: "high",
};
let hotspotData = null;    // parsed hotspots/<id>.hotspots.yaml, or null if this board has no photo hotspots yet
let importFailedItems = []; // failed import entries to preserve as commented YAML in the draft
// resourceKey -> [pin, pin, ...] -- every MCU pin string (e.g. "gpio.4",
// "i2so.2") a given resource physically occupies, regardless of which role
// (if any) it's currently bound to. Static per board load (see
// computeResourcePins(), called from loadBoard()); used by
// refreshGpioConflicts() to detect two DIFFERENT resources that share a
// physical pin -- the real-world case this exists for is a board's own
// documented dual-purpose connector (e.g. Corgi's gpio.4 is both a plain
// "5V Out (shared w/ MOSFET1)" pin and a "MOSFET1" driver pin -- same wire,
// two resource entries, pick one).
let resourcePins = {};
// resourceKey -> the board's own human label for it (socket.label/pin.label/
// etc.) -- same universe of keys as resourcePins, populated alongside it in
// computeResourcePins(). Used by the config.yaml importer to disambiguate a
// pin shared by multiple resources: generateDraft()'s own annotate() calls
// write this exact label into a "# <label>" comment above the pin in
// exported files, so a loaded file's comments can be matched back against
// this map to resolve an otherwise-ambiguous pin with confidence, when the
// file being imported is (or resembles) one this tool itself produced.
let resourceLabels = {};
let resourceGenericNames = {}; // resourceKey -> normalized generic_name, see computeResourcePins()
let genericNameToVendorLabel = {}; // reverse of the above, for hover text only
let lastPlainYaml = "";    // current draft as plain text (TBD where still unanswered) -- for copy/download
/* Per-axis homing: presence -- FluidNC's homing: sub-section is genuinely
 * optional (an axis with no homing: entry simply can't be homed), so unlike
 * the always-present axis fields (steps_per_mm etc.), it should NOT be
 * pre-populated with TBD stubs for every axis by default. Same "selector
 * lives inside the draft itself" pattern as Kinematics (see KINSELECT):
 * ensureAxis() plants a HOMINGSELECT_<letter> sentinel as homing:'s own
 * VALUE (unlike KINSELECT, which replaces a KEY, this replaces a VALUE --
 * homing:'s value is what varies, not its key name -- so no colon-stripping
 * trick is needed here; it's collected/replaced exactly like TBD/PINSLOT).
 * Defaults to false (No homing) for every axis until the user explicitly
 * turns it on; the final copy/download output omits the homing: key
 * entirely for any axis left disabled, rather than emitting the sentinel
 * or an empty/TBD block. */
let homingEnabled = {};    // axis letter -> bool, defaults to false (falsy) if unset

/* Any leaf whose key names a pin (ends in "_pin", or is exactly "pin" for
 * probe.pin) and whose value is a real, board-derived pin reference (not
 * the TBD sentinel, not NO_PIN -- there's nothing to attribute-tag on
 * either of those) is eligible for FluidNC pin attributes like :low/:pu. */
function isPinLeaf(key, value) {
  if (typeof value !== "string") return false;
  if (value === TBD || value === "NO_PIN") return false;
  return key.endsWith("_pin") || key === "pin";
}

/* Pin config-key names that config.yaml always uses to DRIVE something
 * (a motor driver line, a laser/spindle/coolant output, an SPI/UART/I2S
 * output line) -- FluidNC itself never reads these as inputs, so a
 * pull-up/pull-down resistor (:pu/:pd) is meaningless on them regardless
 * of what the underlying pin's conditioning/chip capability would
 * otherwise allow (see pinWidgetHtml()'s supportsPull, where this is
 * consulted as a hard floor ahead of the conditioning/chip checks -- it
 * can only ever narrow supportsPull to false, never widen it). The
 * :low/:high active-level suffix is still legitimate on these (e.g. an
 * active-low laser output_pin), so this list only suppresses the pull
 * picker, not the whole pin-attribute widget.
 * Bug: doberman's gpio.45 bound to laser's output_pin was offering :pu/:pd
 * -- output_pin is always a driven line, never a pulled-up input. */
const OUTPUT_ONLY_PIN_KEYS = new Set([
  "step_pin", "direction_pin", "disable_pin", "enable_pin", "reset_pin",
  "ms1_pin", "ms2_pin", "ms3_pin", "cs_pin",
  "output_pin", "output_cw_pin", "output_ccw_pin",
  "forward_pin", "reverse_pin",
  "phase0_pin", "phase1_pin", "phase2_pin", "phase3_pin",
  "mist_pin", "flood_pin",
  "sck_pin", "mosi_pin", "txd_pin",
  "bck_pin", "data_pin", "ws_pin",
  "shared_stepper_disable_pin", "shared_stepper_reset_pin",
]);

/* Pins feeding a fixed hardware protocol/bus -- spi:, sdcard:, i2so:, i2c:,
 * and any uartN: block (whether from a dedicated onboard TMC bus, an
 * RS485/VFD channel, or an expansion_uart's uart_channel) -- are not
 * eligible for :low/:high/:pu/:pd attributes at all: the protocol itself
 * dictates specific, fixed signal levels/timing (SPI/I2S clock polarity,
 * UART idle-high framing at a specific baud, etc.), so there's no
 * per-machine choice to make here, unlike a limit switch or spindle output
 * pin. These render as plain, non-widget text in the draft. Distinct from
 * motor_sockets/generic_pins/expansion_sockets/rs485_channels pins, which
 * ARE real per-machine wiring choices (active-low switch, pull resistor
 * needed, etc.) and keep their attribute widgets. */
function isFixedProtocolPath(path) {
  // NOTE: i2c0/i2c1/etc. (numbered, matching the real FluidNC config key --
  // see the i2c_connectors handling in generateDraft()) intentionally IS
  // still treated as a fixed-protocol bus here, even though whether it's
  // used at all is now a config-author choice (no longer a fixed
  // peripheral): once bound, its sda_pin/scl_pin are still I2C-protocol
  // pins with fixed signal requirements, same reasoning as spi/sdcard/i2so.
  return /^(spi|sdcard|i2so|i2c\d*)\./.test(path) || /^uart\d+\./.test(path);
}

/* ---------------------------------------------------------------------
 * Phase B field vocabulary: how to render a widget for a given open TBD,
 * keyed by the leaf key name. Real FluidNC has more fields than this
 * prototype models; unknown keys fall back to a plain text box.
 * ------------------------------------------------------------------- */
// Widget-shape fallback for the rare key with NO config_items.yaml doc
// coverage at all -- resolveFieldSpec() always prefers the doc-derived
// shape (shapeForDocType(), from config_items.yaml's own type/values) when
// this exact path+key is documented, which is now true across virtually
// the whole tree. Nothing left here needs its own case.
function specForKey(key) {
  return { type: "text", placeholder: "" };
}

/* Walk a freshly-cloned cfg and, in one pass, in the same order jsyaml.dump
 * will visit it: (a) record every TBD slot as before, and (b) replace
 * every real pin leaf with the sentinel "PINSLOT" (recording its original
 * value), so the dumped text's tokens can be swapped for widgets below.
 * This mutates `node` -- always call it on a clone, never the real cfg. */
/* defaultOverrides: optional path -> {default, defaultKind} map, for the
 * rare TBD field whose sensible default genuinely varies by BOARD (or even
 * by specific motor socket), not just by field name -- e.g. r_sense_ohms
 * is normally a generic per-driver-family guess (config_items.yaml's own
 * default, via resolveFieldSpec()), but a board can document its own,
 * verified-correct value for its own onboard chips (e.g. BTT Rodent's real
 * 0.075 ohm sense resistor, vs. the erroneous 0.022 its own schematic/
 * example configs show) -- see where motorBlockFor()'s tmc_5160 branch
 * records such an override during the motor-socket loop in generateDraft().
 * Merged over resolveFieldSpec()'s result so unrelated fields are
 * unaffected. */
// keySlots: EVERY key encountered, in the exact order jsyaml.dump() will
// emit their lines (same Object.keys() traversal, so this holds regardless
// of type -- TBD, pin, plain literal, or a nested object/section key).
// Used only for the plain-text tooltip pass in buildInteractiveYaml() --
// paramSlots/pinSlots already carry the same {path, key} shape for their
// own widget-rendered lines, so this just extends that same bookkeeping to
// the lines that stay plain text (config-item tooltips should cover ALL of
// them, not just the ones that happen to still be open/editable).
function collectAndInjectSlots(node, path, paramSlots, pinSlots, defaultOverrides, keySlots) {
  if (!node || typeof node !== "object") return;
  Object.keys(node).forEach(k => {
    const v = node[k];
    const p = path ? `${path}.${k}` : k;
    // __ANNOTATE_FOR_<key>__ marker keys (see annotate() in generateDraft())
    // never survive as literal "key:" text for wrapDocKeys() to find --
    // annotateYaml() always converts them to "# <label>" comment lines
    // before buildInteractiveYaml() ever scans the text. Recording a
    // keySlots entry for one anyway would permanently desync the shared
    // walking index the moment any resource gets bound (the first thing
    // that plants one of these), silently killing tooltips/underlines for
    // every plain-literal key rendered afterward, not just this one.
    if (keySlots && !/^__ANNOTATE_FOR_.*__$/.test(k)) keySlots.push({ path: p, key: k });
    if (v === TBD) {
      const override = defaultOverrides && defaultOverrides[p];
      // Two layers, most specific wins. resolveFieldSpec() resolves shape
      // (config_items.yaml's own type/values, falling back to specForKey()'s
      // much smaller hand-maintained guess only when this exact item has no
      // doc coverage at all) plus default/defaultKind from config_items.yaml's
      // @tuning/@default when present -- this is what lets e.g. BESC's
      // min_pulse_us and RcServo's min_pulse_us end up with their own
      // correct, different values despite sharing a bare field name (see
      // TUNING_CLASSIFICATION_REVIEW.md). An explicit board-specific
      // `override` -- a documented, verified fact about THIS board's own
      // hardware (e.g. the BTT Rodent's real 0.075 ohm sense resistor),
      // not just a generic classification -- wins over even that.
      const docSpec = configDocSpecFor(path, k);
      const base = resolveFieldSpec(path, k);
      // NOTE: also re-derive placeholder from the override's own default --
      // otherwise the merge below only changes spec.default/defaultKind
      // (used by the "def" button), while the input's visible placeholder
      // text -- what the user actually sees without clicking anything --
      // would keep showing the generic value (e.g. 0.11 for any
      // r_sense_ohms field) instead of the board's real, overriding one
      // (e.g. BTT Rodent's documented 0.075), silently defeating the whole
      // point of a board-specific override.
      const spec = override
        ? Object.assign({}, base, override, { placeholder: String(override.default) })
        : base;
      // A board-specific override isn't a mere suggestion the way a generic
      // per-field guess is -- it's a documented, verified-correct fact
      // about THIS board's own hardware. A `typical`-tuned field (no
      // override) is a step down from that but still safe to answer
      // without making the user click first -- both get silently pre-filled
      // immediately, rather than left as a placeholder the user must notice
      // and act on. A `per-machine`-tuned field (or one with no @tuning
      // annotation at all) stays open, same as always. Only pre-fills if
      // the user hasn't already set (or explicitly cleared) this exact
      // path, so a real edit is never silently clobbered.
      const autofillValue = override && override.default !== undefined
        ? override.default
        : (!override && docSpec && docSpec.tuning === "typical" && docSpec.default !== undefined
          ? docSpec.default
          : undefined);
      if (autofillValue !== undefined && !Object.prototype.hasOwnProperty.call(paramValues, p)) {
        paramValues[p] = autofillValue;
      }
      paramSlots.push({ path: p, key: k, spec });
    } else if (isPinLeaf(k, v) && !isFixedProtocolPath(p)) {
      pinSlots.push({ path: p, key: k, basePin: v });
      // Same autofill posture as paramSlots' typical-tuning default above:
      // a board fact (this pin's own circuit has no pull resistor, so the
      // MCU's internal one MUST be enabled -- see input_profile's
      // internal_pullup_required in board.schema.json) is silently applied
      // rather than left for the user to notice and pick via the :pu/:pd
      // picker in pinWidgetHtml(). Only when this exact path has never been
      // touched, so a user's own explicit choice (including deliberately
      // clearing it) is never clobbered on a later re-render.
      const profile = genericPinProfiles[v];
      if (profile && profile.internal_pullup_required === true && !pinAttrs[p]) {
        pinAttrs[p] = { level: "", pull: "pu" };
      }
      node[k] = "PINSLOT";
    } else if (v && typeof v === "object") {
      collectAndInjectSlots(v, p, paramSlots, pinSlots, defaultOverrides, keySlots);
    }
  });
}

// Distinct from setParam(): the "def" button always means "apply this
// field's known default value," even when that default IS the empty
// string (e.g. atc/m6_macro -- a real, meaningful value here, "no ATC
// block"/"do nothing", not "unset"). setParam() itself treats an empty
// rawValue as "clear back to TBD" (the right behavior for a user manually
// blanking a text input), so reusing it for the default button would
// silently no-op on any field whose default happens to be "". Goes
// straight to paramValues instead of through that ambiguous convention.
// domDefault is the "def" button's own data-default attribute -- the
// ALREADY-MERGED value (resolveFieldSpec()'s config_items.yaml-derived
// default, overridden by paramDefaultOverrides when one applies -- e.g. a
// board-specific r_sense_ohms, or a spindle's next-available tool_num, see
// generateDraft()) shown to the user on the button itself and used as the
// field's placeholder. Recomputing from resolveFieldSpec() alone here (the
// previous behavior, back when this called specForKey() directly) would
// silently ignore any such override -- clicking "def" would apply the
// generic value even though the button visibly promised a different
// (correct, per-instance) one. Passed as a plain HTML attribute string, so
// it needs the same type coercion setParam() already does for typed-in
// values.
function setParamDefault(path, key, domDefault) {
  const spec = resolveFieldSpec(parentPathOf(path, key), key);
  const raw = domDefault !== undefined ? domDefault : spec.default;
  if (raw === undefined) return;
  if (spec.type === "number") {
    paramValues[path] = Number(raw);
  } else if (spec.type === "enum" && (raw === "true" || raw === "false" || raw === true || raw === false)) {
    paramValues[path] = raw === "true" || raw === true;
  } else {
    paramValues[path] = raw;
  }
  generateDraft();
}

function setParam(path, key, rawValue) {
  const spec = resolveFieldSpec(parentPathOf(path, key), key);
  if (rawValue === "" || rawValue === undefined) {
    delete paramValues[path];
  } else if (spec.type === "number") {
    const n = Number(rawValue);
    if (Number.isNaN(n)) delete paramValues[path]; else paramValues[path] = n;
  } else if (spec.type === "enum" && (rawValue === "true" || rawValue === "false")) {
    paramValues[path] = rawValue === "true";
  } else if (spec.type === "enum") {
    const n = Number(rawValue);
    paramValues[path] = Number.isNaN(n) ? rawValue : n;
  } else {
    paramValues[path] = rawValue;
  }
  generateDraft();
}

function setPinAttr(path, which, value) {
  if (!pinAttrs[path]) pinAttrs[path] = { level: "", pull: "" };
  pinAttrs[path][which] = value;
  generateDraft();
}

function escapeAttr(s) {
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

function paramWidgetHtml(slot) {
  const has = Object.prototype.hasOwnProperty.call(paramValues, slot.path);
  // Duplicate tool_num across two spindle sections -- see toolNumConflicts'
  // own declaration comment. Flagged with the same "conflict" class the
  // left pane's GPIO-conflict rows use (border/background -> --danger),
  // adapted here to an inline-field rather than a whole row.
  const conflicted = toolNumConflicts.has(slot.path);
  const cls = "inline-field" + (has ? " filled" : "") + (conflicted ? " conflict" : "");
  // Doc tooltip (config_items.yaml, see lookupItemDoc()) combined with the
  // tool_num conflict warning when both apply -- the conflict is the more
  // urgent thing to notice, so it comes first.
  const conflictText = conflicted ? `Tool number ${paramValues[slot.path]} is also used by another spindle -- FluidNC requires each to be unique` : null;
  const docText = lookupItemDoc(parentPathOf(slot.path, slot.key), slot.key);
  const combinedTitle = [conflictText, docText].filter(Boolean).join("\n\n");
  const titleAttr = combinedTitle ? ` title="${escapeAttr(combinedTitle)}"` : "";
  let html;
  if (slot.spec.type === "enum") {
    const cur = has ? String(paramValues[slot.path]) : "";
    let opts = `<option value="">${TBD}</option>`;
    slot.spec.options.forEach(([val, label]) => {
      opts += `<option value="${escapeAttr(val)}"${val === cur ? " selected" : ""}>${escapeHtml(label)}</option>`;
    });
    html = `<select class="${cls}"${titleAttr} data-path="${escapeAttr(slot.path)}" data-key="${escapeAttr(slot.key)}">${opts}</select>`;
  } else {
    const cur = has ? paramValues[slot.path] : "";
    const type = slot.spec.type === "number" ? "number" : "text";
    const step = slot.spec.type === "number" ? ` step="any"` : "";
    // Once answered (has === true), the TBD placeholder is dropped
    // entirely rather than just recolored -- an empty, answered field
    // (e.g. atc/m6_macro's real "" default) would otherwise still show
    // TBD as ghost text, indistinguishable at a glance from a genuinely
    // still-open field despite the border/text color already having
    // changed. Only ever shown for a real UNANSWERED field.
    const placeholder = has ? "" : (slot.spec.placeholder || TBD);
    html = `<input class="${cls}" type="${type}"${step}${titleAttr} placeholder="${escapeAttr(placeholder)}" value="${escapeAttr(cur)}" data-path="${escapeAttr(slot.path)}" data-key="${escapeAttr(slot.key)}">`;
  }
  if (slot.spec.default !== undefined) {
    const kindLabel = slot.spec.defaultKind === "firmware" ? "FluidNC firmware default"
      : slot.spec.defaultKind === "board" ? "this board's own documented/corrected value"
      : "suggested starting value — verify for your hardware";
    html += `<button type="button" class="inline-btn default-btn" data-path="${escapeAttr(slot.path)}" data-key="${escapeAttr(slot.key)}" data-default="${escapeAttr(slot.spec.default)}" title="Set ${kindLabel}: ${escapeAttr(slot.spec.default)}">def</button>`;
  }
  html += `<button type="button" class="inline-btn clear-btn" data-path="${escapeAttr(slot.path)}" data-key="${escapeAttr(slot.key)}" title="Clear (back to TBD)">✕</button>`;
  return html;
}

/* FluidNC pin attributes: :low/:high (active level) and :pu/:pd (pull
 * resistor) can be attached to any real pin reference. The base pin itself
 * (a board-derived fact) is shown read-only; these two small pickers just
 * append the optional suffixes. */
function pinWidgetHtml(slot) {
  const attrs = pinAttrs[slot.path] || { level: "", pull: "" };
  const profile = genericPinProfiles[slot.basePin];
  // Annotate the :low/:high options with which switch type each one means
  // in practice, derived from this pin's own conducting-level fact (see
  // CONDITIONING_ACTIVE_LEVEL's own comment) -- e.g. an opto-isolated pin
  // (active low) reads :low for a Normally-Open switch, :high for
  // Normally-Closed; an active-high pin is the mirror image. Falls back to
  // plain, unannotated labels when the pin's conditioning isn't in that
  // map (unknown fact -- don't guess).
  const activeLevel = profile && CONDITIONING_ACTIVE_LEVEL[profile.conditioning];
  // When this pin's active level is known, leaving the picker blank is a
  // REAL, consequential choice (silently means active-high, FluidNC's
  // compiled-in default) that's easy to make by simply never touching the
  // control -- exactly the kind of silent-wrong-default this whole feature
  // exists to prevent. So for these pins the blank option reads TBD and
  // is styled like any other open TBD field (see the .attr-field.tbd CSS
  // rule) until the user actively picks one, rather than looking identical
  // to "I deliberately want no suffix." Pins with no known active level
  // (unrecognized/no conditioning fact) keep the plain "—" -- there's
  // nothing here to prompt a decision about.
  const levelOpts = activeLevel === "low"
    ? [["", TBD], ["low", ":low (NO switch)"], ["high", ":high (NC switch)"]]
    : activeLevel === "high"
    ? [["", TBD], ["low", ":low (NC switch)"], ["high", ":high (NO switch)"]]
    : [["", "—"], ["low", ":low"], ["high", ":high"]];
  const pullOpts = [["", "—"], ["pu", ":pu"], ["pd", ":pd"]];
  // I2SO pins are outputs of an external shift register, not real GPIOs --
  // they have no pull-up/pull-down capability at all, so no chip lookup
  // applies to them. Real gpio.* pins: consult the board's mcu_chip file
  // (chipGpioCaps, built in loadBoard()) for the true per-pin pullup/
  // pulldown capability -- e.g. the ESP32's own input-only pins (34-39)
  // have neither, a chip-level fact, not a board-level one (per explicit
  // user direction: this should be sourced from the chip file, not
  // restated/guessed per board).
  // Hard floor #1 (checked before the chip/conditioning facts below, and
  // unlike those, keyed off the CONFIG KEY name rather than the physical
  // pin -- see OUTPUT_ONLY_PIN_KEYS's own comment): this exact config.yaml
  // field always drives something (motor line, laser/spindle/coolant
  // output, SPI/UART/I2S output line). FluidNC never reads it as an input,
  // so no pull resistor is meaningful here regardless of what the pin
  // itself is otherwise capable of.
  let supportsPull = !OUTPUT_ONLY_PIN_KEYS.has(slot.key);
  if (supportsPull) {
    const caps = pinCapsFor(slot.basePin);
    if (caps) supportsPull = !!(caps.pullup || caps.pulldown);
  }
  // Board-level override, by conditioning -- chip capability above is a
  // hard floor (e.g. the ESP32's own input-only pins 34-39 physically have
  // no pull resistors at all, raw or not, so it can only ever narrow
  // supportsPull, never widen past what the chip allows):
  //  - opto_isolated (or _high): the pull picker is only useful when this
  //    exact pin's own internal_pullup_required is explicitly true (the
  //    only known case: corgi's gpio.2, whose board circuit provides no
  //    pull resistor of its own). Schema default is false and board files
  //    now omit the field entirely in that common case, so "true" is the
  //    only value that ever means anything here.
  //  - rc_filtered (or _low): never useful -- this conditioning's own
  //    filtering circuit always includes its own pull, so suppress
  //    unconditionally regardless of internal_pullup_required.
  //  - raw (or unrecognized/no profile): no override -- leave the
  //    chip-capability answer as-is (raw pins commonly DO rely on the
  //    MCU's internal pull, so don't suppress them the way rc_filtered's
  //    always gets suppressed).
  // NOTE: despite the similarly-named internal_pullup_required, none of
  // this is related to a switch's active-high/active-low :level -- that
  // depends on the conditioning circuit's conducting-level fact and the
  // physical switch's NO/NC wiring (see CONDITIONING_ACTIVE_LEVEL above).
  if (supportsPull && profile) {
    const cond = profile.conditioning;
    if (cond === "opto_isolated" || cond === "opto_isolated_high") {
      supportsPull = profile.internal_pullup_required === true;
    } else if (cond === "rc_filtered" || cond === "rc_filtered_low") {
      supportsPull = false;
    }
  }
  const pinDocText = lookupItemDoc(parentPathOf(slot.path, slot.key), slot.key);
  const pinTitleAttr = pinDocText ? ` title="${escapeAttr(pinDocText)}"` : "";
  let html = `<span class="fixed-fact"${pinTitleAttr}>${escapeHtml(slot.basePin)}</span>`;
  const levelTitle = activeLevel
    ? "Active level (:low / :high) -- this pin's conditioning circuit tells FluidNC which switch type each choice matches; pick the one matching your actual switch."
    : "Active level (:low / :high)";
  const levelClass = attrs.level ? " set" : (activeLevel ? " tbd" : "");
  html += `<select class="attr-field${levelClass}" data-path="${escapeAttr(slot.path)}" data-attr="level" title="${escapeAttr(levelTitle)}">` +
    levelOpts.map(([v,l]) => `<option value="${v}"${attrs.level===v?" selected":""}>${l}</option>`).join("") + `</select>`;
  if (supportsPull) {
    html += `<select class="attr-field${attrs.pull ? " set" : ""}" data-path="${escapeAttr(slot.path)}" data-attr="pull" title="Pull resistor (:pu / :pd)">` +
      pullOpts.map(([v,l]) => `<option value="${v}"${attrs.pull===v?" selected":""}>${l}</option>`).join("") + `</select>`;
  }
  return html;
}

/* Build the inline-editable HTML for the <pre>: every TBD or "PINSLOT"
 * token in the dumped YAML text is replaced, in order, by the matching
 * widget -- editable right where it sits in the document, pre-filled if
 * already answered, so fixing a mistake is just clicking the same spot
 * again rather than hunting a separate list. */
const HOMING_SENTINEL_RE = new RegExp(`^HOMINGSELECT_(${AXES.join("|")})$`);
const SECTION_SENTINEL_RE = new RegExp(`^SECTIONSELECT_(${Object.keys(OPTIONAL_SECTIONS).join("|")})$`);
const VFD_OVERRIDE_SENTINEL_RE = new RegExp(`^VFDOVERRIDE_(${VFD_MODELS.join("|")})$`);

// Wraps every recognized "key:" at the start of a line (within an already-
// HTML-escaped plain-text chunk -- called AFTER escapeHtml(), never before,
// since it injects real <span> markup that escapeHtml() would otherwise
// mangle) in a titled span carrying that key's config-item doc text, if
// any. `keySlots` (built alongside paramSlots/pinSlots by
// collectAndInjectSlots(), see its own comment) is consumed in lockstep,
// one entry per regex match -- both walk the exact same document in the
// exact same order, so they should always line up; the `slot.key === key`
// guard below is a pure safety net (skip silently, don't advance `ki`) in
// case that assumption is ever wrong, so a mismatch can only cost a missing
// tooltip, never a wrong one or a rendering break -- this function's output
// is ADDITIVE decoration on top of text that already rendered correctly
// without it.
function wrapDocKeys(escapedText, keySlots, kiRef) {
  return escapedText.replace(/^(\s*)([A-Za-z_][A-Za-z0-9_]*):/gm, (whole, indent, key) => {
    const slot = keySlots[kiRef.i];
    if (!slot || slot.key !== key) return whole;
    kiRef.i++;
    const doc = lookupItemDoc(parentPathOf(slot.path, slot.key), slot.key);
    return doc ? `${indent}<span class="doc-key" title="${escapeAttr(doc)}">${key}</span>:` : whole;
  });
}

function buildInteractiveYaml(yamlText, paramSlots, pinSlots, keySlots) {
  const tokens = yamlText.split(new RegExp(`(${TBD}|PINSLOT|KINSELECT|HOMINGSELECT_[a-z]+|SECTIONSELECT_[a-z_]+|VFDOVERRIDE_[A-Za-z0-9]+)`));
  let html = "";
  let pi = 0, si = 0;
  // Plain object (not a bare let) so wrapDocKeys() can advance it by
  // reference -- a bare number param would just be copied, not mutated.
  const ki = { i: 0 };
  let stripLeadingColon = false;
  tokens.forEach(tok => {
    const homingMatch = tok.match(HOMING_SENTINEL_RE);
    const sectionMatch = tok.match(SECTION_SENTINEL_RE);
    const vfdMatch = tok.match(VFD_OVERRIDE_SENTINEL_RE);
    if (tok === TBD) {
      html += paramWidgetHtml(paramSlots[pi++]);
    } else if (tok === "PINSLOT") {
      html += pinWidgetHtml(pinSlots[si++]);
    } else if (tok === "KINSELECT") {
      // kinWidgetHtml() already appends its own trailing ":" as part of the
      // label -- the very next chunk of yamlText is js-yaml's own literal
      // ": " for this same key, which would otherwise duplicate it right
      // after the select's arrow. Strip exactly that one leading colon
      // from the next plain-text chunk.
      html += kinWidgetHtml();
      stripLeadingColon = true;
      // KINSELECT (like HOMINGSELECT_*/SECTIONSELECT_* below) sits in the
      // KEY position of its own line, not a value -- collectAndInjectSlots()
      // still recorded a keySlots entry for it (every key gets one,
      // unconditionally), but that entry's text never appears in a plain
      // chunk for wrapDocKeys() to find (tokens.split() extracted the whole
      // word out as its own token, same as this branch matching it here).
      // Skip over it so the NEXT keySlots entry (kinematics' first real
      // tuning field) is what the next plain-text chunk actually matches.
      ki.i++;
    } else if (homingMatch) {
      // Same KEY-replacement idea as KINSELECT (not a value-position
      // sentinel): this axis's homing entry is keyed by
      // HOMINGSELECT_<letter> in `cfg` itself (see ensureAxis()), whether
      // enabled or not, so the selector always sits exactly where the real
      // "homing:" key belongs -- a non-existent homing: section really is
      // different from an empty one, so the interactive view shouldn't
      // show homing: at all when disabled, only this selector. The
      // following literal ": " (plus a literal "null" when disabled) is
      // js-yaml's own text for this same key/value and needs stripping,
      // same reasoning as KINSELECT.
      html += homingWidgetHtml(homingMatch[1]);
      stripLeadingColon = true;
      ki.i++; // same keySlots-skip reasoning as KINSELECT above
    } else if (sectionMatch) {
      // Same idea again, one level up: SECTIONSELECT_<key> is the sentinel
      // KEY for one of OPTIONAL_SECTIONS (parking/macros/oled/atc_manual),
      // planted by generateDraft() regardless of enabled state -- see
      // OPTIONAL_SECTIONS' own declaration comment.
      html += sectionWidgetHtml(sectionMatch[1]);
      stripLeadingColon = true;
      ki.i++; // same keySlots-skip reasoning as KINSELECT above
    } else if (vfdMatch) {
      // Same idea again, one level deeper (inside a known VFD model's own
      // block instead of at cfg's top level): VFDOVERRIDE_<topKey> is the
      // sentinel KEY for that model's whole group of vfdProtocolFields(),
      // planted by generateDraft() regardless of enabled state -- see
      // vfdOverrideSentinel()'s own declaration comment. Enabled, its value
      // is a nested stub object (the 10 protocol fields, each its own TBD)
      // that recurses/renders exactly like any other nested section; the
      // group selector itself only ever replaces this one KEY line, not
      // the fields underneath it.
      html += vfdOverrideGroupWidgetHtml(vfdMatch[1]);
      stripLeadingColon = true;
      ki.i++; // same keySlots-skip reasoning as KINSELECT above
    } else {
      const text = stripLeadingColon ? tok.replace(/^:(\s*null)?/, "") : tok;
      stripLeadingColon = false;
      html += wrapDocKeys(escapeHtml(text), keySlots, ki);
    }
  });
  return html;
}

/* Kinematics system selector -- lives INSIDE the generated draft itself
 * (right pane), not the left pane's resource-assignment list, since it
 * isn't a board-resource binding at all (any board can in principle host
 * any kinematic system -- see KINEMATICS_TYPES' own declaration comment).
 * Implemented the same way PINSLOT/TBD are: generateDraft() plants a
 * literal "KINSELECT" sentinel as the kinematics: block's own key (see
 * `cfg.kinematics = { KINSELECT: kt.stub() }`), which survives js-yaml's
 * dump as plain unquoted text and gets tokenized out here exactly like any
 * other sentinel, then replaced with a real <select>. Wired up alongside
 * the other #draft widget classes in generateDraft(). */
function kinWidgetHtml() {
  // Option text is each system's real cfgKey (Cartesian/CoreXY/midtbot/
  // parallel_delta/WallPlotter) -- i.e. exactly the section-name text that
  // ends up in the actual key position, not KINEMATICS_TYPES' more
  // elaborated display label (e.g. "Parallel Delta") -- so the dropdown,
  // sitting inline where a YAML key normally goes, still reads like a
  // real, valid config file rather than an elaborated UI description.
  // The ":" is baked into each option's own text (not appended after
  // </select>) so it reads "Cartesian:" BEFORE the native dropdown arrow,
  // exactly where a real YAML key's colon belongs -- a colon placed after
  // the closing </select> tag would render after the arrow instead, which
  // looks wrong (a native <select>'s arrow is always the box's last visual
  // element; nothing can be placed between the label text and the arrow
  // except by putting it inside the option text itself).
  let html = `<select class="kin-select">`;
  Object.keys(KINEMATICS_TYPES).forEach(k => {
    const cfgKey = KINEMATICS_TYPES[k].cfgKey;
    html += `<option value="${escapeAttr(k)}"${k === kinematicsType ? " selected" : ""}>${escapeHtml(cfgKey)}:</option>`;
  });
  html += `</select>`;
  return html;
}

/* Per-axis homing: presence selector -- see homingEnabled's own declaration
 * comment. Same KEY-replacement idea as kinWidgetHtml(): this axis's own
 * homing entry is keyed by HOMINGSELECT_<letter> in `cfg`/`liveCfg`
 * regardless of state (see ensureAxis()), so the selector always sits
 * exactly at the position homing:'s KEY would occupy -- when disabled, no
 * "homing:" text appears anywhere, only this selector (a non-existent
 * section really is different from an empty one). Only the enabled
 * option's text bakes in a trailing ":" (matching the real "homing:" key
 * text, before the arrow, same reasoning as kinWidgetHtml's cfgKey
 * options) -- the disabled option deliberately has none, since "No
 * homing" never becomes a real YAML key at all. */
function homingWidgetHtml(letter) {
  const enabled = !!homingEnabled[letter];
  let html = `<select class="homing-select" data-letter="${escapeAttr(letter)}">`;
  html += `<option value="false"${enabled ? "" : " selected"}>— No homing —</option>`;
  html += `<option value="true"${enabled ? " selected" : ""}>homing:</option>`;
  html += `</select>`;
  return html;
}

/* Optional-section presence selector -- see OPTIONAL_SECTIONS' own
 * declaration comment. Same pattern as homingWidgetHtml() one level up
 * (top-level key instead of a per-axis one): sectionSentinel(key) sits
 * exactly where the real section key (parking:/macros:/oled:/atc_manual:)
 * would go, so disabling it leaves no trace of that key at all. */
function sectionWidgetHtml(key) {
  const enabled = !!sectionEnabled[key];
  const def = OPTIONAL_SECTIONS[key];
  let html = `<select class="section-select" data-section="${escapeAttr(key)}">`;
  html += `<option value="false"${enabled ? "" : " selected"}>— ${escapeHtml(def.label)}: not included —</option>`;
  html += `<option value="true"${enabled ? " selected" : ""}>${escapeHtml(key)}:</option>`;
  html += `</select>`;
  return html;
}

/* "Override VFD Protocol" group selector -- see vfdOverrideSentinel()'s own
 * declaration comment. Same pattern as sectionWidgetHtml() one level
 * deeper (inside a known VFD model's own block instead of at cfg's top
 * level): vfdOverrideSentinel(topKey) sits exactly where the group's own
 * fields would begin, so collapsing it leaves no trace of any of the 10
 * protocol fields (or their names) at all -- one selector for the whole
 * group, not 10, since there's no compiled default the group could be
 * "partially" overriding anyway -- either the model's own built-in values
 * are trusted, or the user is supplying their own for whichever fields
 * they choose to answer. */
function vfdOverrideGroupWidgetHtml(topKey) {
  const enabled = !!vfdOverrideEnabled[topKey];
  let html = `<select class="vfd-override-select" data-topkey="${escapeAttr(topKey)}">`;
  html += `<option value="false"${enabled ? "" : " selected"}>— (uses model default) —</option>`;
  html += `<option value="true"${enabled ? " selected" : ""}>Override VFD Protocol...</option>`;
  html += `</select>`;
  return html;
}

function resourceKeyMotor(i) { return `motor:${i}`; }
function resourceKeyPin(i) { return `pin:${i}`; }
function resourceKeyRs485(i) { return `rs485:${i}`; }
function resourceKeyExpUart(i) { return `expuart:${i}`; }
function resourceKeyI2c(i) { return `i2c:${i}`; }
// Module sockets (see MODULE_CATALOG/resolveModuleSocketConnectors() below):
// resourceKeyModuleSocket(si) is the socket's OWN "which module is plugged
// in here" choice; resourceKeyModConn(si, ci) is the ci-th resolved
// connector of whichever module currently occupies socket si -- si here is
// the same board.expansion_sockets array index a now-removed per-pin key
// function (resourceKeyExp) used to key individual raw pins under before
// module sockets existed as their own concept (see
// computeResourcePins()/renderResources()/generateDraft() for where that
// old per-pin dispatch was replaced).
function resourceKeyModuleSocket(si) { return `modsock:${si}`; }
function resourceKeyModConn(si, ci) { return `modconn:${si}:${ci}`; }

/* ---------------------------------------------------------------------
 * Rendering
 * ------------------------------------------------------------------- */
async function loadBoard(id) {
  let boardText;
  try {
    boardText = await fetchYamlText(`boards/${id}.board.yaml`);
  } catch (e) {
    // #boardNote only exists in the pane's initial placeholder markup --
    // renderResources() below replaces #resourceCol's entire innerHTML on
    // every successful load, so #boardNote is gone after the first one.
    // #resourceCol itself is never replaced (it's the element renderResources()
    // writes INTO), so that's the stable place to report a load failure,
    // whether this is the very first load or a later one that failed.
    document.getElementById("resourceCol").innerHTML = `<div class="note note-error">` +
      `Couldn't load boards/${escapeAttr(id)}.board.yaml (${escapeAttr(e.message)}). If you opened this page via a ` +
      `file:// URL, browsers block fetch() of local files -- serve this folder over HTTP instead ` +
      `(e.g. "python3 -m http.server" from a terminal here, then open http://localhost:8000/index.html).</div>`;
    return;
  }
  let doc;
  try {
    doc = jsyaml.load(boardText);
  } catch (e) {
    document.getElementById("resourceCol").innerHTML = `<div class="note note-error">` +
      `Couldn't parse boards/${escapeAttr(id)}.board.yaml (${escapeAttr(e.message)}).</div>`;
    return;
  }
  // hotspots/<id>.hotspots.yaml is a repo-relative convention that only
  // makes sense for boards actually living in boards/ under this id --
  // applyBoardDoc() is also used for locally-picked custom board files
  // (see loadCustomBoardFile() below), which have no such counterpart.
  await applyBoardDoc(doc, id);
}

/* Shared tail of loadBoard()/loadCustomBoardFile(): takes an already-
 * parsed board document (and, optionally, the repo id used to look up its
 * hotspots.yaml sidecar -- pass null/undefined to skip that lookup, as a
 * custom locally-picked board.yaml has none) and applies it as the
 * currently-loaded board. */
async function applyBoardDoc(doc, hotspotId) {
  board = doc;
  BOARD_FIXED_ROLES = computeBoardFixedRoles();
  bindings = {};
  paramValues = {};
  pinAttrs = {};
  kinematicsType = "Cartesian";
  homingEnabled = {};
  sectionEnabled = {};
  vfdOverrideEnabled = {};
  // Build a per-GPIO-number capability lookup from this board's referenced
  // mcu_chip file (see pinWidgetHtml()'s use of chipGpioCaps) -- chip-level
  // facts (pullup/pulldown support etc.) belong here, not in the board file.
  chipGpioCaps = {};
  const chipId = board.board && board.board.mcu_chip;
  if (chipId) {
    const chipText = await fetchYamlTextOptional(`chips/${chipId}.chip.yaml`);
    if (chipText) {
      const chip = jsyaml.load(chipText);
      (chip.gpio || []).forEach(g => { chipGpioCaps[g.pin] = g; });
    }
  }
  // Per-pin input_profile facts (board-level, not chip-level -- e.g. an
